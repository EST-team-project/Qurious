<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="764" viewBox="0 96 1920 764" role="img" aria-labelledby="title desc">
  <title id="title">매일 12:30, 한 회차가 21단계를 차례로 지난다</title>
  <desc id="desc">작업 스케줄러(매일 12:30)와 PC 작업자(매 분 · 화면의 수집 요청)가 수집 러너를 부른다. 러너는 받기 8단계(시세 · 배당 · 공시 · 재무 · 기업 일정 · 정책뉴스 · 언론사 기사 · 시장금리), 계산 7단계(검색 색인 · 시장 달력 · 수정주가 · 총수익 · 벤치마크 · 일봉과 분봉 · 신호), 백업 5단계(목록표 · 내보내기 · 대조 · 올리기 · 일봉 올리기), 근거 문서 1단계(섹터 법령 · 7일에 한 번 개정 대조)를 차례로 돌린다. 원본을 다 받은 뒤에만 계산하고 계산이 끝난 뒤에만 백업한다. 단계마다 결과 · 걸린 시간 · 실패 까닭이 회차 기록에 남고 화면 「데이터 관제」 가 읽는다. 10-19 회차는 12:30:01 ~ 13:24:43, 가장 긴 단계는 수정주가 749초 · 총수익 738초 · 일봉 628초.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/><stop offset="0.55" stop-color="#0b1728"/><stop offset="1" stop-color="#101a2d"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172e52"/><stop offset="1" stop-color="#10233f"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#302557"/><stop offset="1" stop-color="#1d2140"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#143c3e"/><stop offset="1" stop-color="#102b32"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#44351f"/><stop offset="1" stop-color="#2a281f"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173a4a"/><stop offset="1" stop-color="#112834"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000814" flood-opacity=".45"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7fa7d8"/>
    </marker>
    <marker id="arrowS" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7fa7d8"/>
    </marker>
    <style>
      text{font-family:'Pretendard Variable','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#f5f8ff}
      .title{font-size:38px;font-weight:800;letter-spacing:-1px}
      .subtitle{font-size:22px;fill:#aebcd1}
      .zone{font-size:24px;font-weight:800;letter-spacing:1px}
      .h1{font-size:34px;font-weight:800}
      .h2{font-size:30px;font-weight:800}
      .body{font-size:24px;fill:#c7d3e5}
      .small{font-size:20px;fill:#aebcd1}
      .pill{font-size:20px;font-weight:700}
      .step{font-size:24px;font-weight:700;fill:#eef4ff}
      .num{font-size:20px;font-weight:800}
      .card{stroke-width:2;filter:url(#shadow)}
      .chip{fill:#0a1525;fill-opacity:.6;stroke-width:1.5}
      .line{fill:none;stroke:#7fa7d8;stroke-width:4;marker-end:url(#arrow)}
      .lineS{fill:none;stroke:#7fa7d8;stroke-width:4;marker-end:url(#arrowS)}
      .dash{fill:none;stroke:#6984a6;stroke-width:3;stroke-dasharray:10 10;marker-end:url(#arrow)}
      .bus{fill:none;stroke:#6984a6;stroke-width:3;stroke-dasharray:10 10}
    </style>
  </defs>

  <rect data-bg="1" width="1920" height="860" fill="url(#bg)"/>
  <circle cx="1560" cy="150" r="320" fill="#1e3a60" opacity=".12"/>
  <circle cx="520" cy="760" r="360" fill="#194c47" opacity=".09"/>

  <text data-free="1" x="50" y="52" class="title">매일 12:30, 한 회차가 21단계를 차례로 지난다</text>
  <text data-free="1" x="52" y="88" class="subtitle">수집 러너가 받기 8 · 계산 7 · 백업 5 · 근거 문서 1 을 차례로 돌린다 · 단계 차례는 러너의 단계 목록 · 시각은 2026-10-19 회차 기록</text>

  <!-- 위 줄: 부르는 쪽 둘 → 수집 러너 -->
  <rect x="50" y="102" width="400" height="98" rx="22" fill="url(#teal)" stroke="#38bdf8" class="card"/>
  <circle cx="96" cy="150" r="22" fill="none" stroke="#7dd3fc" stroke-width="4"/>
  <path d="M96 136V150L106 158" fill="none" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round"/>
  <text x="136" y="144" class="h2">작업 스케줄러</text>
  <text x="136" y="184" class="body">매일 12:30</text>

  <rect x="510" y="102" width="900" height="98" rx="22" fill="url(#blue)" stroke="#4d82cc" class="card"/>
  <text x="630" y="162" class="h2">수집 러너</text>
  <rect x="806" y="128" width="100" height="46" rx="22" fill="#2563eb" opacity=".55"/>
  <text x="856" y="161" text-anchor="middle" class="step">잠금</text>
  <rect x="920" y="128" width="156" height="46" rx="22" fill="#2563eb" opacity=".55"/>
  <text x="998" y="161" text-anchor="middle" class="step">회차 기록</text>
  <rect x="1090" y="128" width="200" height="46" rx="22" fill="#2563eb" opacity=".55"/>
  <text x="1190" y="161" text-anchor="middle" class="step">종료코드 약속</text>

  <rect x="1470" y="102" width="400" height="98" rx="22" fill="url(#teal)" stroke="#38bdf8" class="card"/>
  <rect x="1494" y="132" width="44" height="30" rx="4" fill="none" stroke="#7dd3fc" stroke-width="4"/>
  <path d="M1508 170H1524M1516 162V170" fill="none" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round"/>
  <text x="1556" y="144" class="h2">PC 작업자</text>
  <text x="1556" y="184" class="body">매 분 · 화면의 수집 요청</text>

  <path class="line" d="M452 150H506"/>
  <path class="line" d="M1468 150H1414"/>
  <path class="lineS" d="M560 196V216H276V238"/>

  <!-- 가운데: 네 묶음 -->
  <!-- 받기 8 -->
  <rect x="50" y="244" width="452" height="360" rx="24" fill="url(#amber)" stroke="#c2953b" class="card"/>
  <rect x="74" y="264" width="148" height="40" rx="20" fill="#b8892c"/>
  <text x="148" y="292" text-anchor="middle" class="pill">받기 · 8단계</text>
  <text x="74" y="344" class="h2">바깥 출처에서 원본을 받는다</text>
  <g>
    <rect x="74" y="366" width="196" height="46" rx="12" stroke="#c2953b" class="chip"/>
    <text x="86" y="397" class="num" style="fill:#fcd38d">01</text><text x="120" y="398" class="step">시세</text>
    <rect x="74" y="422" width="196" height="46" rx="12" stroke="#c2953b" class="chip"/>
    <text x="86" y="453" class="num" style="fill:#fcd38d">02</text><text x="120" y="454" class="step">배당</text>
    <rect x="74" y="478" width="196" height="46" rx="12" stroke="#c2953b" class="chip"/>
    <text x="86" y="509" class="num" style="fill:#fcd38d">03</text><text x="120" y="510" class="step">공시</text>
    <rect x="74" y="534" width="196" height="46" rx="12" stroke="#c2953b" class="chip"/>
    <text x="86" y="565" class="num" style="fill:#fcd38d">04</text><text x="120" y="566" class="step">재무</text>
    <rect x="282" y="366" width="196" height="46" rx="12" stroke="#c2953b" class="chip"/>
    <text x="294" y="397" class="num" style="fill:#fcd38d">05</text><text x="328" y="398" class="step">기업 일정</text>
    <rect x="282" y="422" width="196" height="46" rx="12" stroke="#c2953b" class="chip"/>
    <text x="294" y="453" class="num" style="fill:#fcd38d">06</text><text x="328" y="454" class="step">정책뉴스</text>
    <rect x="282" y="478" width="196" height="46" rx="12" stroke="#c2953b" class="chip"/>
    <text x="294" y="509" class="num" style="fill:#fcd38d">07</text><text x="328" y="510" class="step">언론사 기사</text>
    <rect x="282" y="534" width="196" height="46" rx="12" stroke="#c2953b" class="chip"/>
    <text x="294" y="565" class="num" style="fill:#fcd38d">08</text><text x="328" y="566" class="step">시장금리</text>
  </g>

  <!-- 계산 7 -->
  <rect x="542" y="244" width="430" height="360" rx="24" fill="url(#violet)" stroke="#8b78db" class="card"/>
  <rect x="566" y="264" width="148" height="40" rx="20" fill="#6d5ae0"/>
  <text x="640" y="292" text-anchor="middle" class="pill">계산 · 7단계</text>
  <text x="566" y="344" class="h2">원본에서 다시 만든다</text>
  <g>
    <rect x="566" y="366" width="185" height="46" rx="12" stroke="#8b78db" class="chip"/>
    <text x="578" y="397" class="num" style="fill:#c4b5fd">09</text><text x="612" y="398" class="step">검색 색인</text>
    <rect x="566" y="422" width="185" height="46" rx="12" stroke="#8b78db" class="chip"/>
    <text x="578" y="453" class="num" style="fill:#c4b5fd">10</text><text x="612" y="454" class="step">시장 달력</text>
    <rect x="566" y="478" width="185" height="46" rx="12" stroke="#8b78db" class="chip"/>
    <text x="578" y="509" class="num" style="fill:#c4b5fd">11</text><text x="612" y="510" class="step">수정주가</text>
    <rect x="566" y="534" width="185" height="46" rx="12" stroke="#8b78db" class="chip"/>
    <text x="578" y="565" class="num" style="fill:#c4b5fd">12</text><text x="612" y="566" class="step">총수익</text>
    <rect x="763" y="366" width="185" height="46" rx="12" stroke="#8b78db" class="chip"/>
    <text x="775" y="397" class="num" style="fill:#c4b5fd">13</text><text x="809" y="398" class="step">벤치마크</text>
    <rect x="763" y="422" width="185" height="46" rx="12" stroke="#8b78db" class="chip"/>
    <text x="775" y="453" class="num" style="fill:#c4b5fd">14</text><text x="809" y="454" class="step">일봉 · 분봉</text>
    <rect x="763" y="478" width="185" height="46" rx="12" stroke="#8b78db" class="chip"/>
    <text x="775" y="509" class="num" style="fill:#c4b5fd">15</text><text x="809" y="510" class="step">신호</text>
  </g>

  <!-- 백업 5 -->
  <rect x="1012" y="244" width="440" height="360" rx="24" fill="url(#green)" stroke="#2fa38a" class="card"/>
  <rect x="1036" y="264" width="148" height="40" rx="20" fill="#0f8f74"/>
  <text x="1110" y="292" text-anchor="middle" class="pill">백업 · 5단계</text>
  <text x="1036" y="344" class="h2">지문을 남기고 올린다</text>
  <g>
    <rect x="1036" y="366" width="190" height="46" rx="12" stroke="#2fa38a" class="chip"/>
    <text x="1048" y="397" class="num" style="fill:#6ee7b7">16</text><text x="1082" y="398" class="step">목록표</text>
    <rect x="1036" y="422" width="190" height="46" rx="12" stroke="#2fa38a" class="chip"/>
    <text x="1048" y="453" class="num" style="fill:#6ee7b7">17</text><text x="1082" y="454" class="step">내보내기</text>
    <rect x="1036" y="478" width="190" height="46" rx="12" stroke="#2fa38a" class="chip"/>
    <text x="1048" y="509" class="num" style="fill:#6ee7b7">18</text><text x="1082" y="510" class="step">대조</text>
    <rect x="1238" y="366" width="190" height="46" rx="12" stroke="#2fa38a" class="chip"/>
    <text x="1250" y="397" class="num" style="fill:#6ee7b7">19</text><text x="1284" y="398" class="step">올리기</text>
    <rect x="1238" y="422" width="190" height="46" rx="12" stroke="#2fa38a" class="chip"/>
    <text x="1250" y="453" class="num" style="fill:#6ee7b7">20</text><text x="1284" y="454" class="step">일봉 올리기</text>
  </g>

  <!-- 근거 문서 1 -->
  <rect x="1492" y="244" width="378" height="360" rx="24" fill="url(#blue)" stroke="#5480bd" class="card"/>
  <rect x="1516" y="264" width="186" height="40" rx="20" fill="#2563eb"/>
  <text x="1609" y="292" text-anchor="middle" class="pill">근거 문서 · 1단계</text>
  <text x="1516" y="344" class="h2">7일에 한 번 개정 대조</text>
  <rect x="1516" y="366" width="330" height="46" rx="12" stroke="#5480bd" class="chip"/>
  <text x="1528" y="397" class="num" style="fill:#93c5fd">21</text><text x="1562" y="398" class="step">섹터 법령</text>
  <!-- 장식: 법령 문서 -->
  <g opacity=".55">
    <path d="M1640 446H1700L1724 470V560H1640Z" fill="none" stroke="#93c5fd" stroke-width="4" stroke-linejoin="round"/>
    <path d="M1700 446V470H1724" fill="none" stroke="#93c5fd" stroke-width="4" stroke-linejoin="round"/>
    <path d="M1656 494H1708M1656 514H1708M1656 534H1690" stroke="#93c5fd" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- 묶음 사이 화살표 -->
  <path class="line" d="M504 424H538"/>
  <path class="line" d="M974 424H1008"/>
  <path class="line" d="M1454 424H1488"/>

  <!-- 아래 띠: 기록과 규칙 -->
  <rect x="50" y="628" width="1240" height="218" rx="24" fill="#0d1a2c" stroke="#3a5577" stroke-width="2"/>
  <rect x="78" y="656" width="490" height="64" rx="14" fill="#10233f" stroke="#4d82cc" stroke-width="1.5"/>
  <text x="323" y="697" text-anchor="middle" class="body">단계마다 결과 · 걸린 시간 · 실패 까닭</text>
  <path class="line" d="M570 688H626"/>
  <rect x="630" y="656" width="210" height="64" rx="14" fill="#172e52" stroke="#7fa7d8" stroke-width="2"/>
  <text x="735" y="697" text-anchor="middle" class="step">회차 기록</text>
  <path class="line" d="M842 688H896"/>
  <rect x="900" y="656" width="350" height="64" rx="14" fill="#10233f" stroke="#4d82cc" stroke-width="1.5"/>
  <text x="1075" y="697" text-anchor="middle" class="body">화면 「데이터 관제」</text>

  <text x="78" y="786" class="small" style="font-weight:800">규칙</text>
  <rect x="136" y="750" width="350" height="52" rx="26" fill="#6d5ae0" opacity=".55"/>
  <text x="311" y="785" text-anchor="middle" class="pill" style="font-size:24px">원본을 다 받은 뒤에만 계산</text>
  <rect x="502" y="750" width="320" height="52" rx="26" fill="#047857" opacity=".7"/>
  <text x="662" y="785" text-anchor="middle" class="pill" style="font-size:24px">계산이 끝난 뒤에만 백업</text>

  <!-- 오른쪽 아래: 10-19 회차 -->
  <rect x="1330" y="628" width="540" height="218" rx="24" fill="url(#teal)" stroke="#38bdf8" class="card"/>
  <text x="1358" y="672" class="h2">10-19 회차</text>
  <text x="1530" y="672" class="body">12:30:01 ~ 13:24:43</text>
  <text x="1358" y="714" class="small">가장 긴 단계</text>
  <text x="1358" y="754" class="small">수정주가</text>
  <rect x="1460" y="739" width="280" height="18" rx="6" fill="#38bdf8" opacity=".8"/>
  <text x="1752" y="754" class="small" style="font-weight:800;fill:#e0f2fe">749초</text>
  <text x="1358" y="790" class="small">총수익</text>
  <rect x="1460" y="775" width="276" height="18" rx="6" fill="#38bdf8" opacity=".65"/>
  <text x="1748" y="790" class="small" style="font-weight:800;fill:#e0f2fe">738초</text>
  <text x="1358" y="826" class="small">일봉</text>
  <rect x="1460" y="811" width="235" height="18" rx="6" fill="#38bdf8" opacity=".5"/>
  <text x="1707" y="826" class="small" style="font-weight:800;fill:#e0f2fe">628초</text>
</svg>

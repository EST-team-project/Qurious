<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="764" viewBox="0 96 1920 764" role="img" aria-labelledby="title desc">
  <title id="title">저장 자료로 충분한 기능과 실시간이 필요한 기능을 나눈다</title>
  <desc id="desc">저장 자료로 충분한 기능(백테스트 · ML 학습 · 계절성 · 자산배분 · 리밸런싱 정산 · 근거 답)은 같은 자료로 다시 돌려 같은 답이 나와야 하므로 HF 비공개에 최대한 저장한다. 실시간이 필요한 기능(「현재가」 표시 · 모의 주문 체결가 · 손절 발동 · AI 가 가격을 말할 때)은 틀리면 손해 · 환각이므로 저장 · 공유하지 않고 판단 기록만 남긴다. 둘 다 필요한 기능(자동매매 · 신호와 현재가)은 판단은 마감된 봉으로, 실행 직전 확인만 실시간으로 한다. 2차는 지금 값을 한 곳(quote_now)에서 받는다 — ① 내 증권사 키로 KIS 현재가 조회, 키가 없거나 실패하면 ② 약 20분 지연 시세와 체결 시각, 실패하면 ③ 지난 종가(「10월 16일 종가」), 값마다 출처와 시각을 붙인다. 3차 실시간 구조는 사용자 자기 키의 KIS 웹소켓(1세션 41종목) → 수신기(재접속하면 구독 복원) → Redis 최신 값(짧은 TTL · 쌓지 않음) → SSE → 화면이다. 실시간 시세는 사용자 자기 키 · 자기 화면까지(코스콤 정보이용정책 · KIS 약관 제5조 3항)이고, 실시간 값은 HF 에 올리지 않는다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/><stop offset="0.55" stop-color="#0b1728"/><stop offset="1" stop-color="#101a2d"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172e52"/><stop offset="1" stop-color="#10233f"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#302557"/><stop offset="1" stop-color="#1d2140"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#143c3e"/><stop offset="1" stop-color="#102b32"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#44351f"/><stop offset="1" stop-color="#2a281f"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173a4a"/><stop offset="1" stop-color="#112834"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#46202f"/><stop offset="1" stop-color="#2a1a26"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000814" flood-opacity=".45"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7fa7d8"/>
    </marker>
    <marker id="arrowS" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7fa7d8"/>
    </marker>
    <style>
      text{font-family:'Pretendard Variable','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#f5f8ff}
      .title{font-size:38px;font-weight:800;letter-spacing:-1px}
      .subtitle{font-size:22px;fill:#aebcd1}
      .zone{font-size:24px;font-weight:800;letter-spacing:1px}
      .h1{font-size:34px;font-weight:800}
      .h2{font-size:30px;font-weight:800}
      .body{font-size:24px;fill:#c7d3e5}
      .small{font-size:20px;fill:#aebcd1}
      .pill{font-size:20px;font-weight:700}
      .step{font-size:24px;font-weight:700;fill:#eef4ff}
      .card{stroke-width:2;filter:url(#shadow)}
      .chip{fill:#0a1525;fill-opacity:.6;stroke-width:1.5}
      .line{fill:none;stroke:#7fa7d8;stroke-width:4;marker-end:url(#arrow)}
      .lineS{fill:none;stroke:#7fa7d8;stroke-width:4;marker-end:url(#arrowS)}
      .dash{fill:none;stroke:#6984a6;stroke-width:3;stroke-dasharray:10 10;marker-end:url(#arrow)}
      .bus{fill:none;stroke:#6984a6;stroke-width:3;stroke-dasharray:10 10}
    </style>
  </defs>

  <rect data-bg="1" width="1920" height="860" fill="url(#bg)"/>
  <circle cx="1480" cy="180" r="320" fill="#1e3a60" opacity=".12"/>
  <circle cx="420" cy="760" r="360" fill="#194c47" opacity=".09"/>

  <text data-free="1" x="50" y="52" class="title">저장 자료로 충분한 기능과 실시간이 필요한 기능을 나눈다</text>
  <text data-free="1" x="52" y="88" class="subtitle">2차는 지금 값을 한 곳(quote_now)에서 받고, 3차는 사용자 자기 키의 실시간 구조로 넓힌다</text>

  <!-- 왼쪽: 두 갈래와 둘 다 -->
  <rect x="50" y="112" width="850" height="182" rx="24" fill="url(#green)" stroke="#2fa38a" class="card"/>
  <text x="74" y="160" class="h2">저장 자료로 충분</text>
  <rect x="74" y="182" width="116" height="46" rx="23" fill="#047857" opacity=".7"/><text x="132" y="215" text-anchor="middle" class="step">백테스트</text>
  <rect x="200" y="182" width="105" height="46" rx="23" fill="#047857" opacity=".7"/><text x="252.5" y="215" text-anchor="middle" class="step">ML 학습</text>
  <rect x="315" y="182" width="92" height="46" rx="23" fill="#047857" opacity=".7"/><text x="361" y="215" text-anchor="middle" class="step">계절성</text>
  <rect x="417" y="182" width="116" height="46" rx="23" fill="#047857" opacity=".7"/><text x="475" y="215" text-anchor="middle" class="step">자산배분</text>
  <rect x="543" y="182" width="172" height="46" rx="23" fill="#047857" opacity=".7"/><text x="629" y="215" text-anchor="middle" class="step">리밸런싱 정산</text>
  <rect x="725" y="182" width="100" height="46" rx="23" fill="#047857" opacity=".7"/><text x="775" y="215" text-anchor="middle" class="step">근거 답</text>
  <text x="74" y="270" class="body"><tspan style="fill:#6ee7b7;font-weight:800">→ </tspan>같은 자료로 다시 돌려 같은 답 · HF 비공개에 최대한 저장</text>

  <rect x="50" y="314" width="850" height="182" rx="24" fill="url(#rose)" stroke="#e0607e" class="card"/>
  <text x="74" y="362" class="h2">실시간이 필요</text>
  <rect x="74" y="384" width="192" height="46" rx="23" fill="#be123c" opacity=".55"/><text x="170" y="417" text-anchor="middle" class="step">「현재가」 표시</text>
  <rect x="276" y="384" width="201" height="46" rx="23" fill="#be123c" opacity=".55"/><text x="376.5" y="417" text-anchor="middle" class="step">모의 주문 체결가</text>
  <rect x="487" y="384" width="120" height="46" rx="23" fill="#be123c" opacity=".55"/><text x="547" y="417" text-anchor="middle" class="step">손절 발동</text>
  <rect x="617" y="384" width="238" height="46" rx="23" fill="#be123c" opacity=".55"/><text x="736" y="417" text-anchor="middle" class="step">AI 가 가격을 말할 때</text>
  <text x="74" y="472" class="body"><tspan style="fill:#fda4af;font-weight:800">→ </tspan>틀리면 손해 · 환각 · 저장 · 공유하지 않고 판단 기록만</text>

  <rect x="50" y="516" width="850" height="182" rx="24" fill="url(#violet)" stroke="#8b78db" class="card"/>
  <text x="74" y="564" class="h2">둘 다</text>
  <rect x="74" y="586" width="116" height="46" rx="23" fill="#6d5ae0" opacity=".6"/><text x="132" y="619" text-anchor="middle" class="step">자동매매</text>
  <rect x="200" y="586" width="172" height="46" rx="23" fill="#6d5ae0" opacity=".6"/><text x="286" y="619" text-anchor="middle" class="step">신호와 현재가</text>
  <text x="74" y="674" class="body"><tspan style="fill:#c4b5fd;font-weight:800">→ </tspan>판단은 마감된 봉, 실행 직전 확인만 실시간</text>

  <!-- 오른쪽 위: 2차 quote_now -->
  <rect x="940" y="112" width="930" height="336" rx="24" fill="url(#blue)" stroke="#4d82cc" class="card"/>
  <text x="964" y="160" class="h2">2차 — 지금 값을 한 곳에서</text>
  <rect x="1380" y="132" width="160" height="40" rx="20" fill="#2563eb" opacity=".7"/>
  <text x="1460" y="159" text-anchor="middle" class="pill">quote_now</text>

  <rect x="964" y="184" width="536" height="52" rx="14" stroke="#7fa7d8" class="chip"/>
  <circle cx="992" cy="210" r="16" fill="#2563eb"/><text x="992" y="217" text-anchor="middle" class="pill">1</text>
  <text x="1020" y="219" class="step">내 증권사 키 · KIS 현재가 조회</text>
  <path class="lineS" d="M992 238V274"/>
  <text data-free="1" x="1012" y="263" class="small" style="font-weight:800;fill:#fda4af">키 없음 · 실패</text>
  <rect x="964" y="278" width="536" height="52" rx="14" stroke="#7fa7d8" class="chip"/>
  <circle cx="992" cy="304" r="16" fill="#2563eb"/><text x="992" y="311" text-anchor="middle" class="pill">2</text>
  <text x="1020" y="313" class="step">지연 시세 · 약 20분 · 체결 시각</text>
  <path class="lineS" d="M992 332V368"/>
  <text data-free="1" x="1012" y="357" class="small" style="font-weight:800;fill:#fda4af">실패</text>
  <rect x="964" y="372" width="536" height="52" rx="14" stroke="#7fa7d8" class="chip"/>
  <circle cx="992" cy="398" r="16" fill="#2563eb"/><text x="992" y="405" text-anchor="middle" class="pill">3</text>
  <text x="1020" y="407" class="step">지난 종가 「10월 16일 종가」</text>

  <path d="M1526 190H1538V418H1526M1538 304H1552" fill="none" stroke="#7fa7d8" stroke-width="3" stroke-linejoin="round"/>
  <text x="1566" y="296" class="step">값마다</text>
  <text x="1566" y="330" class="step">출처와 시각</text>

  <!-- 오른쪽 아래: 3차 실시간 구조 -->
  <rect x="940" y="468" width="930" height="230" rx="24" fill="url(#teal)" stroke="#38bdf8" class="card"/>
  <text x="964" y="516" class="h2">3차 — 실시간 구조</text>
  <rect x="964" y="540" width="190" height="134" rx="16" stroke="#38bdf8" class="chip"/>
  <text x="980" y="578" class="step">KIS 웹소켓</text>
  <text x="980" y="612" class="small">사용자 자기 키</text>
  <text x="980" y="642" class="small">1세션 · 구독 41건</text>
  <path class="lineS" d="M1156 607H1193"/>
  <rect x="1197" y="540" width="150" height="134" rx="16" stroke="#38bdf8" class="chip"/>
  <text x="1213" y="578" class="step">수신기</text>
  <text x="1213" y="612" class="small">재접속하면</text>
  <text x="1213" y="642" class="small">구독 복원</text>
  <path class="lineS" d="M1349 607H1386"/>
  <rect x="1390" y="540" width="190" height="134" rx="16" stroke="#38bdf8" class="chip"/>
  <text x="1406" y="578" class="step">Redis 최신 값</text>
  <text x="1406" y="612" class="small">짧은 TTL</text>
  <text x="1406" y="642" class="small">쌓지 않음</text>
  <path class="lineS" d="M1582 607H1619"/>
  <rect x="1623" y="540" width="90" height="134" rx="16" stroke="#38bdf8" class="chip"/>
  <text x="1668" y="616" text-anchor="middle" class="step">SSE</text>
  <path class="lineS" d="M1715 607H1752"/>
  <rect x="1756" y="540" width="90" height="134" rx="16" fill="#2563eb" fill-opacity=".35" stroke="#7fa7d8" stroke-width="2"/>
  <text x="1801" y="616" text-anchor="middle" class="step">화면</text>

  <!-- 아래: 경계 -->
  <rect x="50" y="722" width="1820" height="124" rx="24" fill="#0d1a2c" stroke="#3a5577" stroke-width="2"/>
  <text x="78" y="793" class="zone" style="fill:#dce8ff">경계</text>
  <rect x="150" y="758" width="950" height="52" rx="26" fill="#b91c1c" opacity=".55"/>
  <text x="625" y="792" text-anchor="middle" class="pill" style="font-size:22px">실시간 시세는 사용자 자기 키 · 자기 화면까지(코스콤 정보이용정책 · KIS 약관 제5조 3항)</text>
  <rect x="1120" y="758" width="360" height="52" rx="26" fill="#6d28d9" opacity=".55"/>
  <text x="1300" y="792" text-anchor="middle" class="pill" style="font-size:22px">실시간 값은 HF 에 올리지 않음</text>
</svg>

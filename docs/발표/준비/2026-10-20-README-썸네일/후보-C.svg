<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Qurious — AI Financial Quant Platform</title>
  <desc id="desc">큰 이름 Qurious 와 부제 AI Financial Quant Platform, 한 문장 「자기 투자 규칙을 믿어도 되는지 판단하도록 돕는 학습 · 검증 플랫폼」. 바탕의 옅은 격자와 아래 띠의 선 두 줄은 눈금 · 숫자가 없는 꾸밈이다.</desc>
  <defs>
    <!-- theme:start -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/><stop offset="0.55" stop-color="#0b1728"/><stop offset="1" stop-color="#101a2d"/>
    </linearGradient>
    <radialGradient id="glowBlue">
      <stop offset="0" stop-color="#2563eb" stop-opacity=".32"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowAmber">
      <stop offset="0" stop-color="#d97706" stop-opacity=".22"/><stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="calm">
      <stop offset="0" stop-color="#0b1728" stop-opacity="1"/><stop offset=".55" stop-color="#0b1728" stop-opacity=".85"/><stop offset="1" stop-color="#0b1728" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563eb" stop-opacity=".22"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>
    <style>
      text{font-family:'Pretendard Variable','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#f5f8ff}
      .name{font-size:128px;font-weight:800;letter-spacing:-3px}
      .tag{font-size:26px;font-weight:700;letter-spacing:6px;fill:#d97706}
      .lead{font-size:32px;font-weight:600;fill:#dfe7f3}
      .grid{fill:none;stroke:#8fb3ff;stroke-width:1;opacity:.11}
      .solid{fill:none;stroke:#2563eb;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
      .dashed{fill:none;stroke:#d97706;stroke-width:3.5;stroke-linecap:round;stroke-dasharray:2 10;opacity:.75}
    </style>
    <!-- theme:end -->
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- 바탕 — 가장자리까지 불투명 · 옅은 격자(가운데는 가라앉힘) -->
  <rect width="1280" height="400" fill="url(#bg)"/>
  <path class="grid" d="M0 0V400M40 0V400M80 0V400M120 0V400M160 0V400M200 0V400M240 0V400M280 0V400M320 0V400M360 0V400M400 0V400M440 0V400M480 0V400M520 0V400M560 0V400M600 0V400M640 0V400M680 0V400M720 0V400M760 0V400M800 0V400M840 0V400M880 0V400M920 0V400M960 0V400M1000 0V400M1040 0V400M1080 0V400M1120 0V400M1160 0V400M1200 0V400M1240 0V400M1280 0V400M0 0H1280M0 40H1280M0 80H1280M0 120H1280M0 160H1280M0 200H1280M0 240H1280M0 280H1280M0 320H1280M0 360H1280M0 400H1280"/>
  <ellipse cx="640" cy="196" rx="560" ry="230" fill="url(#calm)"/>
  <circle cx="1150" cy="40" r="320" fill="url(#glowBlue)"/>
  <circle cx="120" cy="400" r="300" fill="url(#glowAmber)"/>

  <!-- 아래 띠 — 꾸밈 선 두 줄(눈금 · 숫자 없음) -->
  <path d="M-20.0 392.0 C1.7 389.3 70.0 377.0 110.0 376.0 C150.0 375.0 181.7 388.3 220.0 386.0 C258.3 383.7 301.7 364.0 340.0 362.0 C378.3 360.0 413.3 375.7 450.0 374.0 C486.7 372.3 521.7 353.3 560.0 352.0 C598.3 350.7 640.0 367.3 680.0 366.0 C720.0 364.7 760.0 345.3 800.0 344.0 C840.0 342.7 880.0 358.7 920.0 358.0 C960.0 357.3 1001.7 341.3 1040.0 340.0 C1078.3 338.7 1106.7 353.7 1150.0 350.0 C1193.3 346.3 1275.0 323.3 1300.0 318.0 L1300 400 L-20 400 Z" fill="url(#area)"/>
  <path class="dashed" d="M-20.0 404.0 C1.7 401.6 70.0 390.1 110.0 389.6 C150.0 389.1 181.7 402.8 220.0 400.9 C258.3 399.0 301.7 379.9 340.0 378.4 C378.3 376.8 413.3 392.9 450.0 391.7 C486.7 390.5 521.7 371.9 560.0 371.0 C598.3 370.2 640.0 387.3 680.0 386.5 C720.0 385.6 760.0 366.8 800.0 365.9 C840.0 365.1 880.0 381.6 920.0 381.4 C960.0 381.2 1001.7 365.7 1040.0 364.8 C1078.3 364.0 1106.7 379.3 1150.0 376.2 C1193.3 373.0 1275.0 351.0 1300.0 346.0"/>
  <path class="solid" d="M-20.0 392.0 C1.7 389.3 70.0 377.0 110.0 376.0 C150.0 375.0 181.7 388.3 220.0 386.0 C258.3 383.7 301.7 364.0 340.0 362.0 C378.3 360.0 413.3 375.7 450.0 374.0 C486.7 372.3 521.7 353.3 560.0 352.0 C598.3 350.7 640.0 367.3 680.0 366.0 C720.0 364.7 760.0 345.3 800.0 344.0 C840.0 342.7 880.0 358.7 920.0 358.0 C960.0 357.3 1001.7 341.3 1040.0 340.0 C1078.3 338.7 1106.7 353.7 1150.0 350.0 C1193.3 346.3 1275.0 323.3 1300.0 318.0"/>

  <!-- 큰 이름 · 부제 · 한 문장 -->
  <text x="640" y="176" text-anchor="middle" class="name">Qurious</text>
  <text x="643" y="230" text-anchor="middle" class="tag">AI FINANCIAL QUANT PLATFORM</text>
  <rect x="590" y="250" width="100" height="6" rx="3" fill="url(#logo)"/>
  <text x="640" y="306" text-anchor="middle" class="lead">자기 투자 규칙을 믿어도 되는지 판단하도록 돕는 학습 · 검증 플랫폼</text>
</svg>

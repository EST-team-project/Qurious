# V04 — 가상 돈으로 국내 · 미국 주식을 주문해 본다
# 화면: 모의투자 › 국내주식 모의주문 (paper-stock · 주담당 강민석) · 미국주식 › 주문/매매 (us-order · 주담당 이동원)
# 장중 판(2026-10-19): 국내는 시장가 매수 체결까지 · 미국은 한국 낮에 정규장이 닫혀 있어 다음 정규장 예약 → 취소.
#   (10-17 첫 판은 장이 닫힌 날이라 국내는 미리 보기까지였다)
file: V04-모의주문-국내미국
title: 가상 돈으로 국내 · 미국 주식을 주문해 봅니다
owner: 강민석 · 이동원
start: paper-stock
mask: ["#alpaca-key", "#alpaca-secret"]
dialogs: accept      # 시장가 매수 · 예약 취소의 브라우저 확인 창은 「확인」
steps:
  - chapter: {label: "1 / 3 · 목적", title: "가상 돈으로 먼저 해 봅니다", text: "모의 계좌(가상 1억 원)로 주문하고, 비용까지 미리 확인합니다", sec: 3.5}
  - say: "종목 코드를 넣고 시세를 조회합니다 — 시세 아래에 출처와 체결 시각이 붙습니다"
  - fill: {target: "#ps-symbol", text: "005930"}
  - click: "#ps-quote-btn"
  - pause: 2.5
  - ring: {target: "#ps-quote", sec: 2.0}
  - say: "수량을 넣고 매수 미리 보기 — 금액 · 수수료 · 세금을 먼저 봅니다"
  - fill: {target: "#ps-qty", text: "1"}
  - click: "#ps-preview-buy"
  - pause: 2.0
  - ring: {target: "#ps-preview", sec: 3.0}
  - say: "시장가 매수 — 조회한 시세로 체결되어 보유 종목에 들어갑니다. 증권사 키를 연결한 계정은 체결 직전에 한 번 더 받습니다"
  - click: "#ps-buy"
  - wait: {target: "#ps-positions table", timeout: 20}
  - pause: 1.5
  - ring: {target: "#ps-positions", sec: 2.5}
  - chapter: {label: "2 / 3 · 과정", title: "미국 장이 닫힌 시간에는 예약으로", text: "한국 낮에는 미국 정규장이 닫혀 있어, 다음 정규장 시작가로 예약합니다", sec: 3.0}
  - go: us-order
  - fill: {target: "#us-ord-symbol", text: "AAPL"}
  - pause: 2.0
  - fill: {target: "#us-ord-qty", text: "1"}
  - say: "시세 · 받은 시각 · 장 상태 · 환율을 보고 예약 매수를 누릅니다"
  - click: "#us-ord-buy"
  - wait: {target: 'button[data-us-dlg]', timeout: 20}
  - pause: 1.0
  - say: "확인 상자 — 지금 시세로 셈한 값이고, 체결은 다음 정규장 시작가입니다"
  - pause: 3.0
  - click: 'button[data-us-dlg]:not(:has-text("취소"))'
  - pause: 2.5
  - say: "예약 목록에 들어갑니다 — 장이 열리기 전에는 언제든 취소할 수 있습니다"
  - ring: {target: '[data-uso-reservations]', sec: 2.0}
  - click: '[data-uso-cancel]'
  - pause: 2.0
  - chapter: {label: "3 / 3 · 결과", title: "주문 전에 값을 먼저 봅니다", text: "시세 · 비용 · 장 상태를 확인한 뒤 주문하고, 모든 거래는 모의 계좌에 기록됩니다", sec: 3.0}
  - say: "가상 돈으로 하는 연습이며 실제 주문이 나가지 않습니다"
  - pause: 3.0

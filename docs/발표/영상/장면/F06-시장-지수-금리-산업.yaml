# F06 — 지수 · 금리 · 산업 · 일정으로 시장 전체를 본다 (기능 영상 · 2026-10-19)
# 화면: 투자분석 기초 › 거시경제 지표 (macro-dashboard) · 산업 분석 (macro-industry) · 일정 (market-calendar) · 주담당 이동원
# 출처: 지표 · 섹터 ETF 는 야후 파이낸스 지연 시세다(app/routes/macro.py) — 계획의 「거시 · 금리는 한국은행 ECOS」(D54)는 이 화면에 맞지 않는다.
#   서버가 보내던 출처 글(note)을 화면이 그리지 않아 2026-10-19 에 숫자 아래 한 줄로 그리게 고쳤다(ml.js macroQuoteNote · TC-QVS-05) — 자막은 그 줄을 짚는다
file: F06-시장-지수-금리-산업
title: 지수 · 금리 · 산업 · 일정으로 시장을 봅니다
owner: 이동원
start: macro-dashboard
steps:
  - chapter: {label: "1 / 3 · 목적", title: "종목보다 시장 전체를 먼저", text: "금리 · 환율 · 지수 같은 거시 지표와 업종 흐름, 다가오는 일정을 한 번에 살핍니다", sec: 3.5}
  - say: "거시경제 지표 — 금리 · 원유 · 금 · 환율 · 달러 인덱스 · VIX · 지수를 카드로 봅니다"
  - ring: {target: "#macro-grid", sec: 3.5}
  - say: "카드 아래 한 줄에 출처와 받은 시각이 적힙니다"
  - ring: {target: "#macro-note", sec: 3.0}
  - say: "다가오는 일정 — 금통위 · FOMC · 파생 만기 · 보고서 기한"
  - ring: {target: '[data-view="macro-dashboard"] :is(h2,h3,h4):has-text("다가오는 일정")', sec: 2.5}
  - chapter: {label: "2 / 3 · 과정", title: "업종과 일정", text: "섹터 ETF 로 업종 흐름을 비교하고, 한 달 달력에서 날짜를 골라 일정을 봅니다", sec: 3.0}
  - go: macro-industry
  - say: "산업 분석 — 미국 섹터 ETF 의 현재가 · 등락률로 업종 흐름을 비교합니다"
  - ring: {target: "#industry-table-wrap", sec: 3.5}
  - go: market-calendar
  - say: "일정 — 휴장 · 파생 만기 · 금통위 · FOMC · 배당 · 주주총회 · 실적 발표를 한 달 달력으로 봅니다"
  - pause: 6.0
  - say: "날짜를 누르면 그날 일정 목록이 열립니다"
  - click: 'button[data-day="2026-10-22"]'
  - wait: {target: "#cal-day-title", timeout: 15}
  - pause: 1.0
  - ring: {target: "#cal-day-title", sec: 2.5}
  - chapter: {label: "3 / 3 · 결과", title: "시장을 보고 종목으로", text: "시장 전체의 흐름과 일정을 먼저 보고, 종목 화면으로 이어갑니다", sec: 3.0}
  - say: "정보 제공 목적이며 투자 권유가 아닙니다"
  - pause: 3.0

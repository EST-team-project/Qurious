# F08 — 지표와 계좌 요약을 첫 화면에서 본다 (기능 영상 · 2026-10-18)
# 화면: 퀀트자동매매 › 퀀트 대시보드 (quant-dashboard · 신장환) · 로보 어드바이저 › 통합 대시보드 (dashboard · 강민석)
# 팀원 화면 — 이동원 판이 기본이고 주담당이 더 나은 판을 찍으면 바꿔 끼운다(사용자 10-17)
# 시연 계정은 KIS 모의 미연동 — 계좌는 「모의투자 계좌」 탭(data-key paper)으로 보인다. 장중에 V04 로 국내 체결을 넣은 뒤 찍는다
# (10-18 첫 판은 「로보 모의계좌」 탭이 「자료 없음」 이라 자막과 화면이 어긋나 쓰지 않았다)
file: F08-퀀트-통합-대시보드
title: 지표와 계좌 요약을 첫 화면에서 봅니다
owner: 신장환 · 강민석
start: quant-dashboard
steps:
  - chapter: {label: "1 / 3 · 목적", title: "첫 화면에서 시장과 계좌를", text: "지표 · 지수와 모의 계좌 요약을 한 번에 봅니다", sec: 3.5}
  - pause: 1.5
  - say: "퀀트 대시보드 — 지표와 지수"
  - pause: 3.5
  - scroll: {by: 400}
  - pause: 2.0
  - chapter: {label: "2 / 3 · 과정", title: "계좌 요약", text: "모의 계좌의 총 자산과 비중을 첫 화면에서 봅니다", sec: 3.0}
  - go: dashboard
  - wait: {target: '#overview-account-tabs .overview-tab[data-key="paper"]', timeout: 40, cut: true}
  - click: '#overview-account-tabs .overview-tab[data-key="paper"]'
  - pause: 1.0
  - say: "통합 대시보드 — 모의투자 계좌의 현재 투자액 · 현금 · 총 자산 · 보유 종목"
  - pause: 3.5
  - chapter: {label: "3 / 3 · 결과", title: "자세한 것은 각 화면에서", text: "여기서 각 기능 화면으로 이어집니다", sec: 3.0}
  - say: "가상 돈으로 하는 연습이며 투자 권유가 아닙니다"
  - pause: 3.0

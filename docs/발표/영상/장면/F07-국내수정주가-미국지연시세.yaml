# F07 — 국내 · 미국 주가 차트와 시세 시각을 본다 (기능 영상 · 2026-10-19)
# 화면: 직접매매 › 주가 차트 (trading-chart · 신장환 추정) · 미국주식 › 대시보드 (us-dashboard · 이동원) · 주가 차트 (us-chart · 이동원)
# 계획(README 표 2)의 「국내는 수정주가」 는 화면에 그 표시가 없어 자막에 넣지 않는다(2026-10-19 화면 확인 — 국내 주가 차트는 팀원 화면이라 고치지 않음)
# 미국 포트폴리오는 한국 낮엔 체결된 미국 보유가 없어 빈 화면이라 넣지 않는다 — 미국 정규장(22:30 ~ 05:00 KST) 체결 뒤 다시 찍으면 넣는다
file: F07-국내수정주가-미국지연시세

  - say: "주가 차트 — 국내 종목을 찾고 기간을 골라 캔들 차트와 현재가 · 등락률을 봅니다"
  - ring: {target: "#stock-info", sec: 2.0}
  - ring: {target: "#chart-container", sec: 3.0}
  - chapter: {label: "2 / 3 · 과정", title: "미국은 지연 시세", text: "미국 지수 · 대형주 시세는 야후 파이낸스 지연 시세이고, 마지막 체결 시각과 받은 시각을 밝힙니다", sec: 3.5}

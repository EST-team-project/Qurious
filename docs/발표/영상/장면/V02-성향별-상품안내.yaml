# V02 — 나눈 비중대로, 상장 상품을 공시 정보로 비교한다 (추천이 아니라 비교)
# 화면: 로보 어드바이저 › 투자 성향별 상품 안내 (agent-products) · 주담당 이동원
# 앞 영상 V01 에서 저장한 배분이 있어야 탭에 비중이 보인다
file: V02-성향별-상품안내
title: 나눈 비중대로 상품을 공시 정보로 비교합니다
owner: 이동원
start: agent-products
steps:
  - chapter: {label: "1 / 3 · 목적", title: "내 배분에 맞는 상품을 찾습니다", text: "자산군마다 상장된 상품을 보여 주고, 추천 대신 공시된 정보와 출처로 비교하게 합니다", sec: 3.5}
  - say: "앞에서 나눈 비중이 자산군 탭에 그대로 들어옵니다"
  - ring: {target: 'button[data-tab="국내주식"]', sec: 2.2}
  - click: 'button[data-tab="국내채권"]'
  - say: "자산군을 고르면 그 자산군의 상장 상품이 묶음별로 나옵니다"
  - pause: 2.5
  - click: 'button[data-tab="국내주식"]'
  - chapter: {label: "2 / 3 · 과정", title: "상품 하나를 열어 봅니다", text: "가격 흐름 · 보수 · 기초지수를 출처와 함께 보고, 모의 계좌로 연습할 수 있습니다", sec: 3.0}
  - click: 'button.pd-open[data-chart="069500"]'
  - wait: {target: '.pc-panel', timeout: 20}
  - pause: 2.0
  - say: "가격 흐름과 상품 정보 — 숫자마다 출처와 기준일이 붙습니다"
  - ring: {target: '.pc-panel', sec: 2.5}
  - scroll: {target: '.pc-panel >> text=연습', block: "center"}
  - say: "이 상품으로 사고팔기를 모의 계좌(가상 돈)에서 연습할 수 있게 이어집니다"
  - pause: 3.0
  - key: Escape
  - chapter: {label: "3 / 3 · 결과", title: "고르는 것은 사용자입니다", text: "추천 순위를 매기지 않고, 공시된 정보와 출처를 나란히 보여 줍니다", sec: 3.0}
  - say: "자료: 금융위원회 증권상품시세정보 · 투자 권유가 아닌 정보 제공입니다"
  - pause: 3.0

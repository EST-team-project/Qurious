# 발표 영상 — 목표 비중에서 벗어나면 다시 맞추는 계획을 세운다 (자세한 판 · 2 ~ 3분 · 2026-10-19 · #277 뒤 — 국내주식 밖 자산군 안내 칸)
# 화면: 로보 어드바이저 › 리밸런싱 엔진 (robo-rebalance) · 주담당 오준영
# 사용법 판(장면/V05)과 다른 점: 왜 다시 맞추나 · 가져온 목표 표와 합계 · 세 기준(시간 · 이탈률 · 현금흐름)의 뜻과 이탈률 예(화면 도움말 그대로) ·
#   현재 비중 vs 목표 비중 그림 · 주문 미리 보기 표 · 요약 줄(판단 기준 종가 · 시가로 다시 계산 · 회전 금액 · 비용) · 실행 단추는 짚기만
# 실행(시가 체결 예약)은 누르지 않는다 — 계획 저장 · 주문 산출(미리 보기)까지
# 주문 산출은 전 거래일 종가가 수집된 뒤에만 된다(주말 · 공개 전이면 「자료 준비 후 다시」) — 평일 12:30 회차 뒤에 찍는다(사용법 판과 같음)
# 녹화: python tools/demo/record_demo.py --out tools/demo/out/present docs/발표/영상/발표/P-V05-리밸런싱.yaml
file: 발표-V05-리밸런싱
title: 목표 비중에서 벗어나면 다시 맞추는 계획을 세웁니다
owner: 오준영
start: robo-rebalance
dialogs: accept      # 「저장한 배분 가져오기」 는 브라우저 확인 창으로 적용을 묻는다 — 「확인」
steps:
  - chapter: {label: "1 / 3 · 목적", title: "비중은 시간이 지나면 틀어집니다", text: "값이 오른 자산은 비중이 커지고 내린 자산은 작아집니다 — 처음 정한 목표 비중으로 되돌리는 것이 리밸런싱입니다", sec: 5.5}
  - say: "목표 비중 플랜 — 이름을 정하고, 자산배분 화면에서 저장한 배분을 목표로 가져옵니다"
  - fill: {target: "#rb-name", text: "내 성향 배분 — 위험중립형"}
  - click: "#rb-import-allocation"
  - pause: 2.5
  - say: "가져온 종목과 목표 비중이 표에 들어오고, 표 아래에 합계가 보입니다"
  - ring: {target: "#rb-target-sum", sec: 3.5}
  - pause: 2.5
  # #277(오준영 · #217) — 국내주식이 아닌 자산군은 이 화면에서 맞추지 않는다 · 화면 안내 글(#rb-products-help)을 줄여 말한다
  - say: "채권 · 해외주식 · 대체자산은 상품 안내에서 국내 상장 ETF 를 보고, 여기로 돌아와 종목과 비중을 직접 넣을 수 있습니다"
  - ring: {target: "#rb-products-help", sec: 4.5}
  - pause: 4.5
  - chapter: {label: "2 / 3 · 실행 과정", title: "언제 · 얼마나 벗어나면 맞출까", text: "기준은 셋 — 정해진 날(시간) · 목표에서 벗어난 폭(이탈률) · 들어오거나 나간 돈(현금흐름)", sec: 5.0}
  - scroll: {target: "#rb-period", block: "center"}
  - select: {target: "#rb-period", label: "매월 첫 거래일"}
  - say: "① 시간 — 매월 첫 거래일에 점검합니다"
  - pause: 3.5
  - js: "(() => { const c = document.getElementById('rb-drift-enabled'); if (c && !c.checked) c.click(); })()"   # 이탈률 기준 사용을 켠다(자막이 말하는 것)
  - select: {target: "#rb-drift-preset", label: "5%p"}
  - select: {target: "#rb-drift-mode", label: "매 점검 시"}
  - say: "② 이탈률 — 관리 종목과 현금 중 최대 비중 차이를 봅니다 · 목표 20% 가 현재 25% 면 기준 5%p 이상이므로 충족합니다"
  - ring: {target: "#rb-drift-help", sec: 4.5}
  - pause: 3.0
  - say: "매 점검 시는 시간 또는 이탈 조건, 주기 도래 시는 시간과 이탈 조건을 모두 확인합니다"
  - ring: {target: "#rb-drift-mode", sec: 4.0}
  - scroll: {target: "#rb-cf-preset", block: "center"}
  - say: "③ 현금흐름 — 입출금액 자체가 아니라, 미사용 예산과 목표 대비 현금 초과·부족을 비교한 재배분 가능액을 봅니다"
  - ring: {target: "#rb-cf-help", sec: 4.0}
  - pause: 2.5
  - scroll: {target: "#rb-order-settings", block: "center"}
  - say: "공통 주문 제한 — 최소 주문금액은 세 조건 모두에 적용하며, 종목별 산출 주문이 이 금액 미만이면 제외합니다"
  - ring: {target: "#rb-min-order", sec: 4.0}
  - say: "현금흐름 기준은 재배분을 시작할 기준이고, 최소 주문금액은 개별 주문을 거르는 기준입니다"
  - pause: 4.0
  - scroll: {target: "#rb-execution-settings", block: "center"}
  - js: "(() => { const c = document.getElementById('rb-auto'); if (c.checked) c.click(); })()"
  - say: "자동 예약을 끄고 플랜을 저장합니다 — 목표와 조건만 저장하며 즉시 매매하지 않습니다"
  - click: "#rb-save"
  - pause: 2.5
  - scroll: {target: "#rb-weight-chart", block: "start"}
  - say: "현재 비중과 목표 비중을 막대로 견주고, 아래 표의 마지막 칸이 목표에서 벗어난 폭입니다"
  - pause: 6.5
  - click: "#rb-preview"
  - wait: {target: "#rb-proposal-summary:not(:empty)", timeout: 240, cut: true}
  - scroll: {target: "#rb-proposal", block: "center"}
  - say: "주문 산출 — 목표로 돌아가려면 어느 종목을 몇 주 사고팔지 · 단가 · 금액 · 거래 비용까지 미리 계산합니다"
  - pause: 7.0
  - say: "요약 줄 — 전 거래일 종가로 판단하고, 실제 수량은 다음 거래일 시가로 다시 계산합니다 · 예상 회전 금액과 비용도 함께 보입니다"
  - ring: {target: "#rb-proposal-summary", sec: 4.5}
  - pause: 4.0
  # D54 — 미리 보기 가격은 수집 DB 의 전 거래일 원 종가(주식시세 · 없으면 증권상품시세)다 — 수정주가가 아니라 문구를 사실대로
  - say: "자료: 금융위원회 주식시세정보 · 증권상품시세정보(공공데이터포털 · 공공누리 제4유형) · 전 거래일 종가 · 주문 수량은 Qurious 가 계산"
  - pause: 4.5
  - chapter: {label: "3 / 3 · 결과", title: "실행은 사용자가 정합니다", text: "자동 예약을 꺼 둔 이 플랜은 사용자가 제안을 확인하고 시가 체결을 예약합니다 — 이 영상에서는 예약하지 않습니다", sec: 5.5}
  - ring: {target: "#rb-execute", sec: 3.0}
  - say: "모의 계좌 기준 계산이며 투자 권유가 아닙니다"
  - pause: 4.0

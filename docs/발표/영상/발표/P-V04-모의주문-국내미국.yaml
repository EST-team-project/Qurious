# 발표 영상 — 가상 돈으로 국내 · 미국 주식을 주문하고 기록을 남긴다 (자세한 판 · 2 ~ 3분 · 2026-10-19 장중)
# 화면: 모의투자 › 국내주식 모의주문 (paper-stock · 주담당 강민석) · 미국주식 › 주문/매매 (us-order · 주담당 이동원)
# 사용법 판(장면/V04)과 다른 점: 두 주문 칸(시장가 · 스탑) · 미리 보기 안내 문구 · 체결 뒤 보유 종목 · 주문 내역 칸 읽기 ·
#   미국 시세 카드(출처 · 시각 · 환율 · 장 상태)와 원화 예상 금액 · 예약 확인 상자
# 녹화: python tools/demo/record_demo.py --out tools/demo/out/present docs/발표/영상/발표/P-V04-모의주문-국내미국.yaml
# 장중(09:00 ~ 15:30)에만 국내 시장가 체결이 된다 · 미국은 한국 낮에 정규장이 닫혀 있어 예약 → 취소
file: 발표-V04-모의주문-국내미국
title: 가상 돈으로 국내 · 미국 주식을 주문하고 기록을 남깁니다
owner: 강민석 · 이동원
start: paper-stock
mask: ["#alpaca-key", "#alpaca-secret"]
dialogs: accept      # 시장가 매수 · 예약 취소의 브라우저 확인 창은 「확인」
steps:
  - chapter: {label: "1 / 3 · 목적", title: "주문 전에 값부터 확인합니다", text: "모의 계좌(가상 1억 원)로 국내 · 미국 주식을 주문합니다 — 실제 주문은 나가지 않고, 모든 거래가 기록됩니다", sec: 5.5}
  - say: "국내주식 모의주문 — 왼쪽은 바로 체결되는 시장가 주문, 오른쪽은 가격에 닿으면 나가는 스탑(감시) 주문입니다"
  - ring: {target: '[data-view="paper-stock"] h3:has-text("주문 입력")', sec: 2.0}
  - ring: {target: '[data-view="paper-stock"] h3:has-text("스탑(감시) 주문")', sec: 2.0}
  - say: "종목 코드를 넣고 시세를 조회합니다 — 현재가 · 등락률 아래에 출처(증권사 조회 · 지연 시세 · 지난 종가)와 체결 시각이 붙습니다"
  - fill: {target: "#ps-symbol", text: "005930"}
  - click: "#ps-quote-btn"
  - pause: 2.5
  - ring: {target: "#ps-quote", sec: 3.0}
  - say: "수량을 넣고 매수 미리 보기 — 예상 단가 · 수수료·세금 · 순정산액과 주문 뒤 현금 · 보유 수량을 먼저 셈합니다"
  - fill: {target: "#ps-qty", text: "1"}
  - click: "#ps-preview-buy"
  - pause: 2.0
  - ring: {target: "#ps-preview", sec: 4.5}
  - say: "미리 보기는 체결 · 잔고를 바꾸지 않고, 실제 주문 시점 가격과 다를 수 있다고 함께 알립니다"
  - pause: 4.0
  - chapter: {label: "2 / 3 · 과정", title: "체결하고, 기록을 읽습니다", text: "국내는 시장가로 바로 체결하고, 미국은 장이 닫힌 시간이면 다음 정규장 시작가로 예약합니다", sec: 4.5}
  - say: "시장가 매수 — 조회한 시세로 체결되고, 체결 알림에 그 시세의 출처와 시각이 남습니다. 증권사 키를 연결한 계정은 체결 직전에 한 번 더 받습니다"
  - click: "#ps-buy"
  - wait: {target: "#ps-positions table", timeout: 20}
  - pause: 1.5
  - say: "보유 종목 — 수량 · 평균단가 · 현재가 · 평가금액 · 손익"
  - ring: {target: "#ps-positions", sec: 3.5}
  - say: "주문 내역 — 시각 · 단가 · 수수료 · 세금 · 순정산액과 출처 「PAPER」 가 남습니다"
  - ring: {target: "#ps-history", sec: 3.5}
  - say: "스탑(감시) 주문 — 가격에 닿으면 시장가로 나가며, 체결을 보장하지 않고 장 시간에만 돕니다"
  - ring: {target: '[data-view="paper-stock"] div.text-xs:has-text("가격 도달 시")', sec: 3.5}
  - say: "미국 주식 — 한국 낮에는 미국 정규장이 닫혀 있어, 다음 정규장 시작가로 예약합니다"
  - go: us-order
  - fill: {target: "#us-ord-symbol", text: "AAPL"}
  - pause: 2.5
  - say: "시세 카드 — 야후 파이낸스 지연 시세와 마지막 체결 시각, 받은 환율과 기준 시각, 장 상태를 함께 보입니다"
  - ring: {target: "#us-ord-quote", sec: 4.5}
  - fill: {target: "#us-ord-qty", text: "1"}
  - say: "원화로 셈한 예상 금액 · 수수료 · 세금 · 주문 뒤 현금 — 지금 시세로 셈한 값이라고 밝힙니다"
  - ring: {target: "#us-ord-estimate", sec: 4.0}
  - click: "#us-ord-buy"
  - wait: {target: 'button[data-us-dlg]', timeout: 20}
  - pause: 1.0
  - say: "확인 상자 — 지금 시세로 셈한 값이고, 체결은 다음 정규장 시작가입니다"
  - pause: 4.0
  - click: 'button[data-us-dlg]:not(:has-text("취소"))'
  - pause: 2.5
  - say: "예약 목록에 들어갑니다 — 장이 열리기 전에는 언제든 취소할 수 있습니다"
  - ring: {target: '[data-uso-reservations]', sec: 2.5}
  - click: '[data-uso-cancel]'
  - pause: 2.0
  - chapter: {label: "3 / 3 · 결과", title: "값을 먼저 보고, 기록을 남깁니다", text: "시세의 출처 · 시각 · 비용을 확인한 뒤 주문하고, 모든 거래는 모의 계좌에 남습니다 — 그 계좌는 다음 영상에서 봅니다", sec: 5.5}
  - say: "가상 돈으로 하는 연습이며 실제 주문이 나가지 않습니다"
  - pause: 3.0

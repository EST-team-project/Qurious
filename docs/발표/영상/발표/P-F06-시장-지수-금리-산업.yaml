# 발표 영상 — 지수 · 금리 · 산업 · 일정으로 시장 전체를 본다 (자세한 판 · 2 ~ 3분 · 2026-10-19)
# 화면: 투자분석 기초 › 거시경제 지표 (macro-dashboard) · 산업 분석 (macro-industry) · 일정 (market-calendar) · 주담당 이동원
# 사용법 판(장면/F06)과 다른 점: 카드 묶음마다 읽는 법 · 출처 줄 · 분석 프레임워크 · 내 종목 일정을 맨 위로 ·
#   종류 단추로 일정 거르기 · 그날 목록
# 출처: 지표 · 섹터 ETF 는 야후 파이낸스 지연 시세(숫자 아래 한 줄 — 서버 글 그대로 · ml.js macroQuoteNote · 2026-10-19)
# 녹화: python tools/demo/record_demo.py --out tools/demo/out/present docs/발표/영상/발표/P-F06-시장-지수-금리-산업.yaml
file: 발표-F06-시장-지수-금리-산업
title: 지수 · 금리 · 산업 · 일정으로 시장을 봅니다
owner: 이동원
start: macro-dashboard
steps:
  - chapter: {label: "1 / 3 · 목적", title: "종목보다 시장 전체를 먼저", text: "금리 · 환율 · 지수 같은 거시 지표와 업종 흐름, 다가오는 일정을 한 번에 살핍니다", sec: 5.0}
  - say: "거시경제 지표 — 미 국채 10년 · 3개월 금리, 원유 · 금, 환율 · 달러 인덱스, VIX, 지수를 카드로 봅니다"
  - ring: {target: "#macro-grid", sec: 5.0}
  - say: "카드마다 전일 대비 등락 — 모르는 값은 0 으로 메우지 않고 「—」 로 둡니다"
  - pause: 4.5
  - say: "카드 아래 한 줄에 출처와 받은 시각이 적힙니다"
  - ring: {target: "#macro-note", sec: 3.5}
  - say: "거시경제 분석 프레임워크 — 금리 사이클 · 물가 · 유가가 주식에 닿는 길을 정리합니다"
  - ring: {target: '[data-view="macro-dashboard"] :is(h2,h3,h4):has-text("거시경제 분석 프레임워크")', sec: 3.5}
  - scroll: {target: '[data-view="macro-dashboard"] :is(h2,h3,h4):has-text("거시경제 분석 프레임워크")', block: "start", after: 1.0}
  - say: "금리가 오르면 성장주 할인율이 커져 가치주가 유리하고, 장단기 금리차는 경기를 먼저 보여 줍니다"
  - pause: 6.0
  - say: "물가가 오르면 원가가 올라 이익이 줄고, 유가는 에너지 · 운송 · 소비재 이익에 바로 닿습니다"
  - pause: 6.0
  - say: "다가오는 일정 — 모의계좌에 가진 종목이 있으면 그 일정을 맨 위에 올립니다"
  - ring: {target: '[data-view="macro-dashboard"] :is(h2,h3,h4):has-text("다가오는 일정")', sec: 3.0}
  - chapter: {label: "2 / 3 · 과정", title: "업종과 일정", text: "섹터 ETF 로 업종 흐름을 비교하고, 한 달 달력에서 종류와 날짜를 골라 일정을 봅니다", sec: 4.5}
  - go: macro-industry
  - say: "산업 분석 — 미국 섹터 ETF 의 현재가 · 등락 · 등락률을 등락률 차례로 놓아 업종 흐름을 비교합니다"
  - ring: {target: "#industry-table-wrap", sec: 4.0}
  - say: "표 아래에도 출처와 받은 시각 한 줄"
  - ring: {target: "#industry-note", sec: 3.0}
  - say: "산업 분석 방법론 — 포터의 5가지 힘으로 산업 매력도를, 산업 수명주기로 지금 어느 단계인지 봅니다"
  - ring: {target: '[data-view="macro-industry"] :is(h2,h3,h4):has-text("산업 분석 방법론")', sec: 5.0}
  - go: market-calendar
  - say: "일정 — 휴장 · 파생 만기 · 금통위 · FOMC · 보고서 기한 · 배당 · 주주총회 · 실적 발표를 한 달 달력으로"
  - pause: 6.5
  - say: "종류 단추로 보고 싶은 일정만 고릅니다 — 주주총회를 끄면 달력에서 그 칸이 빠집니다"
  - click: 'button[data-kind="agm"]'
  - pause: 2.5
  - click: 'button[data-kind="agm"]'
  - pause: 1.5
  - say: "날짜를 누르면 그날 일정 목록이 열립니다"
  - click: 'button[data-day="2026-10-22"]'
  - wait: {target: "#cal-day-title", timeout: 15}
  - pause: 1.0
  - ring: {target: "#cal-day-title", sec: 3.0}
  - say: "이름이 보이는 일정을 누르면 설명 창이 열립니다"
  - click: 'button[data-ev="market_closure:2026-10-05"]'
  - wait: {target: "#cal-modal .cal-modal-box", timeout: 10}
  - pause: 5.0
  - click: "#cal-modal .cal-modal-x"
  - pause: 1.0
  - say: "‹ › 로 달을 옮깁니다 — 다음 달의 파생 만기 · 보고서 기한까지 미리 봅니다"
  - click: 'button[data-step="1"]'
  - pause: 5.0
  - chapter: {label: "3 / 3 · 결과", title: "시장을 보고 종목으로", text: "시장 전체의 흐름과 일정을 먼저 보고, 종목 화면으로 이어갑니다", sec: 4.5}
  - say: "정보 제공 목적이며 투자 권유가 아닙니다"
  - pause: 3.0

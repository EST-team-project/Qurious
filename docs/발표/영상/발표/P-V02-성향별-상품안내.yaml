# 발표 영상 — 나눈 비중대로, 상장 상품을 공시 정보로 비교한다 (자세한 판 · 2 ~ 3분 · 2026-10-18)
# 화면: 로보 어드바이저 › 투자 성향별 상품 안내 (agent-products) · 주담당 이동원
# 사용법 판(장면/V02)과 다른 점: 레버리지 · 인버스를 따로 모은 까닭과 「왜 n배가 아닌가」 칩 · 상품 창의 칩 둘(얼마나 벌었나 ·
#   가장 크게 잃은 때) · 「재는 법」 · 「표로 보기」 · 연습으로 이어짐
# 앞 영상(성향 진단 → 자산 배분)에서 저장한 배분이 있어야 탭에 비중이 보인다
file: 발표-V02-성향별-상품안내
title: 나눈 비중대로 상품을 공시 정보로 비교합니다
owner: 이동원
start: agent-products
steps:
  - chapter: {label: "1 / 3 · 목적", title: "추천이 아니라 비교입니다", text: "자산군마다 상장된 상품을 보여 주되, 순위를 매기지 않고 공시된 정보와 출처로 나란히 비교하게 합니다", sec: 5.5}
  - say: "앞에서 나눈 비중이 자산군 탭마다 그대로 들어옵니다"
  - ring: {target: 'button[data-tab="국내주식"]', sec: 3.5}
  - pause: 2.5
  - click: 'button[data-tab="국내채권"]'
  - say: "자산군을 고르면 그 자산군의 상장 상품이 묶음별로 나옵니다 — 묶음 안은 순자산이 큰 차례일 뿐, 좋고 나쁨이 아닙니다"
  - pause: 6.0
  - scroll: {by: 380}
  - say: "줄마다 순자산 · 거래대금 · 괴리율 · 1년 수익률 · 변동성 · 최대 낙폭을 같은 기준으로 놓습니다"
  - pause: 5.5
  - click: 'button[data-tab="derivatives"]'
  - say: "레버리지 · 인버스는 구조가 달라 따로 모읍니다"
  - pause: 3.5
  - click: 'button.pd-open[data-chart="122630"]'
  - wait: {target: '.pc-panel', timeout: 25}
  - pause: 2.0
  - say: "왜 2배가 아닌가 — 날마다 2배를 맞추기 때문에, 오래 들고 있으면 기간 수익은 기초지수의 2배가 되지 않습니다"
  - ring: {target: '.pc-panel', sec: 4.0}
  - pause: 4.0
  - key: Escape
  - click: 'button[data-tab="국내주식"]'
  - pause: 1.5
  - chapter: {label: "2 / 3 · 실행 과정", title: "상품 하나를 열어 숫자를 읽습니다", text: "수익 · 변동성 · 최대 낙폭을 출처와 기준일과 함께 보고, 재는 법까지 밝힙니다", sec: 5.0}
  - click: 'button.pd-open[data-chart="069500"]'
  - wait: {target: '.pc-panel', timeout: 20}
  - pause: 2.0
  - say: "KODEX 200 — 1년 수익률 · 변동성 · 최대 낙폭이 맨 위에, 숫자마다 출처와 기준일이 붙습니다"
  - ring: {target: '.pc-panel', sec: 4.0}
  - pause: 2.0
  - click: '.pc-panel [data-chip="return"]'
  - say: "얼마나 벌었나 — 분배금을 다시 넣었다고 본 값과 가격만 본 값을 나란히 봅니다"
  - pause: 6.0
  - click: '.pc-panel [data-chip="drawdown"]'
  - say: "가장 크게 잃은 때 — 고점에서 얼마나, 얼마 동안 떨어졌는지를 그림에 표시합니다"
  - pause: 6.0
  - click: '.pc-panel [data-pc="how"]'
  - say: "재는 법 — 숫자를 어떤 자료로 어떻게 계산했는지 그대로 밝힙니다"
  - pause: 5.0
  - click: '.pc-panel [data-pc="table"]'
  # 표는 「재는 법」 아래에 생긴다 — 창 안에서 표까지 굴린 뒤 말한다(2026-10-18 확인 그림에서 표가 화면 밖이었다)
  - scroll: {target: ".pc-table-wrap", block: "center"}
  - say: "그림 대신 표로도 봅니다 — 같은 숫자를 날짜별로"
  - pause: 4.5
  - scroll: {target: '.pc-panel >> text=연습', block: "center"}
  - say: "이 상품으로 사고팔기를 모의 계좌(가상 돈)에서 연습할 수 있게 이어집니다"
  - pause: 4.5
  - key: Escape
  - chapter: {label: "3 / 3 · 결과", title: "고르는 것은 사용자입니다", text: "추천 순위를 매기지 않고, 공시된 정보와 출처를 나란히 보여 줍니다", sec: 4.5}
  - say: "자료: 금융위원회 증권상품시세정보(공공데이터포털 · 공공누리 제4유형) · 투자 권유가 아닌 정보 제공입니다"
  - pause: 5.0

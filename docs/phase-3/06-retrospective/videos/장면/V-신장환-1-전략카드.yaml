# [사용법] 전략 카드 읽는 법 — 칸마다 무슨 뜻인가 (천천히 · 하나씩 설명)
# 화면: 투자 인디케이터 › 기본 인디케이터 전략 (indicator-strategy) · 외부 차트 알림 연동 (indicator-tradingview) · 담당 신장환
# 「카드 저장」은 누르지 않는다(데모 계정에 기록이 남는다). 입력 칸의 뜻을 하나씩 짚는다.
# 자막 규약: 자막(say)을 먼저, 그 자막이 설명하는 동작을 바로 뒤에 둔다.
file: V-신장환-1-전략카드
title: 전략 카드 읽는 법 — 칸마다 무슨 뜻인가
owner: 신장환
pace: 0.8
start: indicator-strategy
steps:
  - chapter: {label: "1 / 3 · 무엇을 하나요", title: "전략 분석으로 규칙 신호를 봅니다", text: "종목과 기간을 고르면 지표로 계산한 규칙 신호와 근거가 나옵니다. 매매 권유가 아니라 계산 결과입니다", sec: 6.0}
  - wait: {target: "#ind-symbol", timeout: 60}
  - say: "먼저 종목을 고릅니다"
  - ring: {target: "#ind-symbol", sec: 2.5}
  - pause: 1.5
  - say: "다음은 분석할 기간입니다. 길수록 오래된 흐름까지 봅니다"
  - ring: {target: "#ind-period", sec: 2.5}
  - pause: 2.0
  - say: "전략 분석 단추를 누르면 결과가 나옵니다"
  - ring: {target: "#ind-load-btn", sec: 2.5}
  - click: "#ind-load-btn"
  - wait: {target: ".view.active table tbody tr", timeout: 120, cut: true}
  - say: "표에는 지표 값과 규칙 신호, 근거 개수가 나옵니다. 어느 날짜 종가 기준인지도 함께 봅니다"
  - scroll: {by: 300}
  - pause: 6.2
  - chapter: {label: "2 / 3 · 카드 읽기", title: "전략 카드의 칸을 하나씩 봅니다", text: "카드에는 진입 조건뿐 아니라 손절 · 익절 · 수량 규칙까지 함께 적습니다", sec: 6.0}
  - scroll: {target: "#ind-card-box", block: "center"}
  - click: "#ind-card-box > summary"
  - wait: {target: "#ic-slug", timeout: 20}
  - say: "이동평균의 짧은 기간과 긴 기간입니다. 짧은 선이 긴 선 위에 있는 날의 종가마다 매수 쪽 신호입니다. 교차하는 순간만 보는 것이 아닙니다"
  - scroll: {target: "#ic-short", block: "center"}
  - ring: {target: "#ic-short", sec: 3.0}
  - pause: 5.4
  - say: "ATR 곱은 손절 거리를 정합니다. 값이 클수록 손절선이 멀어집니다"
  - ring: {target: "#ic-atr-mult", sec: 3.0}
  - pause: 3.0
  - say: "익절 손익비는 손실 한 번에 이익을 몇 배로 노리는지입니다. 이 값으로 익절선이 정해지고, 성과 검증의 합격선 PF와는 다른 값입니다"
  - ring: {target: "#ic-take-rr", sec: 3.0}
  - pause: 6.1
  - say: "1회 위험은 한 번 진 거래에서 잃어도 되는 자산 비율입니다. 주문 수량의 상한이고, 현금이나 종목 비중 한도가 더 작으면 그쪽이 수량을 정합니다"
  - ring: {target: "#ic-risk", sec: 3.0}
  - pause: 7.2
  - say: "최대 비중은 한 종목에 넣을 수 있는 한도입니다"
  - ring: {target: "#ic-maxpos", sec: 3.0}
  - pause: 1.5
  - say: "체결 시점은 신호가 난 다음 거래일 시가로 둡니다"
  - ring: {target: "#ic-mode", sec: 3.0}
  - pause: 2.5
  - say: "손절 판정은 종가 기준이고 청산은 다음 봉 시가라서, 갭만큼 손실이 계획보다 커질 수 있습니다"
  - ring: {target: "#ic-judge", sec: 3.0}
  - pause: 4.0
  - chapter: {label: "3 / 3 · 어디서 쓰이나요", title: "저장한 카드는 Pine 목록에도 나옵니다", text: "카드를 저장하면 같은 규칙이 Pine 코드를 만드는 화면에서도 선택됩니다. 이 영상에서는 저장하지 않았습니다", sec: 6.0}
  - go: indicator-tradingview
  - wait: {target: "#pc-card", timeout: 60}
  - say: "카드를 저장하면 이 목록에서 골라 같은 규칙의 Pine 코드를 만들 수 있습니다. 지금은 저장하지 않아 예시 카드가 보입니다"
  - scroll: {target: "#pc-card", block: "center"}
  - ring: {target: "#pc-card", sec: 4.0}
  - pause: 5.0

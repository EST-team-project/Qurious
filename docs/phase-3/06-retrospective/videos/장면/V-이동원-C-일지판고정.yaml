# [사용법] 일지 상태 명령 출력 읽는 법 — 판 · 봉인 · 행 · 평가 · 지문 (천천히 · 하나씩 설명)
# 화면: 앱 화면이 아니라 명령줄 출력 카드 — 앱에는 일지 전용 화면이 없다. 담당 이동원
# 카드 내용: 11-10 08:49 에 `python scripts/paper_journal.py status`(읽기 전용)를 실행한 출력을 그대로 옮겼다(docs/phase-3/06-retrospective/이동원/그림/3차-일지-명령출력.png 와 같은 글). 카드 머리에 「실제 명령 출력을 옮긴 카드」 라고 밝힌다.
# 녹화 전 필수: 12:30 회차가 돌면 행 수 · 마지막 거래일 · 평가가 바뀐다 → status 를 다시 돌려 `js` 단계의 카드 글을 맞춘다. 판 2 이상이 보이면 찍지 않는다. 더 좋은 길: 담당자가 실제 터미널을 화면 녹화해 바꿔 끼운다.
# 11-09 S215 정정: 자막에 박혀 있던 실행 시각(「오전 10시 13분」 · 「11월 6일 12시 58분」)이 카드(13:55 · 11-09 13:01)와 달라서 시각 표현을 뺐다. 11-10 녹화 직전 갱신할 곳 = js 카드 글 전체 + 자막 「규칙마다 45개 · 마지막 행은 11월 6일」 + chapter 「45행 = 사후 35 + 전진 10」 + 「새 행 2개 · 새 파일 2개」 가 그날 값과 같은지.
# 말하지 않는 것: 성과 · 수익 · 「규칙이 검증됐다」 · 「절대 바뀌지 않는다」 · 「증권사에 주문을 냈다」. 평가 숫자는 손익이 아니다.
# 자막 규약: 자막(say)을 먼저, 그 자막이 설명하는 동작(ring)을 바로 뒤에 둔다.
file: V-이동원-C-일지판고정
title: 일지 상태 명령 출력 읽는 법
owner: 이동원
pace: 0.8
start: dashboard
steps:
  - chapter: {label: "1 / 3 · 무엇을 하나요", title: "일지는 판을 지문으로 잠그고 매일 한 줄씩 쌓습니다", text: "그림자 일지는 규칙과 코드를 지문으로 고정해 두고, 거래일마다 가상 장부 하루치를 기록합니다. 상태는 명령 한 줄로 읽습니다", sec: 6.0}
  - js: "(() => { const d = document.createElement('div'); d.id = 'jcard'; d.style.cssText = 'position:fixed;inset:0;z-index:2147480000;background:#0b1220;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box'; d.innerHTML = `<style>#jcard .c{width:1200px;max-width:100%;background:#0f1f2c;color:#d7e3ee;border:2px solid #1d3a4e;border-radius:14px;padding:26px 30px;font:16px/2.2 Consolas,'D2Coding','Malgun Gothic',monospace}#jcard .h{display:flex;justify-content:space-between;color:#86efac;font-weight:700}#jcard .h i{color:#94a3b8;font-style:normal;font-weight:400;font-size:14px}#jcard .cmd{color:#7dd3fc}#jcard b{font-weight:600;border-bottom:3px solid #6366f1}</style><div class='c'><div class='h'><span>● 실제 명령 출력을 옮긴 카드 (11-10 08:49 실행)</span><i>종료 코드 0 · 읽기 전용</i></div><div class='cmd' id='jc-cmd'>$ python scripts/paper_journal.py status</div><div id='jc-r1'>— card_ma_cross_20_60 · <b id='jc-ver1'>판 1(시도 1)</b> · <b id='jc-seal1'>봉인 2026-10-26 ~</b> · <b id='jc-rows1'>행 45</b> · <b id='jc-last1'>마지막 2026-11-06</b> · <b id='jc-eq1'>평가 9367117.66</b> · <b id='jc-fp1'>지문 ✅ 같음</b></div><div id='jc-r2'>— auto_default · 판 1(시도 2) · 봉인 2026-10-26 ~ · 행 45 · 마지막 2026-11-06 · 평가 7221552.42 · 지문 ✅ 같음</div><div id='jc-memo'>— 메모 4건</div><div id='jc-daily'>— 마지막 daily 2026-11-09T13:01:32+09:00 · 새 행 2 · 판 바뀜 0</div><div id='jc-up'>— 마지막 올리기 2026-11-09T13:08:57+09:00 · qurious-quant/qurious-paper-log · 커밋 2a522b50 · 새 파일 2</div></div>`; document.body.appendChild(d); })()"
  - wait: {target: "#jc-cmd", timeout: 10}
  - say: "일지의 지금 상태는 이 명령 한 줄로 읽습니다. 읽기 전용이라 일지에 아무것도 쓰지 않습니다"
  - ring: {target: "#jc-cmd", sec: 3.0}
  - pause: 4.5
  - say: "이 화면은 앱이 아니라 명령을 실행한 출력을 옮긴 카드입니다. 카드 맨 위에 적힌 시각에 실행한 값입니다"
  - ring: {target: "#jc-r1", sec: 3.0}
  - pause: 5.0
  - chapter: {label: "2 / 3 · 읽는 법", title: "한 줄을 칸마다 읽습니다", text: "규칙 이름 다음에 판 · 봉인 · 행 · 마지막 거래일 · 평가 · 지문이 차례로 나옵니다", sec: 5.0}
  - say: "먼저 판입니다. 판 1은 처음 등록한 규칙과 코드의 묶음이고, 괄호 안은 시도 번호입니다"
  - ring: {target: "#jc-ver1", sec: 3.0}
  - pause: 6.0
  - say: "봉인은 이 판의 전진 기록이 시작된 날입니다. 10월 26일 이전 행은 사후에 계산한 값입니다"
  - ring: {target: "#jc-seal1", sec: 3.0}
  - pause: 6.0
  - say: "행은 그 판에 쌓인 거래일 수이고 규칙마다 45개입니다. 마지막 행은 가장 최근 거래일인 11월 6일입니다"
  - ring: {target: "#jc-rows1", sec: 3.0}
  - ring: {target: "#jc-last1", sec: 3.0}
  - pause: 4.0
  - say: "평가는 마지막 행의 가상 장부 종가 평가액입니다. 손익이나 수익률이 아니라서 성과로 읽지 않습니다"
  - ring: {target: "#jc-eq1", sec: 3.0}
  - pause: 6.0
  - say: "지문 같음은 지금 코드로 다시 잰 지문이 등록해 둔 판의 지문과 같다는 뜻입니다. 주석이나 공백을 바꿔도 같고 식을 바꾸면 달라집니다"
  - ring: {target: "#jc-fp1", sec: 3.0}
  - pause: 7.0
  - say: "다르게 나오면 다음 회차가 새 판을 등록하고 옛 판은 그대로 둡니다. 이 출력은 두 규칙 모두 같은 판입니다"
  - ring: {target: "#jc-r2", sec: 3.0}
  - pause: 6.0
  - chapter: {label: "3 / 3 · 아래 세 줄", title: "마지막 회차의 기록입니다", text: "메모 · 마지막 계산 · 마지막 올리기가 나옵니다", sec: 4.0}
  - say: "메모는 일지에 남겨 둔 메모의 개수입니다"
  - ring: {target: "#jc-memo", sec: 2.5}
  - pause: 3.0
  - say: "마지막 daily 줄은 가장 최근 회차가 새 행 2개를 쓰고 판은 바뀌지 않았다는 기록입니다"
  - ring: {target: "#jc-daily", sec: 3.0}
  - pause: 6.0
  - say: "마지막 올리기 줄은 같은 내용을 비공개 원장에 새 파일 2개로 올린 기록입니다. 다른 PC는 이 원장을 받아 이어서 계산합니다"
  - ring: {target: "#jc-up", sec: 3.0}
  - pause: 7.0
  - chapter: {label: "정리", title: "성과가 아니라 기록과 고정이 동작하는지입니다", text: "45행은 봉인 전 사후 계산 35행과 봉인 뒤 전진 기록 10행입니다. 12시 30분 회차가 돌면 행 수가 바뀝니다", sec: 6.0}
  - js: "document.getElementById('jcard')?.remove()"

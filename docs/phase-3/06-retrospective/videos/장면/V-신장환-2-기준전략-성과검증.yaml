# [사용법] 기준 전략 카드와 성과 검증 읽는 법 (천천히 · 하나씩 설명)
# 화면: 전략 분석 · 성과 검증 (quant-backtest) · 담당 신장환 (「기준 전략」 카드 화면은 이동원 작업 #449)
# 자막 규약: 자막(say)을 먼저, 그 자막이 설명하는 동작을 바로 뒤에 둔다.
file: V-신장환-2-기준전략-성과검증
title: 기준 전략 카드와 성과 검증 읽는 법
owner: 신장환
pace: 0.8
start: quant-backtest
steps:
  - chapter: {label: "1 / 3 · 기준 전략 카드", title: "합격한 전략이 있는지 맨 위에서 알려 줍니다", text: "미리 정한 합격선을 넘은 전략만 기준 전략이 됩니다. 아직 없으면 없다고 적습니다", sec: 6.0}
  - wait: {target: "#bn-mount-quant-backtest .bn-card", timeout: 60}
  - say: "이 카드가 기준 전략 카드입니다. 현재 상태가 맨 위에 나옵니다"
  - scroll: {target: "#bn-mount-quant-backtest", block: "start"}
  - ring: {target: "#bn-mount-quant-backtest .bn-card", sec: 4.0}
  - pause: 3.0
  - say: "아래 숫자는 시도한 조합 가운데 기준을 넘은 개수입니다. 기준은 이익÷손실(PF), 최대 낙폭, 샤프 세 가지이고 비용을 뺀 뒤 계산합니다"
  - ring: {target: "#bn-mount-quant-backtest .bn-stats", sec: 4.0}
  - pause: 5.6
  - say: "가장 가까웠던 시도가 참고로 나옵니다. 이 시도를 골라 쓰지는 않았다는 설명이 함께 있습니다"
  - ring: {target: "#bn-mount-quant-backtest .bn-near", sec: 4.0}
  - pause: 5.0
  - chapter: {label: "2 / 3 · 성과 검증", title: "전략 하나의 성과를 비용을 뺀 뒤 봅니다", text: "성과 검증 탭에서 종목과 전략, 수수료, 슬리피지를 정하고 실행합니다", sec: 6.0}
  - click: "#bn-mount-quant-backtest .bn-tab:has-text('성과 검증')"
  - wait: {target: "#ibt-run-btn", timeout: 20}
  - say: "먼저 검증할 전략을 고릅니다"
  - scroll: {target: "#ibt-strategy", block: "center"}
  - ring: {target: "#ibt-strategy", sec: 3.0}
  - pause: 2.5
  - say: "수수료와 슬리피지는 거래할 때마다 빠지는 비용입니다. 이 값을 넣어야 현실에 가까운 성과가 나옵니다"
  - ring: {target: "#ibt-cost", sec: 3.0}
  - pause: 5.0
  - say: "실행 단추를 누르면 수집된 일봉으로 계산합니다. 국내 주식은 2020년부터라 10년보다 짧습니다"
  - ring: {target: "#ibt-run-btn", sec: 3.0}
  - click: "#ibt-run-btn"
  - wait: {target: "#ibt-result > *", timeout: 150, cut: true}
  - pause: 1.5
  - say: "결과에는 비용을 뺀 수익과 최대 낙폭, 샤프가 나옵니다"
  - scroll: {target: "#ibt-result", block: "start"}
  - pause: 6.0
  - chapter: {label: "3 / 3 · 알아 둘 점", title: "거래가 없거나 합격이 없는 것도 결과입니다", text: "신호가 없으면 거래 0회라고 안내하고, 합격 전략이 없으면 없다고 적습니다. 결과를 꾸미지 않습니다", sec: 6.0}

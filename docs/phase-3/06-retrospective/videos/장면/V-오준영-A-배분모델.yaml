# [사용법] 자산 배분 모델 고르는 법 (천천히 · 하나씩 설명)
# 화면: 로보 어드바이저 › 자산배분 · 최적화 (robo-portfolio) · 담당 오준영
# 계산 결과는 저장될 뿐 주문은 나가지 않는다. Black-Litterman 은 전망 입력이 필요해 이 영상에서는 설명만 하고 실행하지 않는다.
# 자막 규약: 자막(say)을 먼저, 그 자막이 설명하는 동작을 바로 뒤에 둔다.
file: V-오준영-A-배분모델
title: 자산 배분 모델 고르는 법
owner: 오준영
pace: 0.8
start: robo-portfolio
steps:
  - chapter: {label: "1 / 3 · 무엇을 하나요", title: "자산군별 비중을 계산합니다", text: "투자 성향과 기간으로 주식 · 채권 · 현금 같은 자산군에 얼마씩 나눌지 계산합니다. 계산 결과는 저장되지만 실제 주문은 나가지 않습니다", sec: 7.0}
  - wait: {target: "#robo-allocation-model", timeout: 60}
  - say: "먼저 투자 성향을 고릅니다. 위험을 얼마나 받아들이는지에 대한 선택입니다"
  - scroll: {target: "#robo-risk", block: "center"}
  - ring: {target: "#robo-risk", sec: 3.0}
  - pause: 4.0
  - say: "다음은 투자 기간입니다. 기간이 길수록 위험을 더 받아들일 수 있다고 봅니다"
  - ring: {target: "#robo-horizon", sec: 3.0}
  - pause: 4.0
  - say: "투자할 금액입니다"
  - ring: {target: "#robo-amount", sec: 3.0}
  - pause: 1.5
  - chapter: {label: "2 / 3 · 모델 고르기", title: "배분 모델을 바꾸면 비중이 달라집니다", text: "모델마다 비중을 정하는 기준이 다릅니다. 같은 조건에서 바꿔 비교해 보세요", sec: 6.0}
  - say: "배분 모델 칸입니다. 기본은 성향과 기간 기준이고, 아래에서 다른 모델을 고를 수 있습니다"
  - ring: {target: "#robo-allocation-model", sec: 3.0}
  - pause: 4.0
  - say: "리스크 패리티는 자산마다 위험 기여도를 고르게 맞추는 방식입니다"
  - select: {target: "#robo-allocation-model", value: "risk_parity"}
  - pause: 4.0
  - say: "실행 단추를 누르면 자산군별 비중이 카드와 막대로 나옵니다"
  - click: "#robo-optimize-btn"
  - wait: {target: "#robo-alloc-result:not(.hidden)", timeout: 120, cut: true}
  - scroll: {target: "#robo-alloc-cards", block: "center"}
  - pause: 6.0
  - say: "최소분산으로 바꿔 다시 실행합니다. 추정 변동성을 가장 낮추는 비중이라 앞의 결과와 달라집니다"
  - select: {target: "#robo-allocation-model", value: "minimum_variance"}
  - click: "#robo-optimize-btn"
  - wait: {target: "#robo-alloc-result:not(.hidden)", timeout: 120, cut: true}
  - scroll: {target: "#robo-alloc-cards", block: "center"}
  - pause: 6.0
  - chapter: {label: "3 / 3 · 알아 둘 점", title: "저장될 뿐 주문은 나가지 않습니다", text: "Black-Litterman 은 내 전망을 직접 입력해야 해서 이 영상에서는 실행하지 않았습니다. 기준 균형 비중은 성향 배분이며 시가총액 비중이 아닙니다", sec: 7.0}

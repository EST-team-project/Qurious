# [사용법] 기준일 읽는 법 — 이 신호는 언제 종가로 만든 것인가 (천천히 · 하나씩 설명)
# 화면: 신호 순위 (signal-rank) · 퀀트 대시보드 (quant-dashboard) · 담당 이동원
# 앱에 「데이터 대기」 문구 화면은 없다 — 항상 보이는 기준일 · 계산 시각 · 배지 · 설명 한 줄을 읽는 법을 천천히 보여 준다.
# 자막 규약: 자막(say)을 먼저, 그 자막이 설명하는 동작을 바로 뒤에 둔다.
file: V-이동원-B-낡은일봉방어
title: 기준일 읽는 법 — 이 신호는 언제 종가로 만든 것인가
owner: 이동원
pace: 0.8
start: signal-rank
steps:
  - chapter: {label: "1 / 3 · 왜 필요한가요", title: "신호는 날짜의 종가로 만든 값입니다", text: "어느 날짜 종가인지 모르면 오래된 값을 오늘 값으로 오해할 수 있습니다. 그래서 화면마다 기준일을 밝혀 둡니다", sec: 6.0}
  - wait: {target: "[data-sr-fresh]", timeout: 60}
  - say: "신호 순위 표의 맨 위 줄을 읽어 봅니다. 「기준」 뒤의 날짜가 이 신호를 만든 종가의 날짜입니다"
  - scroll: {target: "[data-sr-fresh]", block: "start"}
  - ring: {target: "[data-sr-fresh]", sec: 4.0}
  - pause: 3.0
  - chapter: {label: "2 / 3 · 어떻게 읽나요", title: "기준 · 계산 · 배지 · 설명을 차례로 봅니다", text: "기준은 종가의 날짜, 계산은 신호를 기록한 시각입니다. 배지와 설명이 지금 값이 정상인지 알려 줍니다", sec: 6.0}
  - say: "「계산」 뒤의 시각은 이 신호를 기록한 시각입니다. 매일 낮 12시 30분 회차가 끝난 뒤의 시각이 나옵니다"
  - ring: {target: "[data-sr-fresh]", sec: 4.0}
  - pause: 4.0
  - say: "옆의 배지는 상태를 짧게 알려 주고, 아래 한 문장이 까닭을 설명합니다"
  - pause: 5.4
  - say: "오늘 종가로 만든 신호는 다음 거래일 12시 30분 회차 뒤에 보입니다"
  - pause: 5.5
  - say: "그 전에는 전 거래일 값이 정상입니다"
  - pause: 5.0
  - go: quant-dashboard
  - wait: {target: "#quant-watch [data-sr-fresh]", timeout: 60}
  - say: "퀀트 대시보드의 관찰 목록 표에도 같은 기준일 줄이 있습니다"
  - scroll: {target: "#quant-watch", block: "start"}
  - ring: {target: "#quant-watch [data-sr-fresh]", sec: 4.0}
  - pause: 4.0
  - chapter: {label: "3 / 3 · 알아 둘 점", title: "모르는 것은 모른다고 적습니다", text: "증권사 일봉의 오늘 종가가 몇 시에 확정되는지는 아직 공식 종가와 대조하지 못했습니다. 확인되면 이 설명도 바뀝니다", sec: 6.0}

# [사용법] 신호 순위 — 조건으로 걸러 보고, 새로고침하고, 근거 보기 (천천히 · 하나씩 설명)
# 화면: 로보 어드바이저 › 신호 순위 (signal-rank) · 퀀트 대시보드 › 관찰 목록 표 (quant-dashboard) · 담당 이동원
# 자막 규약: 자막(say)을 먼저, 그 자막이 설명하는 동작(click · ring · scroll)을 바로 뒤에 둔다(tools/demo/subtitle_sync.py check).
file: V-이동원-A-신호순위
title: 신호 순위 — 조건으로 걸러 보는 법
owner: 이동원
pace: 0.8
start: signal-rank
steps:
  - chapter: {label: "1 / 3 · 무엇을 하나요", title: "기록된 신호를 순위로 봅니다", text: "매일 낮 12시 30분에 기록해 둔 종목별 신호를 한 화면에서 모아 봅니다. 추천 순위가 아니라 규칙 신호의 기록입니다", sec: 5.0}
  - wait: {target: ".view.active table tbody tr", timeout: 60}
  - say: "표 위쪽에 기준 날짜와 계산 시각이 있습니다. 이 날짜의 종가 기준으로 만든 신호입니다"
  - ring: {target: "[data-sr-fresh]", sec: 3.5}
  - pause: 3.0
  - chapter: {label: "2 / 3 · 어떻게 쓰나요", title: "신호와 시장 단추로 거릅니다", text: "단추를 누르면 순위 전체에서 조건에 맞는 종목만 남깁니다", sec: 4.5}
  - say: "먼저 신호 단추입니다. 매수, 매도, 관망 가운데 보고 싶은 것을 누릅니다"
  - ring: {target: '[data-sr-filter="signal"][data-value="매수"]', sec: 2.5}
  - click: '[data-sr-filter="signal"][data-value="매수"]'
  - pause: 3.5
  - say: "다음은 시장 단추입니다. 코스피, 코스닥, ETF 중에서 고릅니다"
  - ring: {target: '[data-sr-filter="market"][data-value="KOSDAQ"]', sec: 2.5}
  - click: '[data-sr-filter="market"][data-value="KOSDAQ"]'
  - wait: {target: ".view.active table tbody tr", timeout: 60, cut: true}
  - say: "고르면 조건과 맞는 종목 수가 나옵니다. 줄 수와 상관없이 전체에서 먼저 거릅니다"
  - scroll: {target: "[data-sr-fresh]", block: "start"}
  - pause: 5.0
  - say: "새로고침 단추입니다. 기록을 서버에서 다시 읽고, 위쪽 10종목에는 지금 가격을 붙입니다"
  - scroll: {by: -400}
  - ring: {target: "[data-sr-refresh]", sec: 2.5}
  - click: "[data-sr-refresh]"
  - scroll: {target: "[data-sr-fresh]", block: "start"}
  - pause: 4.0
  - say: "신호를 새로 계산하지는 않고, 12시 30분 기록을 그대로 보여 줍니다"
  - pause: 5.4
  - chapter: {label: "3 / 3 · 근거 보기", title: "줄을 누르면 근거가 나옵니다", text: "왜 매수 쪽인지, 어느 날짜 기준인지를 문장으로 봅니다", sec: 4.0}
  - say: "종목 줄을 누르면 근거 창이 열립니다. 신호가 나온 까닭과 기준일이 문장으로 나옵니다"
  - click: ".view.active table tbody tr[data-hub-open]"
  - pause: 6.0
  - key: "Escape"
  - go: quant-dashboard
  - wait: {target: "#quant-watch table tbody tr", timeout: 60}
  - say: "퀀트 대시보드의 관찰 목록 표에서도 같은 방법으로 거를 수 있습니다"
  - scroll: {target: "#quant-watch", block: "start"}
  - pause: 3.6
  - say: "신호 단추를 누르면 받아 둔 목록 안에서 맞는 종목만 남고, 몇 종목 중 몇 종목인지 나옵니다"
  - ring: {target: '#quant-watch [data-qd-wfilter][data-value="매수"]', sec: 2.5}
  - click: '#quant-watch [data-qd-wfilter][data-value="매수"]'
  - pause: 4.0
  - say: "새로고침을 눌러도 걸어 둔 필터는 그대로 남고, 다시 읽은 시각이 나옵니다"
  - click: "#quant-watch [data-qd-wrefresh]"
  - wait: {target: "#quant-watch [data-qd-watch-note]:has-text('다시 읽었습니다')", timeout: 60}
  - pause: 4.0

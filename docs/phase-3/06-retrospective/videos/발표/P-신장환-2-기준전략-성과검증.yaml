# [발표용] 신장환 ② — 기준 전략 110개를 시도해 합격 0건이라는 결과를 그대로 보이고, 성과를 비용 뒤에 검증한다 (빠르게 · 핵심만)
# 화면: 전략 분석 · 성과 검증 (quant-backtest) · 담당 신장환 (「기준 전략」 카드 화면은 이동원 작업 #449 — 영상 안에서 밝힌다)
# 3차 신규: 합격선을 미리 적고 조합표만 시도 · 합격 0건 공개 · 비용 뒤 성과 검증
# 110개 시도 자체는 CLI 산출이라 화면에 안 나온다 — 카드의 숫자(정적 파일)와 설명으로 보여 준다.
# 자막 규약: 자막(say)을 먼저, 그 자막이 설명하는 동작을 바로 뒤에 둔다.
file: P-신장환-2-기준전략-성과검증
title: 기준 전략 110개 시도 — 합격 0건을 그대로 보입니다
owner: 신장환
pace: 1.4
start: quant-backtest
steps:
  - chapter: {label: "1 / 3 · 목적", title: "좋은 결과만 고르지 않습니다", text: "합격선을 미리 적어 두고, 미리 적은 조합표만 시도해서 넘은 것만 기준 전략으로 삼습니다", sec: 3.5}
  - wait: {target: "#bn-mount-quant-backtest .bn-card", timeout: 60}
  - say: "맨 위 기준 전략 카드입니다. 지금은 아직 없음입니다"
  - scroll: {target: "#bn-mount-quant-backtest", block: "start"}
  - ring: {target: "#bn-mount-quant-backtest .bn-card", sec: 3.0}
  - pause: 2.5
  - chapter: {label: "2 / 3 · 과정", title: "합격선을 동시에 넘어야 합니다", text: "비용을 뺀 뒤 손익비 · 최대 낙폭 · 샤프 세 가지를 모두 넘는 조합만 통과합니다", sec: 3.5}
  - say: "기준별로 넘은 개수입니다. 세 기준을 동시에 넘은 조합은 한 개도 없었습니다"
  - ring: {target: "#bn-mount-quant-backtest .bn-stats", sec: 3.0}
  - pause: 3.0
  - say: "가장 가까웠던 시도는 참고용입니다. 골라 쓴 것이 아닙니다"
  - ring: {target: "#bn-mount-quant-backtest .bn-near", sec: 3.0}
  - pause: 2.5
  - say: "성과 검증 탭에서는 전략을 골라 수수료와 슬리피지를 뺀 성과를 봅니다"
  - click: "#bn-mount-quant-backtest .bn-tab:has-text('성과 검증')"
  - wait: {target: "#ibt-run-btn", timeout: 20}
  - scroll: {target: "#ibt-run-btn", block: "center"}
  - pause: 2.5
  - click: "#ibt-run-btn"
  - wait: {target: "#ibt-result > *", timeout: 150, cut: true}
  - say: "비용을 뺀 수익 · 최대 낙폭 · 샤프가 나옵니다"
  - scroll: {target: "#ibt-result", block: "start"}
  - pause: 4.5
  - chapter: {label: "3 / 3 · 결과", title: "통과한 전략이 없다는 것도 결과입니다", text: "기준 전략 카드 화면은 이동원, 시도와 검증은 신장환이 맡았습니다", sec: 4.5}

# 영상 C(일지 판 고정) — 설명 · 카드 큐 (30분 발표 · 2026-11-11 S222)
# 지점은 녹화 기록 P-이동원-C-….events.json 의 순번이다. 「겪은 문제(판 2)」는 넣지 않는다(사용자 11-11).
# 사용자 11-11: 자동 멈춤은 기본이 아니다 — 큐는 영상이 재생되는 동안 dur 초 뜨는 설명(+ 쉬운 말). 시작 카드만 멈춰 있고 키로 시작한다.
# 문구 출처: 슬라이드 11장(일지 구조) 본문 · 노트 · 쉬운 말 상자.
# 말하지 않는 것(영상 C 장면 파일 주의): 성과 · 수익 · 「규칙이 검증됐다」 · 「절대 바뀌지 않는다」 · 증권사에 주문을 냈다 — 가상 장부다.
video: P-이동원-C-일지판고정
cues:
  - id: C1
    at: {kind: chapter, n: 1}                 # 영상 시작 — 카드를 먼저 띄운 뒤 재생한다
    type: card
    pause: true
    image: 이동원/그림/카드-일지구조.png
    title: 그림자 일지 — 규칙 → 지문 → 판 → 행
    text: 규칙 2개(카드 ma_cross_20_60 · 자동매매 기본 규칙)에 쓰이는 함수와 설정으로 코드 지문(SHA-256)을 만들고, 지문이 같은 동안은 같은 판으로 봅니다. 판 위에 거래일마다 행이 하나씩 쌓입니다. 영상을 시작하려면 스페이스.

    text: 전날 낸 주문을 시가로 체결하고, 종가로 평가하고, 판단하고, 다음 날 시가 주문을 남기는 하루치입니다. 마지막 행은 11월 9일입니다.
    easy: 시가 = 그날 처음 거래된 가격 · 종가 = 마지막 가격

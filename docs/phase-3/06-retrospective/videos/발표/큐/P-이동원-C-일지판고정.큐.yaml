    anchor: {kind: ring, n: 1}
    type: bubble
    dur: 7
    title: 명령 한 줄로 읽는 일지 상태
    text: python scripts/paper_journal.py status — 읽기 전용이라 아무것도 쓰지 않습니다. 아래는 11-10 13:55 에 실제로 실행한 출력 그대로입니다.
    easy: 읽기 전용 = 보기만 하고 바꾸지 않음
  - id: C3

# 영상 E(신호 순위 · 근거 상세) — 설명 · 카드 큐 (30분 발표 · 2026-11-11 S222)
# 지점은 녹화 기록 P-이동원-E-….events.json 의 순번이다(절대 시각이 아님 — 다시 녹화해도 이 파일은 그대로 쓴다).
# 사용자 11-11: 「자동 멈춤은 별로 · 자막과 설명은 슬라이드에 있던 내용으로 더 상세히」 → 큐는 기본 영상을 멈추지 않는다.
#   · card + pause: true = 영상 시작 전에 멈춰 있는 카드(키로 시작) · bubble = 영상이 재생되는 동안 dur 초 뜨는 설명(+ 쉬운 말)
#   · 문구 출처: 슬라이드 10장(신호 기록 넓히기) 본문 · 노트 · 쉬운 말 상자, 영상 E 화면 글. 리허설에서 넘치면 enabled: false 로 끈다.
video: P-이동원-E-신호순위-근거-상세
cues:
  - id: E1
    at: {kind: chapter, n: 1}                 # 영상 시작 — 카드를 먼저 띄운 뒤 재생한다
    type: card
    pause: true
    image: 이동원/그림/카드-신호기록.png
    title: 신호 기록 넓히기 — 401종목에서 약 3,950종목으로
    text: 원래 분봉이 쌓이는 401종목만 기록하던 것을 KOSPI · KOSDAQ · ETF 전체로 넓혔습니다(새로 3,549종목 · 일봉 · 주봉으로 계산). 신호 계산은 신장환 님 코드를 그대로 부르고, 제가 만든 것은 대상 목록 · 기록 단계 · 보존 규칙입니다(시험 8건). 영상을 시작하려면 스페이스.
  - id: E2
    at: {kind: say, n: 1}                     # 「신호 순위 화면입니다. 이 순서는 추천이 아니라…」
    type: bubble
    dur: 7
    title: 지금 보는 곳 — 기록을 읽어 보여 주는 화면
    text: 수집 DB 에 매일 기록한 약 3,950종목의 규칙 신호를 매수 · 매도 · 관망, 시장별로 나눠 보여 줍니다. 순서는 추천이 아니라 기록된 종합 점수 순입니다.
    easy: 신호 = 매수 · 매도 · 관망 규칙 결과
  - id: E3
    at: {kind: ring, n: 1}                    # 신호 단추 「매수」를 누르는 순간
    anchor: {kind: ring, n: 1}
    place: right                              # 다음에 누를 「시장」 줄(KOSPI · KOSDAQ 단추)을 가리지 않게 단추 오른쪽 빈 곳에
    dx: 260
    type: bubble
    dur: 8
    title: 거르기는 서버가 먼저
    text: 신호 「매수」, 시장 「KOSDAQ」을 누르면 화면에 보이는 줄이 아니라 기록된 전체 종목에서 먼저 거른 뒤 위쪽 줄만 가져옵니다.
    easy: 서버 = 기록을 가지고 있는 쪽 컴퓨터
  - id: E4
    at: {kind: ring, n: 3}                    # 「맞는 종목 수 · 보여 주는 줄 수」 칸
    anchor: {kind: ring, n: 3}
    type: bubble
    dur: 9
    title: 숨기지 않는 숫자
    text: 맞는 종목 수와 보여 주는 줄 수를 함께 적습니다. 몇 종목 중 몇 줄을 보는 것인지 숨기지 않습니다.
    easy: 보여 주는 줄 수 = 한 번에 화면에 그리는 줄(위쪽 순위부터)
  - id: E5
    at: {kind: ring, n: 4}                    # 기준일 · 계산 시각
    anchor: {kind: ring, n: 4}
    type: bubble
    dur: 8
    title: 기준일과 계산 시각
    text: 순위는 장중에 다시 계산한 값이 아니라 마지막 종가 기준으로 기록해 둔 값입니다. 기준일과 계산 시각이 서버 글 그대로 붙습니다.
    easy: 종가 = 그날 장이 끝날 때의 마지막 가격
  - id: E6
    at: {kind: ring, n: 6}                    # 근거 창 맨 위(신호 · 기준 종가 · 계산 시각)
    anchor: {kind: ring, n: 6}
    type: bubble
    dur: 8
    title: 근거 창의 맨 위
    text: 종목 줄을 누르면 근거 창이 열립니다. 먼저 신호와 기준 종가, 언제 계산해 기록했는지가 나옵니다.
    easy: 근거 = 신호가 그렇게 나온 이유(규칙이 본 값)
  - id: E7
    at: {kind: ring, n: 7}                    # 근거 개수(매수 쪽 · 중립 · 매도 쪽)
    anchor: {kind: ring, n: 7}
    type: bubble
    dur: 7
    title: 한쪽 근거만 모으지 않음
    text: 근거 개수를 매수 쪽 · 중립 · 매도 쪽으로 나눠 나란히 보여 줍니다.
    easy: 중립 = 매수 · 매도 어느 쪽에도 일치하지 않는 근거
  - id: E8
    at: {kind: ring, n: 8}                    # 일봉 · 주봉 · 분봉 묶음
    anchor: {kind: ring, n: 8}
    type: bubble
    dur: 7.5
    title: 근거는 일봉 · 주봉 · 분봉으로 묶임
    text: 줄마다 규칙이 실제로 본 값과, 종합 점수에 더한 몫이 붙습니다.
    easy: 일봉 · 주봉 · 분봉 = 하루 · 한 주 · 1분 단위 가격 묶음
  - id: E9
    at: {kind: ring, n: 9}                    # 「반대로 본 까닭」
    anchor: {kind: ring, n: 9}
    type: bubble
    dur: 8.5
    title: 반대 근거도 같은 크기
    text: 종가가 볼린저 밴드 상단을 넘어 과열이라고 본 줄은 규칙 점수가 마이너스로 같이 나옵니다. 근거와 반대 근거를 같은 크기로 보여 줍니다.
    easy: 볼린저 밴드 = 평균 가격 위아래로 변동 폭을 그린 띠
  - id: E10
    at: {kind: ring, n: 10}                   # 값이 없는 칸
    anchor: {kind: ring, n: 10}
    type: bubble
    dur: 7
    title: 빈 칸은 이유를 적음
    text: 값이 없는 칸은 비워 두지 않고 「자료 없음」과 그 까닭을 적습니다.
  - id: E11
    at: {kind: ring, n: 12}                   # 지금 값 — 출처 딱지
    anchor: {kind: ring, n: 12}
    type: bubble
    dur: 8.5
    title: 지금 값은 따로 붙입니다
    text: 지금 값에는 출처 딱지와 마지막 종가와의 차이가 붙습니다. 지연 시세일 수 있고 저장하지 않으며, 기록된 신호와 섞지 않습니다.
    easy: 지연 시세 = 실시간보다 늦게 도착하는 가격(약 20분)
  - id: E12
    at: {kind: ring, n: 15}                   # 새로고침 뒤 위쪽 종목의 지금 가격 한 줄
    anchor: {kind: ring, n: 15}
    type: bubble
    dur: 8
    title: 새로고침
    text: 위쪽 종목에만 지금 가격 한 줄을 붙입니다. 신호는 새로 계산하지 않습니다.

# [발표용] 오준영 A — 같은 조건에서 배분 모델을 바꿔 자산군 비중을 비교한다 (빠르게 · 핵심만)
# 화면: 로보 어드바이저 › 자산배분 · 최적화 (robo-portfolio) · 담당 오준영
# 3차 신규: 배분 모델 선택(리스크 패리티 · 최소분산 · Black-Litterman · 시장 국면) — 계산 결과는 저장될 뿐 주문은 나가지 않는다
# 주의: 수집 DB 에 ETF 4종 일봉이 있어야 계산된다. Black-Litterman 은 전망 입력이 필요해 이 영상에서는 보이지 않는다.
# 자막 규약: 자막(say)을 먼저, 그 자막이 설명하는 동작을 바로 뒤에 둔다.
file: P-오준영-A-배분모델
title: 같은 조건에서 배분 모델을 바꿔 비중을 비교합니다
owner: 오준영
pace: 1.4
start: robo-portfolio
steps:
  - chapter: {label: "1 / 3 · 목적", title: "목적에 맞는 배분 모델을 고릅니다", text: "같은 성향과 기간에서 모델만 바꿔 자산군 비중이 어떻게 달라지는지 봅니다. 계산 결과는 저장되지만 주문은 나가지 않습니다", sec: 4.0}
  - wait: {target: "#robo-allocation-model", timeout: 60}
  - say: "배분 모델을 고르는 칸입니다. 기본은 성향과 기간 기준입니다"
  - scroll: {target: "#robo-allocation-model", block: "center"}
  - ring: {target: "#robo-allocation-model", sec: 2.5}
  - pause: 3.0
  - chapter: {label: "2 / 3 · 과정", title: "모델을 바꿔 실행합니다", text: "리스크 패리티, 최소분산, 시장 국면 순서로 같은 조건에서 실행합니다", sec: 3.0}
  - say: "리스크 패리티는 위험 기여도를 고르게 맞추는 모델입니다"
  - select: {target: "#robo-allocation-model", value: "risk_parity"}
  - click: "#robo-optimize-btn"
  - wait: {target: "#robo-alloc-result:not(.hidden)", timeout: 120, cut: true}
  - scroll: {target: "#robo-alloc-cards", block: "center"}
  - pause: 4.0
  - say: "최소분산은 추정 변동성을 가장 낮추는 비중을 고릅니다. 비중이 달라진 것을 봅니다"
  - select: {target: "#robo-allocation-model", value: "minimum_variance"}
  - click: "#robo-optimize-btn"
  - wait: {target: "#robo-alloc-result:not(.hidden)", timeout: 120, cut: true}
  - scroll: {target: "#robo-alloc-cards", block: "center"}
  - pause: 4.5
  - say: "시장 국면 모델은 추세와 변동성에 따라 비중을 바꿉니다"
  - select: {target: "#robo-allocation-model", value: "regime"}
  - click: "#robo-optimize-btn"
  - wait: {target: "#robo-alloc-result:not(.hidden)", timeout: 120, cut: true}
  - scroll: {target: "#robo-alloc-cards", block: "center"}
  - pause: 4.0
  - chapter: {label: "3 / 3 · 결과", title: "모델마다 비중이 다릅니다", text: "결과는 저장될 뿐 주문이나 리밸런싱 목표는 바뀌지 않습니다. 기준 균형 비중은 성향 배분이며 시가총액 비중이 아닙니다", sec: 5.0}

# [발표용] 오준영 C — 내 전략 카드를 가상 장부로 실행하고 주문 앞뒤 검사를 확인한다 (빠르게 · 핵심만)
# 화면: 내 계정 › 증권사 연동 구역(mypage) · 자동매매 현황(quant-auto) · 담당 오준영
# 3차 신규: 내 전략 카드 → 앱 가상 장부 실행(합격 판정 없음) · 위험 한도 · 마지막 결과(체결 · 위험관리 생략) 표시
# 선행 조건: 시연 계정에 실행 가능한 「내 전략」 카드가 1장 있어야 한다(신장환 ① 이 카드를 저장해야 함 — 이 장면은 저장하지 않는다). 카드가 없으면 `#quant-strategy-hint` 대기 단계에서 멈춘다.
# 비밀값: 같은 카드 안의 App Key · App Secret · 계좌번호 칸(#broker-credentials-wrap)은 hide 로 통째로 감춘다(화면에 나오지 않음). 내 이메일(#mp-email) · 실주문 현황(#quant-live-orders)은 흐리게.
# 누르지 않는 것: 저장 / 연결 · 연결 테스트 · ▶ 자동매매 시작 · ■ 중지 · 비상 정지 · 비상 정지 해제 · 전략 선택 저장(전략 칸은 고르기만 하고 저장 단추는 누르지 않는다).
# 한계: 시연 계정에는 자동매매 실행 기록이 없어 「주문 없음」 로그 · 막힌 사유 줄은 보이지 않는다. 마지막 결과 줄(체결 0건 · 위험관리 생략 0건)과 위험 한도 표만 보인다.
# 자막 규약: 자막(say)을 먼저, 그 자막이 설명하는 동작을 바로 뒤에 둔다.
file: P-오준영-C-내전략-가상장부
title: 내 전략 카드를 가상 장부로 실행하고 주문 앞뒤를 검사합니다
owner: 오준영
pace: 1.4
start: mypage
hide: ["#broker-credentials-wrap", "#broker-managed"]
mask: ["#mp-email", "#quant-live-orders"]
steps:
  - chapter: {label: "1 / 3 · 목적", title: "내 전략 카드를 가상 장부로 돌립니다", text: "증권사 계좌로는 주문을 보내지 않고, 앱 안 가상 장부에서만 체결합니다. 실행 전후에 위험 한도를 검사합니다", sec: 4.0}
  - wait: {target: "[data-mp-go='broker']", timeout: 60}
  - click: "[data-mp-go='broker']"
  - wait: {target: "#quant-mode", timeout: 30}
  - say: "자동매매 주문 방식은 앱 안 가상매매입니다"
  - scroll: {target: "#quant-mode", block: "center"}
  - ring: {target: "#quant-mode", sec: 2.5}
  - pause: 2.0
  - say: "안내대로 앱 가상 장부에서 체결하고 증권사 계좌로 주문을 보내지 않습니다"
  - ring: {target: "#quant-live-route", sec: 2.5}
  - pause: 3.0
  - chapter: {label: "2 / 3 · 과정", title: "내 전략을 고르고 검사 기준을 봅니다", text: "전략은 고르기만 하고 저장 단추는 누르지 않습니다", sec: 3.0}
  - say: "실행할 전략 칸에서 내 전략 카드를 고릅니다"
  - ring: {target: "#quant-strategy", sec: 2.5}
  - js: "(() => { const s = document.getElementById('quant-strategy'); const o = [...s.options].find(x => x.dataset.cardId && !x.disabled); if (o) { s.value = o.value; s.dispatchEvent(new Event('change')); } })()"
  - wait: {target: "#quant-strategy-hint:has-text('내 전략은 QUANT 가상계좌 전용')", timeout: 5}
  - say: "카드 값은 선택 당시로 고정되고 합격 판정이 아니라는 안내가 나옵니다"
  - ring: {target: "#quant-strategy-hint", sec: 2.5}
  - pause: 5.0
  - say: "주문 앞 검사 기준입니다. 일손실 한도와 종목당 최대 비중"
  - scroll: {target: "#risk-daily-loss", block: "center"}
  - ring: {target: "#risk-daily-loss", sec: 2.0}
  - ring: {target: "#risk-max-position", sec: 2.0}
  - pause: 1.5
  - say: "하루 최대 주문 수와 같은 종목 재주문을 막는 쿨다운입니다"
  - ring: {target: "#risk-max-orders", sec: 2.0}
  - ring: {target: "#risk-cooldown", sec: 2.0}
  - pause: 2.0
  - say: "실행 뒤에는 마지막 결과에 체결 건수와 위험관리로 건너뛴 건수가 남습니다"
  - scroll: {target: "#quant-cycle-status", block: "center"}
  - ring: {target: "#quant-cycle-status", sec: 2.5}
  - pause: 4.5
  - go: quant-auto
  - wait: {target: "#risk-kpis", timeout: 30}
  - say: "자동매매 화면의 위험관리 상태에서 비상 정지 상태와 오늘 주문 수를 한눈에 봅니다"
  - ring: {target: "#risk-kpis", sec: 2.5}
  - pause: 5.0
  - chapter: {label: "3 / 3 · 결과", title: "가상 장부에서만 체결되고 주문 앞뒤로 검사합니다", text: "이 영상에서는 자동매매를 시작하지 않았고 비상 정지도 바꾸지 않았습니다. 가상 체결 결과는 증권사 주문 결과와 다를 수 있습니다", sec: 5.0}

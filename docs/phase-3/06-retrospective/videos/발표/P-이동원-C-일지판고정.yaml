# [발표용] 이동원 C — 그림자 일지는 규칙과 코드의 지문으로 판을 고정한다 (빠르게 · 핵심만)
# 화면: 앱 화면이 아니라 명령줄 출력 카드 — 앱에는 일지 전용 화면이 없다. 담당 이동원
# 카드 내용: 11-10 13:55 에 `python scripts/paper_journal.py status`(읽기 전용)를 실행한 출력을 그대로 옮겼다(docs/phase-3/06-retrospective/이동원/그림/3차-일지-명령출력.png 와 같은 글). 카드 머리에 「실제 명령 출력을 옮긴 카드」 라고 밝힌다.
# 녹화 전 필수: 12:30 회차가 돌면 행 수 · 마지막 거래일 · 평가가 바뀐다(11-10 13:55 값 46행 · 11-11 12:30 회차 뒤 47행) → status 를 다시 돌려 아래 `js` 단계의 카드 글(행 · 마지막 · 평가 · 올리기 시각)을 맞춘다. 판 2 이상이 보이면 찍지 않는다. 더 좋은 길: 담당자가 실제 터미널을 화면 녹화(screen_recorder)해 바꿔 끼운다.
# 말하지 않는 것: 성과 · 수익 · 「규칙이 검증됐다」 · 「절대 바뀌지 않는다」 · 「증권사에 주문을 냈다」(전부 가상 장부). 평가 숫자는 손익이 아니다.
# 자막 규약: 자막(say)을 먼저, 그 자막이 설명하는 동작(ring)을 바로 뒤에 둔다.

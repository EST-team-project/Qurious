# [발표용] 이동원 D — 종목을 찾아 지금 값을 보고, 순위를 걸러 새로고침한다 (빠르게 · 핵심만)
# 화면: 로보 어드바이저 › 신호 순위 (signal-rank) · 종목 근거 창 · 담당 이동원
# 3차 신규: 종목 검색 · 종목 근거 창의 「지금 값 보기」(11-06 · 누를 때만 1회) · 칩 필터 · 새로고침의 지금 가격 한 줄(출처 딱지)
# 편 A(P-이동원-A)와의 차이: A 는 「걸러 보고 근거까지」 흐름이다. D 는 A 에 없는 두 가지 — 종목 검색 → 근거 창 「지금 값 보기」, 그리고 새로고침이 붙이는 지금 가격 한 줄 · 보여줄 줄 수 — 를 보인다. 합쳐 한 편으로 줄일 수도 있다.
# 주의: PAPER 모의주문 단추는 누르지 않는다. 지금 값은 지연 시세(약 20분)일 수 있고 실시간이 아니다 — 화면의 출처 딱지를 그대로 읽는다. 장이 닫힌 시각에는 마지막 종가가 보일 수 있다.
# 자막 규약: 자막(say)을 먼저, 그 자막이 설명하는 동작을 바로 뒤에 둔다.
file: P-이동원-D-신호순위-지금값
title: 종목을 찾아 지금 값을 보고 순위를 걸러 새로고침합니다
owner: 이동원
pace: 1.4
start: signal-rank
steps:
  - chapter: {label: "1 / 3 · 목적", title: "기록된 신호 옆에 지금 값을 놓고 봅니다", text: "신호는 12시 30분에 기록한 값이고, 지금 값은 누르거나 새로고침할 때만 따로 불러옵니다. 둘을 섞지 않고 출처를 붙여 보입니다", sec: 4.0}
  - wait: {target: ".view.active table tbody tr", timeout: 60}
  - say: "종목 검색 칸에 6자리 코드를 넣고 검색합니다"
  - fill: {target: "#sr-find-input", text: "005930"}
  - click: "[data-sr-find] button[type='submit']"
  - wait: {target: "[data-sr-find-note]:has-text('검색한 종목')", timeout: 30, cut: true}
  - pause: 1.5
  - say: "그 종목의 규칙 신호가 나옵니다. 줄을 누르면 근거 창이 열립니다"
  - click: ".view.active table tbody tr[data-hub-open]"
  - wait: {target: "[data-hub-now]", timeout: 30}
  - pause: 2.8
  - chapter: {label: "2 / 3 · 과정", title: "지금 값 보기와 새로고침", text: "지금 값 보기는 누를 때만, 새로고침은 위쪽 종목(최대 10개)에만 지금 가격을 붙입니다", sec: 3.0}
  - say: "근거 창 위쪽의 안내는 아래 가격이 마지막 거래일 종가라고 먼저 말합니다"
  - ring: {target: "[data-hub-now-out]", sec: 2.5}
  - pause: 3.0
  - say: "지금 값 보기를 누를 때만 지금 가격을 한 번 불러옵니다"
  - click: "[data-hub-now]"
  - wait: {target: "[data-hub-now]:not([disabled])", timeout: 40, cut: true}
  - pause: 2.9
  - say: "지금 값에 출처 딱지와 마지막 종가와의 차이가 붙습니다"
  - ring: {target: "[data-hub-now-out]", sec: 2.5}
  - pause: 4.0
  - key: "Escape"
  - click: "[data-sr-find-reset]"
  - wait: {target: ".view.active table tbody tr", timeout: 60, cut: true}
  - say: "이번에는 신호 단추 매수를 누르고 보여줄 줄 수를 100줄로 늘립니다"
  - click: '[data-sr-filter="signal"][data-value="매수"]'
  - select: {target: "#sr-limit", value: "100"}
  - wait: {target: "[data-sr-filter-note]", timeout: 60, cut: true}
  - ring: {target: "[data-sr-filter-note]", sec: 2.5}
  - pause: 2.5
  - say: "새로고침은 위쪽 종목(최대 10개)에 지금 가격 한 줄을 붙이고, 시세를 못 받은 종목은 건너뛰며, 신호는 새로 계산하지 않습니다"
  - click: "[data-sr-refresh]"
  - wait: {target: "[data-sr-quote]", timeout: 60, cut: true}
  - ring: {target: "[data-sr-quote]", sec: 2.5}
  - pause: 4.9
  - chapter: {label: "3 / 3 · 결과", title: "기록된 신호와 지금 값을 나란히 보되 섞지 않습니다", text: "지금 값은 저장하지 않고 지연 시세일 수 있습니다. 전체 종목을 실시간으로 다시 판단하는 것은 11월 12일 뒤 설계입니다. 규칙 신호의 기록이며 추천이 아닙니다", sec: 5.0}

# V03 — 규칙 신호로 종목을 거르고, 한 종목의 차트 패턴을 읽는다
# 화면: 로보 어드바이저 › 패턴 인식·종목 스크리닝 (robo-screening) · 차트 패턴·지지/저항·멀티타임프레임 (robo-patterns) · 주담당 신장환
file: V03-신호로-종목살피기
title: 규칙 신호로 종목을 거르고 차트 패턴을 읽습니다
owner: 신장환
start: robo-screening
steps:
  - chapter: {label: "1 / 3 · 목적", title: "신호로 후보 종목을 거릅니다", text: "추세 · MACD · RSI 규칙으로 매수 · 매도 신호와 신뢰도를 계산합니다", sec: 3.5}
  - say: "보고 싶은 신호와 신뢰도 기준을 고릅니다"
  - select: {target: "#screen-signal", label: "매수 신호"}
  - select: {target: "#screen-confidence", label: "65% 이상"}
  - click: "#screen-run-btn"
  - say: "조건에 맞는 종목과 신호 · 신뢰도가 나옵니다"
  - wait: {target: ".view.active table tbody tr", timeout: 150, cut: true}
  - pause: 1.0
  - scroll: {target: ".view.active table", block: "start"}
  - pause: 3.5
  - chapter: {label: "2 / 3 · 과정", title: "한 종목의 차트를 읽습니다", text: "차트 패턴 · 지지와 저항 · 여러 시간 단위의 신호를 한 화면에서 봅니다", sec: 3.0}
  - go: robo-patterns
  - fill: {target: "#pt-symbol", text: "005930"}
  - click: "#pt-run"
  - wait: {target: '#pt-run:has-text("분석 중")', state: "hidden", timeout: 120, cut: true}
  - pause: 1.5
  - say: "패턴과 지지 · 저항선, 시간 단위별 신호를 함께 봅니다"
  - scroll: {by: 420}
  - pause: 3.5
  # D54 — 차트 · 패턴 · 지지/저항은 수집 DB 의 수정주가(금융위원회 주식시세정보)로 계산한다(app/routes/stocks.py 차트 묶음)
  - say: "자료: 금융위원회 주식시세정보(공공데이터포털 · 공공누리 제4유형) · 수정주가 · 지표는 Qurious 가 계산"
  - pause: 3.0
  - chapter: {label: "3 / 3 · 결과", title: "신호는 판단의 재료입니다", text: "신호와 근거를 보여 줄 뿐, 사고팔지는 사용자가 정합니다", sec: 3.0}
  - say: "규칙으로 계산한 신호이며 투자 권유가 아닙니다"
  - pause: 3.0

# 발표 판 — 시장 속설과 모델을 데이터로 따져 본다 (자세한 판 · 2 ~ 3분 · 2026-10-18)
# 화면: 금융 필수 지식 › 계절성 분석 (quant-seasonal) · ML·딥러닝 › 종목 군집화 (ml-cluster) · 모델 비교 (ml-compare) · 주담당 이동원
# 계정: 일반(기본 계정)
# 늘린 것: 요약 넷 · 막대와 선 읽는 법 · 「해마다 표」 판정 줄 · 「한 해 흐름」 탭 · 군집 지도 읽는 법 · 「같이 움직인 정도」 탭 · 모델 비교 요약 · 「왜 이런 결과인가」 · 「그림으로 보기」 범례
# 출처 줄(D54 · README <표 4>): 계절성의 코스피 · 코스닥은 한국은행 ECOS 가격지수 · 군집 · 모델 비교는 수집 DB 의 수정주가(금융위원회 주식시세정보)
# 모델 비교는 한 번 계산하면 저장돼 바로 뜬다 — 처음이면 수십 초가 걸려 wait 에 cut: true
# 자막의 숫자(4월 · 0개 · 48% · 100% · 30%)는 이달 · 이번 계산 기준 — 다시 찍기 전에 화면과 맞는지 본다
file: 발표-F05-계절성-군집-모델비교
title: 시장 속설과 모델을 데이터로 따져 봅니다
owner: 이동원
start: quant-seasonal
steps:
  # ── 1 / 3 · 목적 — 계절성 분석 ──
  - chapter: {label: "1 / 3 · 목적", title: "그 효과, 정말 있나요", text: "달 · 요일 효과를 해마다 일관성과 함께 검정하고, 우연과 가르기 어려우면 그렇다고 보입니다", sec: 4.0}
  - wait: {target: "#se-bar", timeout: 90, cut: true}
  - say: "계절성 분석 — 코스피가 달 · 요일 · 연말에 어떻게 움직였는지 지난 기록으로 봅니다"
  - pause: 4.5
  - ring: {target: ".view.active .se-kpi", sec: 2.0}
  - say: "평균만 보면 4월이 가장 높지만, 다른 달과 뚜렷이 다른 달은 0개입니다"
  - pause: 5.0
  - ring: {target: "#se-bar", sec: 2.0}
  - say: "막대는 그달의 평균 수익률, 선은 그달에 오른 해의 비율 — 평균이 높아도 내린 해가 많을 수 있습니다"
  - pause: 5.5
  - scroll: {target: ".view.active .se-tabs", block: "start"}
  - say: "해마다 표 — 한 해가 한 줄, 칸마다 그달 수익률 · 빨강은 오름, 파랑은 내림"
  - pause: 5.0
  # 표 아래 세 줄(평균 · 오른 해 · 판정)은 표 칸 바닥에 붙어 있어, 바깥 칸을 더 내려야 자막 위로 올라온다
  # 그 줄에 ring 을 걸면 녹화기가 줄을 다시 굴려 자막 밑으로 돌아간다 — 내용 칸(#main-content)을 직접 굴린다
  - js: "document.getElementById('main-content').scrollBy({top: 170, behavior: 'smooth'})"
  - pause: 0.8
  - say: "맨 아래 판정 줄 — 평균이 높아 보여도 우연과 가르기 어려우면 「뚜렷하지 않음」 입니다"
  - pause: 5.5
  - click: 'button[data-tab="curve"]'
  - pause: 1.5
  - say: "한 해 흐름 — 옅은 선은 지난 해마다, 진한 선은 평균, 빨간 선은 올해입니다"
  - pause: 5.0
  # ── 2 / 3 · 과정 — 종목 군집화 → 모델 비교 ──
  - chapter: {label: "2 / 3 · 과정", title: "비슷한 종목끼리 묶고, 모델은 기준선과 견줍니다", text: "시장 전체 움직임을 뺀 뒤 묶고, 모델은 시간 순서대로만 평가합니다", sec: 3.5}
  - go: ml-cluster
  - wait: {target: "#cu-map", timeout: 120, cut: true}
  - say: "종목 군집화 — 지난 기간에 서로 비슷하게 움직인 종목끼리 묶습니다"
  - pause: 4.5
  - ring: {target: "#cu-map", sec: 2.0}
  - say: "종목 지도 — 점 사이가 가까울수록 비슷하게 움직였고, 색은 묶음입니다"
  - pause: 4.5
  - click: 'button[data-tab="matrix"]'
  - pause: 1.0
  - js: "document.getElementById('main-content').scrollBy({top: 240, behavior: 'smooth'})"
  - pause: 0.8
  - say: "같이 움직인 정도 — 진할수록 날마다의 수익률이 같이 오르내렸고, 같은 묶음이 대각선 둘레에 모입니다"
  - pause: 5.5
  - go: ml-compare
  - click: 'button[data-act="run"]'
  - wait: {target: 'button[data-tab="plot"]', timeout: 420, cut: true}
  - pause: 1.0
  - say: "모델 비교 — 모델 여덟이 5거래일 뒤 오름 · 관망 · 내림을 얼마나 맞히는지, 기준선 넷과 견줍니다"
  - pause: 5.5
  - ring: {target: ".view.active .mv-kpi", sec: 2.0}
  - say: "이번 결과 — 기준선 셋 모두보다 뚜렷이 나은 모델이 없습니다 · 그대로 「0 / 8」 로 보입니다"
  - pause: 5.0
  - say: "자료: 한국은행 ECOS(지수) · 금융위원회 주식시세정보(공공데이터포털 · 공공누리 제4유형) · 수익률 · 지표는 Qurious 가 계산"
  - pause: 4.0
  # ── 3 / 3 · 결과 — 왜 이런 결과인가 · 그림으로 보기 ──
  - chapter: {label: "3 / 3 · 결과", title: "모르면 모른다고 보입니다", text: "관측이 적거나 기준선과 가르지 못하면 판정하지 않습니다", sec: 3.5}
  - ring: {target: ".view.active .mv-why", sec: 2.0}
  - say: "왜 이런 결과인가 — 늘 같은 답만 말해도 정확도는 48% · 그래서 오름 · 관망 · 내림을 고루 본 균형 정확도로 견줍니다"
  - pause: 6.0
  - say: "학습한 날을 100% 맞혀도 처음 보는 날은 30% — 외운 것과 배운 것은 다릅니다"
  - pause: 5.0
  - scroll: {target: ".view.active .mv-plotwrap", block: "start"}
  - say: "그림으로 보기 — 점은 겹 하나의 점수, 마름모는 합친 점수, 옅은 띠는 찍기가 낸 범위입니다"
  - pause: 5.5
  - say: "과거 자료로 계산한 분석이며 미래 수익을 보장하지 않습니다"
  - pause: 4.0

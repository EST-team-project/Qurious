# 발표 판 — 한 종목의 공시 · 기사 · 일정 · 재무 건전성을 한 길로 본다 (자세한 판 · 2 ~ 3분 · 2026-10-18)
# 화면: 로보 어드바이저 › 투자 정보 리서치 (agent-news) · 투자분석 기초 › 일정 (market-calendar) · 로보 어드바이저 › 재무 · 신용 위험 (agent-cb) · 주담당 이동원
# 계정: 일반(기본 계정)
# 늘린 것: 종류별 건수 · 시간표 보기 · 종류 켜고 끄기 · 그날 목록 · 일정 설명 창 · 점검 일곱(그렇다 · 아니다 · 자료 없음) · 지표 뜻 문장 · 흐름 그림 · Altman 점수의 한계 · 시장 신용 탭
# 화면 차례를 바탕(사용법 판)과 바꿨다: 리서치 → 일정 → 재무 · 신용(결과 장에서 숫자 읽는 법을 보이려고)
# 세 화면 사이에 종목이 저절로 이어지지 않는다 — 화면마다 종목을 다시 고른다(이음은 3차 종목 허브)
# 일정은 날짜를 박지 않는다 — 달마다 있는 「파생 만기」 칸을 눌러, 다른 달에 찍어도 같은 걸음이 돈다
file: 발표-F04-한종목-근거-모으기
title: 한 종목의 공시 · 일정 · 재무를 한 길로 봅니다
owner: 이동원
start: agent-news
steps:
  # ── 1 / 3 · 목적 — 투자 정보 리서치 ──
  - chapter: {label: "1 / 3 · 목적", title: "근거를 한 종목으로 모읍니다", text: "공시 · 정책뉴스 · 언론사 기사 제목을 종목 하나로 엮어 날짜순으로 봅니다", sec: 4.0}
  - say: "투자 정보 리서치 — 전자공시 · 정책뉴스 · 언론사 기사 제목을 한곳에서 찾습니다"
  - pause: 4.5
  - ring: {target: ".view.active .rs-kinds", sec: 2.0}
  - say: "종류마다 몇 건인지 먼저 보이고, 낱말 · 주제 · 기간으로 좁혀 갑니다"
  - pause: 4.0
  - fill: {target: ".rs-sym-q", text: "삼성전자", delay: 90}
  - wait: {target: '.rs-suggest li[data-code="005930"]', timeout: 15}
  - click: '.rs-suggest li[data-code="005930"]'
  - pause: 2.0
  - say: "종목을 고르면 그 종목의 공시 · 기사 · 일정이 날짜 한 줄로 모입니다 — 「시간표」 보기"
  - pause: 5.0
  - click: 'button[data-tlkind="news"]'
  - pause: 1.5
  - say: "기사를 끄면 공시와 일정만 남습니다 — 종류는 켜고 끌 수 있습니다"
  - pause: 4.5
  # ── 2 / 3 · 과정 — 일정 → 재무 · 신용 위험 ──
  - chapter: {label: "2 / 3 · 과정", title: "일정과 재무를 덧붙입니다", text: "배당 · 주주총회 · 금리 회의 일정과, 공시된 재무제표로 계산한 건전성 지표", sec: 3.5}
  - go: market-calendar
  - click: ".cal-today-btn"
  - pause: 1.0
  - say: "일정 — 휴장 · 파생 만기 · 금통위 · FOMC · 배당 · 주주총회 · 실적 발표를 달력 하나에"
  - pause: 4.5
  - ring: {target: ".view.active .cal-cells", sec: 2.0}
  - say: "시장 전체 일정은 이름까지, 종목 일정은 종류별 건수로 칸에 들어 있습니다"
  - pause: 4.5
  - click: '.view.active .cal-cell:has(button[data-ev^="deriv_expiry"]) button.cal-num'
  - wait: {target: "#cal-day-title", timeout: 15}
  - scroll: {target: "#cal-day-title", block: "start"}
  - say: "날짜를 누르면 그날 목록 — 종목 이름으로 찾고, 종류별로 거릅니다"
  - pause: 4.5
  - click: '.view.active .cal-day-row[data-ev^="deriv_expiry"]'
  - wait: {target: "#cal-modal-title", timeout: 15}
  - say: "이름이 있는 일정을 누르면 설명 창 — 날짜와 「어떻게 정했나」 까지 밝힙니다"
  - pause: 4.5
  - key: Escape
  - go: agent-cb
  - click: '.rc-examples .rc-chip[data-code="005930"]'
  - wait: {target: ".view.active .rc-tiles", timeout: 30}
  - say: "재무 · 신용 위험 — 회사 이름 옆에 기준 보고서와 공시 원문 링크를 함께 밝힙니다"
  - pause: 5.0
  # ── 3 / 3 · 결과 — 숫자 읽는 법 ──
  - chapter: {label: "3 / 3 · 결과", title: "숫자는 뜻과 함께 읽습니다", text: "점검마다 근거 숫자를 붙이고, 모르는 값은 「자료 없음」 으로 둡니다 — 판단은 사용자가 합니다", sec: 4.0}
  - ring: {target: ".view.active .rc-summary", sec: 2.0}
  - say: "점검 일곱 — 그렇다 · 아니다 · 자료 없음으로 나눕니다 · 자료가 없으면 값을 지어내지 않습니다"
  - pause: 5.0
  - ring: {target: ".view.active .rc-tile", sec: 2.0}
  - say: "지표마다 뜻을 한 문장으로 — 유동비율은 1년 안에 돈이 되는 자산이 1년 안에 갚을 빚의 몇 배인지"
  - pause: 5.5
  - ring: {target: ".view.active .rc-checks", sec: 2.0}
  - say: "점검 줄마다 근거 숫자를 붙입니다 — 예를 들어 유동자산 ≥ 유동부채"
  - pause: 4.5
  # 점수 줄이 아니라 한계 문장 줄을 강조한다 — 점수 줄만 띄우면 그 문장이 화면 아래로 빠진다
  - ring: {target: '.view.active .rc-points li:has-text("앞날을 맞히는")', sec: 2.0}
  - say: "부실 위험 모형 점수에는 구간과 함께 — 이 회사의 앞날을 맞히는 값이 아니라는 단서를 붙입니다"
  - pause: 5.5
  - click: 'button[data-tab="macro"]'
  - pause: 1.5
  - say: "시장 신용 — 회사채와 국고채의 금리 차이로 시장 전체의 신용 분위기를 봅니다"
  - pause: 4.5
  - say: "지난 10년 하루값 가운데 아래에서 몇 % 인지로 읽고, 그림의 점선은 10년 가운데 값입니다"
  - pause: 5.0
  - say: "공시 · 재무 원문과 공식 금리로 계산한 정보 제공이며 투자 권유가 아닙니다"
  - pause: 4.0

<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="720" viewBox="0 0 1920 720" role="img" aria-labelledby="title desc">
  <title id="title">재다 → 판단하다 → 설명하다</title>
  <desc id="desc">수집 DB 의 수정주가 일봉 · 60분봉에서 시작한다. ① 재다 — 지표 정의 한 벌(RSI · ATR · 볼린저 = TradingView 정의) · TradingView 화면 값 5일 대조 차 0.00. ② 판단하다 — 차트 패턴 11종(전 종목 3,098개 · 5거래일 뒤 통계 · 그 종목 평균과 0.4%p 안)과 다중 주기 신호(60분 · 일 · 주 점수 합 → 매수 · 매도 · 관망 · 매일 12:30 401종목 기록). ③ 설명하다 — 쉬운 말 설명과 근거 막대(규칙마다 기여도 · 합 = 종합 점수)와 모델 설명(LightGBM 판단 · SHAP 막대 · 확률의 뜻을 한 줄로). 보이는 곳 — 차트 패턴 · 지지/저항 · 멀티타임프레임 화면 · 종목 스크리닝 「설명」 창 · 성과 검증 규칙 설명.</desc>
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#92400e" flood-opacity=".10"/>
    </filter>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#d97706"/>
    </marker>
    <style>
      text{font-family:'Pretendard Variable','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#0f172a}
      .verb{font-size:36px;font-weight:800;fill:#92400e}
      .sub{font-size:21px;fill:#78716c}
      .h2{font-size:29px;font-weight:800}
      .body{font-size:21px;fill:#475569}
      .small{font-size:19px;fill:#64748b}
      .pill{font-size:19px;font-weight:700}
      .num{font-size:28px;font-weight:800;fill:#ffffff}
      .card{fill:#ffffff;stroke:#f3d9a4;stroke-width:2;filter:url(#sh)}
      .inner{fill:#fffbeb;stroke:#fde68a;stroke-width:1.5}
      .flow{fill:none;stroke:#d97706;stroke-width:4;marker-end:url(#ar)}
    </style>
  </defs>

  <rect data-bg="1" width="1920" height="720" fill="#fffdf8"/>

  <!-- 들어오는 자료 -->
  <rect x="36" y="238" width="214" height="128" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="58" y="284" class="h2" style="font-size:26px">수집 DB</text>
  <text x="58" y="318" class="body">수정주가 일봉</text>
  <text x="58" y="346" class="body">· 60분봉</text>
  <path class="flow" d="M252 302H292"/>

  <!-- ① 재다 -->
  <circle cx="336" cy="70" r="28" fill="#d97706"/>
  <text x="336" y="80" text-anchor="middle" class="num">1</text>
  <text x="378" y="82" class="verb">재다</text>
  <text x="466" y="80" class="sub">지표를 한 정의로</text>
  <rect x="300" y="116" width="452" height="440" rx="26" class="card"/>
  <text x="326" y="166" class="h2">지표 정의 한 벌</text>
  <rect x="326" y="186" width="80" height="40" rx="20" fill="#fde68a"/>
  <text x="366" y="213" text-anchor="middle" class="pill" style="fill:#92400e">RSI</text>
  <rect x="414" y="186" width="80" height="40" rx="20" fill="#fde68a"/>
  <text x="454" y="213" text-anchor="middle" class="pill" style="fill:#92400e">ATR</text>
  <rect x="502" y="186" width="100" height="40" rx="20" fill="#fde68a"/>
  <text x="552" y="213" text-anchor="middle" class="pill" style="fill:#92400e">볼린저</text>
  <text x="326" y="262" class="body">= TradingView 정의(Wilder 평활)</text>
  <!-- 작은 RSI 선 -->
  <rect x="326" y="284" width="400" height="160" rx="14" class="inner"/>
  <line x1="342" y1="324" x2="710" y2="324" stroke="#e7c27a" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="342" y1="404" x2="710" y2="404" stroke="#e7c27a" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="704" y="318" text-anchor="end" class="small" style="font-size:16px">70</text>
  <text x="704" y="398" text-anchor="end" class="small" style="font-size:16px">30</text>
  <polyline points="344,370 380,352 412,388 446,412 478,396 512,360 546,336 578,348 612,384 646,402 680,378 708,356" fill="none" stroke="#b45309" stroke-width="4" stroke-linejoin="round"/>
  <rect x="326" y="470" width="400" height="56" rx="28" fill="#ecfdf5" stroke="#86efac" stroke-width="1.5"/>
  <text x="526" y="505" text-anchor="middle" class="pill" style="fill:#0f766e">TradingView 대조 5일 · 차 0.00</text>

  <path class="flow" d="M758 336H792"/>

  <!-- ② 판단하다 -->
  <circle cx="836" cy="70" r="28" fill="#d97706"/>
  <text x="836" y="80" text-anchor="middle" class="num">2</text>
  <text x="878" y="82" class="verb">판단하다</text>
  <text x="1026" y="80" class="sub">신호와 패턴을 숫자로</text>
  <rect x="800" y="116" width="560" height="440" rx="26" class="card"/>
  <rect x="822" y="136" width="516" height="196" rx="18" class="inner"/>
  <text x="844" y="180" class="h2">차트 패턴 11종</text>
  <text x="844" y="216" class="body">전 종목 3,098개</text>
  <text x="844" y="246" class="body">5거래일 뒤 통계</text>
  <rect x="844" y="268" width="270" height="44" rx="22" fill="#fde68a"/>
  <text x="979" y="297" text-anchor="middle" class="pill" style="fill:#92400e">종목 평균과 0.4%p 안</text>
  <!-- 작은 캔들 -->
  <g stroke-width="3">
    <line x1="1158" y1="182" x2="1158" y2="262" stroke="#16a34a"/><rect x="1148" y="200" width="20" height="44" fill="#16a34a"/>
    <line x1="1196" y1="166" x2="1196" y2="246" stroke="#dc2626"/><rect x="1186" y="178" width="20" height="50" fill="#dc2626"/>
    <line x1="1234" y1="196" x2="1234" y2="286" stroke="#dc2626"/><rect x="1224" y="214" width="20" height="54" fill="#dc2626"/>
    <line x1="1272" y1="214" x2="1272" y2="300" stroke="#16a34a"/><rect x="1262" y="236" width="20" height="40" fill="#16a34a"/>
    <line x1="1310" y1="188" x2="1310" y2="276" stroke="#16a34a"/><rect x="1300" y="204" width="20" height="50" fill="#16a34a"/>
  </g>
  <rect x="822" y="344" width="516" height="194" rx="18" class="inner"/>
  <text x="844" y="388" class="h2">다중 주기 신호</text>
  <text x="844" y="424" class="body">60분 · 일 · 주 점수 합</text>
  <text x="844" y="454" class="body">→ 매수 · 매도 · 관망</text>
  <rect x="844" y="474" width="250" height="44" rx="22" fill="#fde68a"/>
  <text x="969" y="503" text-anchor="middle" class="pill" style="fill:#92400e">매일 12:30 · 401종목</text>
  <!-- 작은 주기 막대 -->
  <text x="1150" y="396" class="small" style="font-size:17px">60분</text>
  <rect x="1200" y="380" width="50" height="22" rx="4" fill="#16a34a"/>
  <text x="1150" y="440" class="small" style="font-size:17px">일</text>
  <rect x="1200" y="424" width="110" height="22" rx="4" fill="#dc2626"/>
  <text x="1150" y="484" class="small" style="font-size:17px">주</text>
  <rect x="1200" y="468" width="80" height="22" rx="4" fill="#dc2626"/>

  <path class="flow" d="M1366 336H1400"/>

  <!-- ③ 설명하다 -->
  <circle cx="1444" cy="70" r="28" fill="#d97706"/>
  <text x="1444" y="80" text-anchor="middle" class="num">3</text>
  <text x="1486" y="82" class="verb">설명하다</text>
  <text x="1634" y="80" class="sub">왜 그렇게 나왔나</text>
  <rect x="1408" y="116" width="476" height="440" rx="26" class="card"/>
  <rect x="1430" y="136" width="432" height="196" rx="18" class="inner"/>
  <text x="1452" y="180" class="h2">쉬운 말 · 근거 막대</text>
  <text x="1452" y="216" class="body">규칙마다 기여도</text>
  <text x="1452" y="246" class="body">합 = 종합 점수</text>
  <!-- 작은 근거 막대(가운데 축) -->
  <line x1="1786" y1="164" x2="1786" y2="262" stroke="#94a3b8" stroke-width="2"/>
  <rect x="1786" y="170" width="66" height="18" rx="3" fill="#16a34a"/>
  <rect x="1746" y="194" width="40" height="18" rx="3" fill="#dc2626"/>
  <rect x="1786" y="218" width="40" height="18" rx="3" fill="#16a34a"/>
  <rect x="1754" y="242" width="32" height="18" rx="3" fill="#dc2626"/>
  <rect x="1452" y="268" width="230" height="44" rx="22" fill="#fde68a"/>
  <text x="1567" y="297" text-anchor="middle" class="pill" style="fill:#92400e">±1 넘으면 매수 · 매도</text>
  <rect x="1430" y="344" width="432" height="194" rx="18" class="inner"/>
  <text x="1452" y="388" class="h2">모델 설명(XAI)</text>
  <text x="1452" y="424" class="body">LightGBM 판단</text>
  <text x="1452" y="454" class="body">· SHAP 막대</text>
  <rect x="1452" y="474" width="230" height="44" rx="22" fill="#ede9fe"/>
  <text x="1567" y="503" text-anchor="middle" class="pill" style="fill:#6d28d9">확률의 뜻을 한 줄로</text>
  <!-- 작은 SHAP 막대 -->
  <rect x="1700" y="380" width="140" height="16" rx="3" fill="#16a34a"/>
  <rect x="1700" y="404" width="100" height="16" rx="3" fill="#16a34a"/>
  <rect x="1700" y="428" width="56" height="16" rx="3" fill="#16a34a"/>
  <rect x="1700" y="452" width="30" height="16" rx="3" fill="#dc2626"/>

  <!-- 보이는 곳 -->
  <path class="flow" d="M1080 560V598"/>
  <path class="flow" d="M1646 560V598"/>
  <rect x="300" y="604" width="1584" height="84" rx="24" fill="#fff7ed" stroke="#f3d9a4" stroke-width="2"/>
  <text x="330" y="656" class="h2" style="font-size:24px;fill:#92400e">보이는 곳</text>
  <rect x="470" y="622" width="470" height="48" rx="24" fill="#ffffff" stroke="#e7c27a" stroke-width="1.5"/>
  <text x="705" y="654" text-anchor="middle" class="pill">차트 패턴 · 지지/저항 · 멀티타임프레임</text>
  <rect x="960" y="622" width="380" height="48" rx="24" fill="#ffffff" stroke="#e7c27a" stroke-width="1.5"/>
  <text x="1150" y="654" text-anchor="middle" class="pill">종목 스크리닝 「설명」 창</text>
  <rect x="1360" y="622" width="330" height="48" rx="24" fill="#ffffff" stroke="#e7c27a" stroke-width="1.5"/>
  <text x="1525" y="654" text-anchor="middle" class="pill">성과 검증 규칙 설명</text>
</svg>

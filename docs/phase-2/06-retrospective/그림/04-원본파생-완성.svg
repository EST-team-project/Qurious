<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="764" viewBox="0 96 1920 764" role="img" aria-labelledby="title desc">
  <title id="title">받은 원본은 그대로, 계산한 표는 매일 다시</title>
  <desc id="desc">원본(일별 시세 — 포털이 준 값, 배당 공시, ETF · 지수 시세, 분봉 — 원문이 따로 없어 지우면 되찾을 수 없음)은 지우지 않는다. 파생 표는 매일 원본에서 다시 계산한다 — 조정 이벤트 2,710건(분할 · 병합 1,411 · 권리락 1,048 · 사람이 볼 것 249 · 주식 수로 조정 2) → 수정주가(가장 최근 날 = 1.0 · 분할을 폭락으로 읽지 않게) → 총수익 지수(배당까지 재투자 · 첫날 = 1.0) · 벤치마크 지수. 운영 기록은 받은 날 상태(완료 · 빈 날 · 휴장 · 오류) · 회차 기록 · 숫자 파일(화면 「자료 안내」 가 읽음)이다. 예: 제일바이오 감자 뒤 거래 재개일 2026-02-09 — 포털 등락률 +29,948% 와 이어 본 수익률 −79.97%. 세 가격 표의 행 수는 4,506,634 로 같고(마지막 거래일 2026-10-15) 수정주가와 총수익은 누적 방향이 반대라 섞어 계산하지 않는다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/><stop offset="0.55" stop-color="#0b1728"/><stop offset="1" stop-color="#101a2d"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172e52"/><stop offset="1" stop-color="#10233f"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#302557"/><stop offset="1" stop-color="#1d2140"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#143c3e"/><stop offset="1" stop-color="#102b32"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#44351f"/><stop offset="1" stop-color="#2a281f"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173a4a"/><stop offset="1" stop-color="#112834"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000814" flood-opacity=".45"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7fa7d8"/>
    </marker>
    <marker id="arrowS" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7fa7d8"/>
    </marker>
    <style>
      text{font-family:'Pretendard Variable','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#f5f8ff}
      .title{font-size:38px;font-weight:800;letter-spacing:-1px}
      .subtitle{font-size:22px;fill:#aebcd1}
      .zone{font-size:24px;font-weight:800;letter-spacing:1px}
      .h1{font-size:34px;font-weight:800}
      .h2{font-size:30px;font-weight:800}
      .body{font-size:24px;fill:#c7d3e5}
      .small{font-size:20px;fill:#aebcd1}
      .pill{font-size:20px;font-weight:700}
      .step{font-size:24px;font-weight:700;fill:#eef4ff}
      .big{font-size:42px;font-weight:800;letter-spacing:-1px}
      .card{stroke-width:2;filter:url(#shadow)}
      .chip{fill:#0a1525;fill-opacity:.6;stroke-width:1.5}
      .line{fill:none;stroke:#7fa7d8;stroke-width:4;marker-end:url(#arrow)}
      .lineS{fill:none;stroke:#7fa7d8;stroke-width:4;marker-end:url(#arrowS)}
      .dash{fill:none;stroke:#6984a6;stroke-width:3;stroke-dasharray:10 10;marker-end:url(#arrow)}
      .bus{fill:none;stroke:#6984a6;stroke-width:3;stroke-dasharray:10 10}
      .dashS{fill:none;stroke:#7fa7d8;stroke-width:3;stroke-dasharray:8 8;marker-end:url(#arrowS)}
    </style>
  </defs>

  <rect data-bg="1" width="1920" height="860" fill="url(#bg)"/>
  <circle cx="1500" cy="170" r="320" fill="#1e3a60" opacity=".12"/>
  <circle cx="460" cy="760" r="360" fill="#194c47" opacity=".09"/>

  <text data-free="1" x="50" y="52" class="title">받은 원본은 그대로, 계산한 표는 매일 다시</text>
  <text data-free="1" x="52" y="88" class="subtitle">원본은 지우지 않는다 · 파생 표는 매일 원본에서 다시 계산한다 · 받은 날 상태와 회차 기록은 운영 기록으로 따로 둔다</text>

  <!-- 원본 -->
  <rect x="50" y="112" width="420" height="528" rx="26" fill="url(#amber)" stroke="#c2953b" class="card"/>
  <text x="74" y="158" class="h2">원본</text>
  <rect x="150" y="130" width="132" height="40" rx="20" fill="#b8892c"/>
  <text x="216" y="158" text-anchor="middle" class="pill">지우지 않음</text>
  <rect x="74" y="186" width="372" height="88" rx="14" stroke="#c2953b" class="chip"/>
  <text x="96" y="222" class="step">일별 시세</text>
  <text x="96" y="256" class="small">포털이 준 값</text>
  <rect x="74" y="300" width="372" height="60" rx="14" stroke="#c2953b" class="chip"/>
  <text x="96" y="339" class="step">배당 공시</text>
  <rect x="74" y="386" width="372" height="60" rx="14" stroke="#c2953b" class="chip"/>
  <text x="96" y="425" class="step">ETF · 지수 시세</text>
  <rect x="74" y="472" width="372" height="124" rx="14" stroke="#f59e0b" stroke-width="2" class="chip"/>
  <text x="96" y="510" class="step">분봉</text>
  <text x="96" y="544" class="small" style="fill:#fcd38d">원문이 따로 없어</text>
  <text x="96" y="574" class="small" style="fill:#fcd38d">지우면 되찾을 수 없음</text>

  <!-- 파생 -->
  <rect x="520" y="112" width="870" height="528" rx="26" fill="url(#violet)" stroke="#8b78db" class="card"/>
  <text x="544" y="158" class="h2">파생</text>
  <rect x="620" y="130" width="250" height="40" rx="20" fill="#6d5ae0"/>
  <text x="745" y="158" text-anchor="middle" class="pill">매일 원본에서 다시 계산</text>

  <!-- 원본 → 파생 -->
  <path class="line" d="M448 230H540"/>
  <path class="line" d="M448 330H540"/>
  <rect x="544" y="186" width="822" height="176" rx="18" fill="url(#blue)" stroke="#4d82cc" stroke-width="2"/>
  <text x="568" y="228" class="h2">조정 이벤트 <tspan style="fill:#fde68a">2,710건</tspan></text>
  <rect x="568" y="240" width="402" height="40" fill="#8b78db"/>
  <rect x="970" y="240" width="299" height="40" fill="#38bdf8"/>
  <rect x="1269" y="240" width="71" height="40" fill="#fbbf24"/>
  <rect x="1340" y="240" width="2" height="40" fill="#f87171"/>
  <text x="769" y="269" text-anchor="middle" class="pill" style="fill:#0b1220">1,411</text>
  <text x="1119" y="269" text-anchor="middle" class="pill" style="fill:#0b1220">1,048</text>
  <rect x="568" y="294" width="16" height="16" rx="3" fill="#8b78db"/>
  <text x="592" y="310" class="small" style="fill:#e6ecf8">분할 · 병합 1,411</text>
  <rect x="968" y="294" width="16" height="16" rx="3" fill="#38bdf8"/>
  <text x="992" y="310" class="small" style="fill:#e6ecf8">권리락 1,048</text>
  <rect x="568" y="326" width="16" height="16" rx="3" fill="#fbbf24"/>
  <text x="592" y="342" class="small" style="fill:#e6ecf8">사람이 볼 것 249</text>
  <rect x="968" y="326" width="16" height="16" rx="3" fill="#f87171"/>
  <text x="992" y="342" class="small" style="fill:#e6ecf8">주식 수로 조정 2</text>

  <path class="lineS" d="M955 364V394"/>
  <rect x="544" y="398" width="822" height="86" rx="18" fill="url(#blue)" stroke="#4d82cc" stroke-width="2"/>
  <text x="568" y="452" class="h2">수정주가</text>
  <text x="716" y="451" class="body">가장 최근 날 = 1.0 · 분할을 폭락으로 읽지 않게</text>

  <path class="lineS" d="M747 486V516"/>
  <path class="lineS" d="M1163 486V516"/>
  <rect x="544" y="520" width="406" height="96" rx="18" fill="url(#teal)" stroke="#38bdf8" stroke-width="2"/>
  <text x="568" y="560" class="h2">총수익 지수</text>
  <text x="568" y="596" class="body">배당까지 재투자 · 첫날 = 1.0</text>
  <rect x="960" y="520" width="406" height="96" rx="18" fill="url(#teal)" stroke="#38bdf8" stroke-width="2"/>
  <text x="984" y="579" class="h2">벤치마크 지수</text>

  <!-- 운영 기록 -->
  <rect x="1430" y="112" width="440" height="528" rx="26" fill="#0d1a2c" stroke="#3a5577" stroke-width="2"/>
  <text x="1454" y="158" class="h2">운영 기록</text>
  <rect x="1454" y="186" width="392" height="130" rx="14" stroke="#5480bd" class="chip"/>
  <text x="1476" y="224" class="step">받은 날 상태</text>
  <rect x="1476" y="244" width="78" height="46" rx="23" fill="#047857" opacity=".7"/>
  <text x="1515" y="276" text-anchor="middle" class="step">완료</text>
  <rect x="1564" y="244" width="86" height="46" rx="23" fill="#334155" opacity=".9"/>
  <text x="1607" y="276" text-anchor="middle" class="step">빈 날</text>
  <rect x="1660" y="244" width="78" height="46" rx="23" fill="#1d4ed8" opacity=".55"/>
  <text x="1699" y="276" text-anchor="middle" class="step">휴장</text>
  <rect x="1748" y="244" width="78" height="46" rx="23" fill="#b91c1c" opacity=".6"/>
  <text x="1787" y="276" text-anchor="middle" class="step">오류</text>
  <rect x="1454" y="332" width="392" height="60" rx="14" stroke="#5480bd" class="chip"/>
  <text x="1476" y="371" class="step">회차 기록</text>
  <rect x="1454" y="408" width="392" height="60" rx="14" stroke="#5480bd" class="chip"/>
  <text x="1476" y="447" class="step">숫자 파일</text>
  <path class="dashS" d="M1650 538V476"/>
  <text data-free="1" x="1666" y="514" class="small" style="font-weight:800">읽음</text>
  <rect x="1454" y="542" width="392" height="74" rx="18" fill="url(#blue)" stroke="#4d82cc" stroke-width="2"/>
  <rect x="1478" y="562" width="40" height="28" rx="4" fill="none" stroke="#93c5fd" stroke-width="3"/>
  <path d="M1490 598H1506M1498 590V598" fill="none" stroke="#93c5fd" stroke-width="3" stroke-linecap="round"/>
  <text x="1534" y="588" class="step">화면 「자료 안내」</text>

  <!-- 아래 왼쪽: 실제 예 -->
  <rect x="50" y="656" width="1100" height="190" rx="24" fill="url(#amber)" stroke="#f59e0b" stroke-width="3" class="card"/>
  <rect x="78" y="674" width="104" height="40" rx="20" fill="#b45309"/>
  <text x="130" y="702" text-anchor="middle" class="pill">실제 예</text>
  <text x="202" y="706" class="h2">제일바이오 · 감자 뒤 거래 재개일 2026-02-09</text>
  <rect x="78" y="728" width="470" height="104" rx="16" fill="#0a1525" fill-opacity=".55" stroke="#e0607e" stroke-width="1.5"/>
  <text x="102" y="756" class="small">포털 등락률</text>
  <text x="102" y="814" class="big" style="fill:#fda4af">+29,948%</text>
  <text data-free="1" x="599" y="792" text-anchor="middle" class="h1" style="fill:#fde68a">↔</text>
  <rect x="650" y="728" width="470" height="104" rx="16" fill="#0a1525" fill-opacity=".55" stroke="#2fa38a" stroke-width="1.5"/>
  <text x="674" y="756" class="small">이어 본 수익률</text>
  <text x="674" y="814" class="big" style="fill:#6ee7b7">−79.97%</text>

  <!-- 아래 오른쪽: 작은 글 -->
  <rect x="1180" y="656" width="690" height="190" rx="24" fill="url(#teal)" stroke="#38bdf8" class="card"/>
  <text x="1206" y="696" class="small" style="font-weight:800;fill:#e0f2fe">세 가격 표의 행 수 4,506,634 로 같음(마지막 거래일 2026-10-15)</text>
  <text x="1206" y="732" class="small">일별 시세</text>
  <rect x="1336" y="718" width="300" height="16" rx="5" fill="#38bdf8" opacity=".8"/>
  <text x="1648" y="732" class="small" style="fill:#e0f2fe">4,506,634</text>
  <text x="1206" y="762" class="small">수정주가</text>
  <rect x="1336" y="748" width="300" height="16" rx="5" fill="#38bdf8" opacity=".8"/>
  <text x="1648" y="762" class="small" style="fill:#e0f2fe">4,506,634</text>
  <text x="1206" y="792" class="small">총수익 지수</text>
  <rect x="1336" y="778" width="300" height="16" rx="5" fill="#38bdf8" opacity=".8"/>
  <text x="1648" y="792" class="small" style="fill:#e0f2fe">4,506,634</text>
  <text x="1206" y="828" class="small">수정주가와 총수익은 누적 방향이 반대라 섞어 계산하지 않음</text>
</svg>

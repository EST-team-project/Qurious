<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Qurious — AI Financial Quant Platform</title>
  <desc id="desc">자기 투자 규칙을 믿어도 되는지 판단하도록 돕는 학습 · 검증 플랫폼. 아래 카드 셋은 규칙 세우기(투자 성향 진단 · 자산 배분), 검증(비용을 뺀 성과 · 모의투자), 근거(법령 원문 번호)의 차례다. 오른쪽 위 선 두 줄은 눈금 · 숫자가 없는 꾸밈이다.</desc>
  <defs>
    <!-- theme:start -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/><stop offset="0.55" stop-color="#0b1728"/><stop offset="1" stop-color="#101a2d"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172e52"/><stop offset="1" stop-color="#10233f"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#143c3e"/><stop offset="1" stop-color="#102b32"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#44351f"/><stop offset="1" stop-color="#2a281f"/>
    </linearGradient>
    <radialGradient id="glowBlue">
      <stop offset="0" stop-color="#2563eb" stop-opacity=".30"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowAmber">
      <stop offset="0" stop-color="#d97706" stop-opacity=".20"/><stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563eb" stop-opacity=".34"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000814" flood-opacity=".45"/>
    </filter>
    <style>
      text{font-family:'Pretendard Variable','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#f5f8ff}
      .name{font-size:72px;font-weight:800;letter-spacing:-1.5px}
      .tag{font-size:24px;font-weight:700;letter-spacing:3.5px;fill:#d97706}
      .lead{font-size:30px;font-weight:600;fill:#dfe7f3}
      .h{font-size:28px;font-weight:800}
      .sub{font-size:24px;font-weight:500;fill:#c7d3e5}
      .card{stroke-width:2;filter:url(#shadow)}
      .chev{fill:none;stroke:#6984a6;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .solid{fill:none;stroke:#2563eb;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .halo{fill:none;stroke:#2563eb;stroke-width:14;stroke-linecap:round;stroke-linejoin:round;opacity:.18}
      .dashed{fill:none;stroke:#d97706;stroke-width:4;stroke-linecap:round;stroke-dasharray:2 10}
      .dotRing{stroke:#0b1728}
    </style>
    <!-- theme:end -->
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- 바탕 — 가장자리까지 불투명 -->
  <rect width="1280" height="400" fill="url(#bg)"/>
  <circle cx="1060" cy="110" r="300" fill="url(#glowBlue)"/>
  <circle cx="110" cy="430" r="330" fill="url(#glowAmber)"/>

  <!-- 로고 칸(앱 머리의 로고와 같은 그라데이션) · 이름 · 부제 -->
  <rect x="64" y="46" width="88" height="88" rx="22" fill="url(#logo)"/>
  <path d="M86 116V104M104 116V94M122 116V100" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".85"/>
  <path d="M84 86L100 74L114 80L132 62" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="132" cy="62" r="4.5" fill="#fff"/>
  <text x="176" y="104" class="name">Qurious</text>
  <text x="178" y="136" class="tag">AI FINANCIAL QUANT PLATFORM</text>

  <!-- 한 문장 -->
  <text x="64" y="200" class="lead">자기 투자 규칙을 믿어도 되는지 판단하도록 돕는 학습 · 검증 플랫폼</text>

  <!-- 꾸밈 차트 선 — 눈금 · 숫자 없음 · 실선과 그 아래 점선 -->
  <path d="M884.0 150.0 C888.7 147.3 903.3 135.3 912.0 134.0 C920.7 132.7 927.7 145.7 936.0 142.0 C944.3 138.3 953.0 115.0 962.0 112.0 C971.0 109.0 981.0 118.3 990.0 124.0 C999.0 129.7 1007.0 145.7 1016.0 146.0 C1025.0 146.3 1034.7 133.0 1044.0 126.0 C1053.3 119.0 1062.7 105.3 1072.0 104.0 C1081.3 102.7 1090.7 119.0 1100.0 118.0 C1109.3 117.0 1118.7 99.0 1128.0 98.0 C1137.3 97.0 1146.3 114.0 1156.0 112.0 C1165.7 110.0 1176.0 88.7 1186.0 86.0 C1196.0 83.3 1211.0 94.3 1216.0 96.0 L1216 200 L884 200 Z" fill="url(#area)"/>
  <path class="dashed" d="M884.0 160.0 C888.7 157.7 903.3 146.7 912.0 146.0 C920.7 145.3 927.7 158.8 936.0 155.8 C944.3 152.7 953.0 130.0 962.0 127.6 C971.0 125.3 981.0 135.3 990.0 141.7 C999.0 148.0 1007.0 164.6 1016.0 165.5 C1025.0 166.5 1034.7 153.9 1044.0 147.6 C1053.3 141.2 1062.7 128.2 1072.0 127.6 C1081.3 126.9 1090.7 143.9 1100.0 143.6 C1109.3 143.3 1118.7 126.0 1128.0 125.6 C1137.3 125.3 1146.3 143.0 1156.0 141.7 C1165.7 140.4 1176.0 119.8 1186.0 117.8 C1196.0 115.9 1211.0 128.0 1216.0 130.0"/>
  <path class="halo" d="M884.0 150.0 C888.7 147.3 903.3 135.3 912.0 134.0 C920.7 132.7 927.7 145.7 936.0 142.0 C944.3 138.3 953.0 115.0 962.0 112.0 C971.0 109.0 981.0 118.3 990.0 124.0 C999.0 129.7 1007.0 145.7 1016.0 146.0 C1025.0 146.3 1034.7 133.0 1044.0 126.0 C1053.3 119.0 1062.7 105.3 1072.0 104.0 C1081.3 102.7 1090.7 119.0 1100.0 118.0 C1109.3 117.0 1118.7 99.0 1128.0 98.0 C1137.3 97.0 1146.3 114.0 1156.0 112.0 C1165.7 110.0 1176.0 88.7 1186.0 86.0 C1196.0 83.3 1211.0 94.3 1216.0 96.0"/>
  <path class="solid" d="M884.0 150.0 C888.7 147.3 903.3 135.3 912.0 134.0 C920.7 132.7 927.7 145.7 936.0 142.0 C944.3 138.3 953.0 115.0 962.0 112.0 C971.0 109.0 981.0 118.3 990.0 124.0 C999.0 129.7 1007.0 145.7 1016.0 146.0 C1025.0 146.3 1034.7 133.0 1044.0 126.0 C1053.3 119.0 1062.7 105.3 1072.0 104.0 C1081.3 102.7 1090.7 119.0 1100.0 118.0 C1109.3 117.0 1118.7 99.0 1128.0 98.0 C1137.3 97.0 1146.3 114.0 1156.0 112.0 C1165.7 110.0 1176.0 88.7 1186.0 86.0 C1196.0 83.3 1211.0 94.3 1216.0 96.0"/>
  <circle cx="1216" cy="96" r="8" fill="#2563eb" class="dotRing" stroke-width="3"/>
  <circle cx="1216" cy="130" r="6" fill="#d97706" class="dotRing" stroke-width="3"/>

  <!-- 세 단계 카드 -->
  <rect x="64" y="236" width="360" height="120" rx="22" fill="url(#blue)" stroke="#4d82cc" class="card"/>
  <rect x="460" y="236" width="360" height="120" rx="22" fill="url(#green)" stroke="#2fa38a" class="card"/>
  <rect x="856" y="236" width="360" height="120" rx="22" fill="url(#amber)" stroke="#c2953b" class="card"/>
  <path class="chev" d="M437 284L447 296L437 308"/>
  <path class="chev" d="M833 284L843 296L833 308"/>

  <!-- ① 규칙 세우기 — 도넛(자산 배분) -->
  <circle cx="114" cy="296" r="30" fill="#2563eb"/>
  <g fill="none" stroke="#fff" stroke-width="7" transform="rotate(-90 114 296)">
    <circle cx="114" cy="296" r="14" stroke-dasharray="40 47.96"/>
    <circle cx="114" cy="296" r="14" stroke-dasharray="26 61.96" stroke-dashoffset="-43" opacity=".7"/>
    <circle cx="114" cy="296" r="14" stroke-dasharray="13 74.96" stroke-dashoffset="-72" opacity=".45"/>
  </g>
  <text x="160" y="285" class="h">규칙 세우기</text>
  <text x="160" y="324" class="sub">투자 성향 진단 · 자산 배분</text>

  <!-- ② 검증 — 확인 표시 -->
  <circle cx="510" cy="296" r="30" fill="#059669"/>
  <path d="M497 297L506 306L524 287" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="556" y="285" class="h">검증</text>
  <text x="556" y="324" class="sub">비용을 뺀 성과 · 모의투자</text>

  <!-- ③ 근거 — 문서 -->
  <circle cx="906" cy="296" r="30" fill="#d97706"/>
  <path d="M895 280H911L920 289V312H895Z" fill="none" stroke="#fff" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M911 280V289H920M900 297H914M900 304H914" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="952" y="285" class="h">근거</text>
  <text x="952" y="324" class="sub">법령 원문 번호</text>
</svg>

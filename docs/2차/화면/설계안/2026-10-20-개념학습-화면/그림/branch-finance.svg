    <ellipse cx="184" cy="112" rx="26" ry="8" fill="#b45309"/>
    <rect x="158" y="100" width="52" height="12" fill="#b45309"/>
    <ellipse cx="184" cy="100" rx="26" ry="8" fill="#d97706"/>
    <ellipse cx="184" cy="96" rx="26" ry="8" fill="#b45309"/>
    <rect x="158" y="84" width="52" height="12" fill="#b45309"/>
    <ellipse cx="184" cy="84" rx="26" ry="8" fill="#d97706"/>
    <ellipse cx="184" cy="84" rx="15" ry="4" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2"/>

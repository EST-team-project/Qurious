    <path d="M0 0 L-28.28 28.28 A40 40 0 0 1 0 -40 Z" fill="#059669" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
    <circle r="16" fill="#ffffff"/>
  </g>
  <!-- 동전 셋 -->
  <g>
    <ellipse cx="184" cy="128" rx="26" ry="8" fill="#b45309"/>
    <rect x="158" y="116" width="52" height="12" fill="#b45309"/>

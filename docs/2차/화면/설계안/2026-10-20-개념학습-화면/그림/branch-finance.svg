<svg xmlns="http://www.w3.org/2000/svg" width="320" height="160" viewBox="0 0 320 160" role="img" aria-label="금융 필수 지식 — 자산을 나누는 원 그래프, 동전, 상품 설명서">
  <title>금융 필수 지식</title>
  <!-- 색은 앱 토큰 값만: --brand #d97706 · --brand-text #b45309 · --accent #2563eb · --green #059669 · --border2 #c5cdde · --surf3 #e8ecf3 -->
  <rect width="320" height="160" rx="16" fill="#ffffff"/>
  <rect width="320" height="160" rx="16" fill="#d97706" fill-opacity="0.10"/>
  <line x1="24" y1="140" x2="296" y2="140" stroke="#dde2ec" stroke-width="2" stroke-linecap="round"/>
  <!-- 원 그래프: 자산을 나눈다 -->
  <g transform="translate(86 82)">

  <text x="95" y="1350" class="body">브라우저는 DB 와 외부 인증 정보에 직접 닿지 않는다 · 키는 .env 에만 두고 Git 에 올리지 않는다 · 원자료는 비공개 저장소에만 둔다 · 실시간 시세는 사용자 자기 키 · 자기 화면까지만 쓴다</text>

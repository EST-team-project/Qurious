  <text x="2355" y="1082" class="h2">증권사 · 모의 API</text>
  <text x="2355" y="1120" class="small">KIS 모의 · Alpaca Paper</text>
  <text x="2355" y="1152" class="small">키는 사용자마다 따로 저장</text>
  <text x="2355" y="1184" class="small">실거래는 서버 한 곳에서 차단</text>

  <!-- 보안 · 운영 경계 -->
  <rect x="60" y="1255" width="2650" height="230" rx="28" fill="#0d1a2c" stroke="#3a5577" stroke-width="2"/>

  <text x="2355" y="940" class="small">qurious-quant 데이터셋 17</text>
  <text x="2355" y="972" class="small">매일 102 파일 · 지문 · 판</text>
  <text x="2355" y="1004" class="small">원자료는 여기에만 둔다</text>

  <rect x="1930" y="1040" width="380" height="160" rx="22" fill="url(#blue)" stroke="#5480bd" class="card"/>
  <text x="1955" y="1082" class="h2">시세 표시</text>
  <text x="1955" y="1120" class="small">Yahoo Finance 지연 시세</text>
  <text x="1955" y="1152" class="small">화면 표시만 · 저장하지 않음</text>
  <text x="1955" y="1184" class="small">미국 · 지수 · 거시 지표</text>
  <path class="line" d="M1928 1120H1894"/>


  <rect x="1960" y="255" width="720" height="245" rx="20" fill="#0c2230" stroke="#38bdf8" stroke-width="2"/>
  <rect x="1990" y="280" width="250" height="40" rx="20" fill="#0e7490"/>
  <text x="2115" y="307" text-anchor="middle" class="pill">RUNNER · 매일 12:30</text>
  <text x="1990" y="362" class="h2">수집 러너 · 21단계</text>
  <text x="1990" y="402" class="body">받기 8 → 계산 7 → 백업 5 → 근거 문서 1</text>
  <text x="1990" y="440" class="small">작업 스케줄러 12:30 · PC 작업자 매 분(화면 요청)</text>
  <text x="1990" y="474" class="small">잠금 · 회차 기록 · 종료코드 약속 · 일요일 복구 리허설</text>

  <rect x="1960" y="525" width="350" height="235" rx="20" fill="#0c2230" stroke="#38bdf8" stroke-width="2"/>
  <ellipse cx="2010" cy="566" rx="24" ry="9" fill="#7dd3fc"/><rect x="1986" y="566" width="48" height="42" fill="#2b7fa8"/><ellipse cx="2010" cy="608" rx="24" ry="9" fill="#2b7fa8"/>
  <text x="2050" y="580" class="h2">수집 DB</text>
  <text x="2050" y="612" class="small">SQLite · 5.1 GB</text>
  <text x="1985" y="668" class="body">약 2,192만 행</text>
  <text x="1985" y="702" class="body">시세 · 공시 · 재무 · 파생</text>
  <text x="1985" y="740" class="small">앱에는 읽기 전용으로 붙인다</text>

  <rect x="2330" y="525" width="350" height="235" rx="20" fill="#0c2230" stroke="#38bdf8" stroke-width="2"/>
  <ellipse cx="2380" cy="566" rx="24" ry="9" fill="#a7f3d0"/><rect x="2356" y="566" width="48" height="42" fill="#2f8f7f"/><ellipse cx="2380" cy="608" rx="24" ry="9" fill="#2f8f7f"/>
  <text x="2420" y="580" class="h2">근거 문서 DB</text>
  <text x="2420" y="612" class="small">SQLite</text>
  <text x="2355" y="668" class="body">법령 · 감독규정 조문</text>
  <text x="2355" y="702" class="body">섹터 법령 117문서</text>
  <text x="2355" y="740" class="small">7일에 한 번 개정 대조</text>


  <text x="855" y="768" class="body">로그인 세션 · 캐시</text>
  <text x="855" y="800" class="body">Celery 작업 큐</text>
  <text x="855" y="834" class="small">증권사 접근 토큰 공유</text>

  <rect x="1180" y="630" width="330" height="220" rx="22" fill="url(#green)" stroke="#2fa38a" class="card"/>
  <rect x="1213" y="662" width="56" height="56" rx="10" fill="#7c3aed" opacity=".85"/>
  <circle cx="1228" cy="677" r="5" fill="#ede9fe"/><circle cx="1254" cy="677" r="5" fill="#ede9fe"/><circle cx="1228" cy="703" r="5" fill="#ede9fe"/><circle cx="1254" cy="703" r="5" fill="#ede9fe"/><circle cx="1241" cy="690" r="5" fill="#c4b5fd"/>
  <text x="1280" y="690" class="h2">Qdrant 1.19</text>
  <text x="1205" y="768" class="body">문서 조각의 의미 벡터</text>
  <text x="1205" y="800" class="body">근거 답 · 올린 문서 검색</text>
  <text x="1205" y="834" class="small">컬렉션 둘 · bge-m3 임베딩</text>

  <rect x="1530" y="630" width="330" height="220" rx="22" fill="url(#green)" stroke="#2fa38a" class="card"/>
  <circle cx="1585" cy="690" r="26" fill="#0ea5e9" opacity=".9"/><circle cx="1570" cy="684" r="7" fill="#e0f2fe"/><circle cx="1600" cy="700" r="7" fill="#e0f2fe"/><path d="M1570 684L1600 700" stroke="#e0f2fe" stroke-width="3"/>
  <text x="1630" y="690" class="h2">Neo4j 5</text>
  <text x="1555" y="768" class="body">종목 · 개념 관계</text>
  <text x="1555" y="800" class="body">관계 탐색 화면</text>
  <text x="1555" y="834" class="small">선택 기능</text>

  <!-- AI · 퀀트 -->
  <rect x="480" y="880" width="1380" height="290" rx="24" fill="url(#amber)" stroke="#c2953b" class="card"/>
  <rect x="510" y="906" width="150" height="40" rx="20" fill="#b8892c"/>
  <text x="585" y="933" text-anchor="middle" class="pill">AI · 퀀트</text>
  <text x="510" y="994" class="h1">근거 답(RAG) · scikit-learn · LightGBM · QuantConnect LEAN</text>
  <text x="510" y="1040" class="body">근거 답 = 낱말 검색(FTS5) + 의미 검색(bge-m3 · Qdrant) → 로컬 답 모델(Ollama · qwen3:4b-instruct) → 서버 거름 셋</text>
  <text x="510" y="1080" class="body">모델 비교 · 군집 · 계절성 · XAI 설명 · 비용 · 손절 · 익절을 넣은 백테스트(LEAN 은 Docker socket 으로)</text>
  <text x="510" y="1126" class="small">판단 · 학습 · 백테스트는 저장 자료로 · 장중 현재가는 출처와 시각을 붙여 보이고, 실시간 구조는 3차에 올린다</text>

  <!-- 이 PC · 도커 밖 -->
  <rect x="1930" y="185" width="780" height="600" rx="26" fill="url(#teal)" stroke="#38bdf8" class="card"/>

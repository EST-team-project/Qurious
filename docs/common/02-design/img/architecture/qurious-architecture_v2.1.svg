  <text x="230" y="515" text-anchor="middle" class="h2">웹 브라우저</text>
  <text x="230" y="558" text-anchor="middle" class="small">앱 화면 72 · 위 탭 6</text>
  <text x="230" y="590" text-anchor="middle" class="small">왼쪽 전체 메뉴 트리</text>
  <text x="230" y="622" text-anchor="middle" class="small">학습 = 금융 필수 지식</text>
  <text x="230" y="654" text-anchor="middle" class="small">+ 개념 학습(앱 안)</text>

  <path class="line" d="M402 420H476"/>

  <!-- 컴포즈 구역 -->
  <rect x="440" y="185" width="1450" height="1015" rx="34" fill="#091424" stroke="#40618f" stroke-width="3" opacity=".96"/>
  <text x="475" y="232" class="zone" fill="#dce8ff">로컬 PC · DOCKER COMPOSE</text>
  <text x="475" y="266" class="small">서비스 10개가 한 네트워크에 있다 · 개발 모드는 코드 폴더를 붙여 저장하면 바로 반영된다</text>
  <text x="404" y="456" class="small">HTTP</text>

  <!-- APP -->
  <rect x="480" y="295" width="690" height="250" rx="24" fill="url(#blue)" stroke="#4d82cc" class="card"/>
  <rect x="510" y="322" width="160" height="40" rx="20" fill="#2563eb"/>
  <text x="590" y="349" text-anchor="middle" class="pill">APP · :8966</text>
  <text x="510" y="410" class="h1">FastAPI · Uvicorn · Python 3.12</text>
  <text x="510" y="452" class="body">화면과 API 267 을 한 주소에서 내보낸다</text>
  <text x="510" y="486" class="body">로보 어드바이저 · 모의투자 · 인디케이터 · 근거 상담</text>
  <text x="510" y="524" class="small">로그인 = 세션 쿠키(HttpOnly) + Redis · Alembic 이전</text>

  <!-- WORKERS -->
  <rect x="1200" y="295" width="650" height="250" rx="24" fill="url(#violet)" stroke="#8b78db" class="card"/>
  <rect x="1230" y="322" width="150" height="40" rx="20" fill="#6d5ae0"/>
  <text x="1305" y="349" text-anchor="middle" class="pill">WORKERS</text>
  <text x="1230" y="410" class="h1">Celery Worker · Beat</text>
  <text x="1230" y="452" class="body">자동매매 10분 · 리밸런싱 1시간 예약</text>
  <text x="1230" y="486" class="body">AI 상담 · 문서 넣기 같은 무거운 일</text>
  <text x="1230" y="524" class="small">브로커 · 결과 = Redis · 증권사 토큰도 Redis 로 공유</text>

  <path class="line" d="M1172 420H1196"/>

  <!-- 저장소 -->
  <text x="480" y="612" class="zone" fill="#a7f3d0">DATA STORES</text>
  <path class="bus" d="M720 578H1695"/>
  <path class="bus" d="M825 547V578"/>
  <path class="bus" d="M1525 547V578"/>

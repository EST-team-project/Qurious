  <path class="dash" d="M1345 578V626"/>
  <path class="dash" d="M1695 578V626"/>

  <rect x="480" y="630" width="330" height="220" rx="22" fill="url(#green)" stroke="#2fa38a" class="card"/>
  <ellipse cx="535" cy="676" rx="26" ry="10" fill="#5eead4"/><rect x="509" y="676" width="52" height="46" fill="#2f8f7f"/><ellipse cx="535" cy="722" rx="26" ry="10" fill="#2f8f7f"/>
  <text x="580" y="690" class="h2">PostgreSQL 16</text>
  <text x="505" y="768" class="body">앱 DB 45표</text>
  <text x="505" y="800" class="body">계정 · 모의 장부 · 주문</text>
  <text x="505" y="834" class="small">체결 · 리밸런싱 · 대화 기록</text>

  <rect x="830" y="630" width="330" height="220" rx="22" fill="url(#green)" stroke="#2fa38a" class="card"/>
  <ellipse cx="885" cy="676" rx="26" ry="10" fill="#fca5a5"/><rect x="859" y="676" width="52" height="46" fill="#b54848"/><ellipse cx="885" cy="722" rx="26" ry="10" fill="#b54848"/>

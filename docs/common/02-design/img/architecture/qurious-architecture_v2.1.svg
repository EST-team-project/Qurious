  <rect width="2752" height="1536" fill="url(#bg)"/>
  <circle cx="2240" cy="210" r="430" fill="#1e3a60" opacity=".12"/>
  <circle cx="820" cy="1320" r="500" fill="#194c47" opacity=".09"/>

  <text x="120" y="96" class="title">Qurious 시스템 아키텍처 v2.1</text>
  <text x="122" y="142" class="subtitle">AI Financial Quant Platform · 2차 로보 어드바이저 기준(2026-10-19) · 로컬 Docker Compose 서비스 10개 + 도커 밖 수집 러너 · 클라우드는 2 · 3차에 쓰지 않음</text>


<svg xmlns="http://www.w3.org/2000/svg" width="2752" height="1536" viewBox="0 0 2752 1536" role="img" aria-labelledby="title desc">
  <title id="title">Qurious 시스템 아키텍처 v3.0</title>
  <desc id="desc">브라우저와 외부 호출(TradingView Webhook · Open API 키)은 포트 8966 의 FastAPI 앱 하나로 들어온다. 앱은 규칙 세우기 · 지표와 인디케이터 · 검증과 백테스트 · 주문과 위험 네 영역의 도메인 서비스를 불러 PostgreSQL · Redis · Qdrant · Neo4j 를 쓰고, Celery 워커가 같은 서비스로 자동매매 · 리밸런싱 점검을 돌린다. 근거 상담과 모델은 Ollama 위에서 돈다. 도커 밖의 수집 러너가 매일 12:30 에 공식 자료를 받아 수집 DB 와 근거 문서 DB 에 쌓고 Hugging Face 비공개 데이터셋에 백업하며, 앱은 두 DB 를 읽기 전용으로만 연다. 증권사 주문은 서버의 한 관문에서 모의로 낮춘다.</desc>

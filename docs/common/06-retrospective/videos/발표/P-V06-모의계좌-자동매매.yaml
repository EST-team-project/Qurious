# 발표 영상 — 가상 돈으로 한 거래를 계좌 · 판단 흐름 · 자동매매 안전장치로 되돌아본다 (자세한 판 · 2 ~ 3분 · 2026-10-19 장중 체결 뒤)
# 화면: 모의투자 › 모의계좌 현황 (paper-dashboard · 강민석) · 로보 어드바이저 › 모의 투자 의사결정 (robo-decision · 강민석) · 퀀트자동매매 › 자동매매 현황 (quant-auto · 오준영)
# 사용법 판(장면/V06)과 다른 점: 계좌 요약 칸 읽기(총 손익 = 총 자산 − 초기 자금) · 자산 구성 · QFRS 성과 지표 · 자산 추이 · 최근 체결 ·
#   의사결정 흐름 · 위험관리 숫자(하루 자동 주문 한도 · 종목 비중 한도 · 쿨다운)
# 보기만 — 계좌 초기화 · 데모 데이터 · 자동매매 시작 · 비상 정지는 누르지 않는다
# 녹화: python tools/demo/record_demo.py --out tools/demo/out/present docs/common/06-retrospective/videos/발표/P-V06-모의계좌-자동매매.yaml
file: 발표-V06-모의계좌-자동매매
title: 가상 돈으로 한 거래를 계좌와 기록으로 되돌아봅니다
owner: 강민석 · 오준영
start: paper-dashboard
steps:
  - chapter: {label: "1 / 3 · 목적", title: "결과를 기록으로 봅니다", text: "모의 계좌의 잔고 · 손익과 자동매매의 판단 흐름 · 안전장치를 한곳에서 되돌아봅니다", sec: 5.0}
  - say: "모의투자 계좌 현황 — 보유 현금 · 주식 평가액 · 코인 · 대체자산 평가액 · 총 자산 · 총 손익"
  - ring: {target: "#pd-kpis", sec: 4.0}
  - say: "총 손익은 총 자산에서 초기 자금(1억 원)을 뺀 값 — 수수료 · 세금까지 빠져 있습니다"
  - pause: 5.0
  - say: "직접 낸 모의 주문은 이 계좌(1억 원)에, 자동매매는 전용 가상 장부(1천만 원)에 따로 기록됩니다"
  - pause: 3.0
  - say: "자산 구성 — 현금과 국내주식 비중"
  - ring: {target: "#pd-allocation-chart", sec: 3.0}
  - say: "QFRS 성과 지표 — 매일 조회할 때 스냅샷이 쌓이고, 판단할 만큼 기록이 모이기 전에는 숫자 대신 판단을 미룬다고 적습니다"
  - ring: {target: "#pd-metrics-cards", sec: 3.5}
  - say: "기록이 쌓이면 — 샤프 지수는 여러 번 시도할수록 부풀기 쉬워, 시도 횟수(50회)를 감안해 깎은 DSR 이 0.95 이상일 때만 통계적으로 유의하다고 봅니다"
  - pause: 5.5
  - say: "자산 추이 — 날마다 남긴 총 자산 스냅샷을 선으로 잇습니다(아직 사흘치라 짧고 거의 평평합니다)"
  - ring: {target: "#pd-equity-chart", sec: 3.5}
  - say: "최근 체결 — 직접 낸 주문이 시각 · 종목 · 수량 · 단가 · 금액과 함께 남습니다(자동매매 주문은 자동매매 현황에 따로 남습니다)"
  - ring: {target: "#pd-recent", sec: 3.5}
  - chapter: {label: "2 / 3 · 과정", title: "판단 흐름과 안전장치", text: "자동매매가 어떤 차례로 판단하는지, 그리고 무엇이 자동 주문을 멈추는지 봅니다", sec: 4.5}
  - go: robo-decision
  - say: "모의 투자 의사결정 — 시그널 수집 → 패턴 인식 분석 → 리밸런싱 판단 → 가상 주문 실행 → 성과 기록"
  - ring: {target: '[data-view="robo-decision"] :text("AI 의사결정 프로세스")', sec: 4.0}
  - say: "자동매매가 판단한 종목마다 근거(지표 신호와 사유)가 카드로 남습니다"
  - ring: {target: "#robo-rationale", sec: 3.0}
  - go: quant-auto
  - say: "자동매매 현황 — 켜고 끄기는 사용자가 직접 하고, 켜 두면 10분마다 신호를 계산합니다"
  - ring: {target: "#auto-trade-status", sec: 3.5}
  - say: "위험관리 상태 — 비상 정지 · 당일 손익 · 당일 자동 주문 한도 · 종목 비중 한도 · 종목 주문 쿨다운"
  - ring: {target: "#risk-kpis", sec: 4.5}
  - say: "일손실 한도는 주문 루프를 멈추고, 비상 정지는 사람이 켜고 끕니다"
  - ring: {target: "#risk-note", sec: 4.0}
  - say: "자동매매 로그 — 바퀴마다 가상 주문과 건너뛴 까닭(종목 비중 한도 · 중복 주문 방지)이 시각과 함께 쌓입니다"
  - ring: {target: "#auto-trade-log", sec: 3.5}
  - chapter: {label: "3 / 3 · 결과", title: "비용을 뺀 값으로 판단합니다", text: "직접 주문은 모의 계좌(1억 원)에, 자동매매는 전용 가상 장부(1천만 원)에 기록되고 손익은 비용을 뺀 값입니다 — 한도와 비상 정지가 자동 주문을 멈춥니다", sec: 5.0}
  - say: "가상 돈으로 하는 연습이며 투자 권유가 아닙니다"
  - pause: 3.0

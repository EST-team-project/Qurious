# 발표 판 — 매일 낮 공식 자료를 받아 검증하고 백업하는 모습 (자세한 판 · 2 ~ 3분 · 2026-10-18)
# 화면: 데이터 › 데이터 관제 (data-status) · 수집 일정 · 단계 (crawl-auto) · 적재 · 백업 (crawl-ingest) · 주담당 이동원
# 계정: 관리자 — 수집 세 화면은 관리자에게만 보인다. 계정은 환경 변수 DEMO_EMAIL · DEMO_PASSWORD 로만 넘긴다(파일에 쓰지 않음)
# 늘린 것: 관제 카드 셋 읽는 법 · 자료별 기준일 표 · 회차 결과 칸 · 단계 묶음 셋(받기 · 계산 · 백업) · 백업 대조 세 줄 · 원본 삭제 판정 · 판정 읽는 법 · 지난 회차
# 누르지 않는다: 전체 수집 · 다시 받기 · 명령 · 원격 다시 확인 · 복원 리허설(실제로 돈다) — 보기만
# 가림: 「이 PC 용량」 카드(.cl-disk — 이 PC 의 드라이브 정보) · 감춤: 관리자에게만 뜨는 「기능 완성도」 배지(#view-completion-indicator — 개발용 표시)
# 날마다 바뀌는 숫자는 자막에 넣지 않았다(규칙 · 칸 이름만 말한다) — 다시 찍어도 자막이 화면과 어긋나지 않게
file: 발표-F01-매일-자료-수집-검증
title: 매일 낮, 공식 자료를 받아 검증하고 백업합니다
owner: 이동원
start: data-status
mask: [".cl-disk"]
hide: ["#view-completion-indicator"]
steps:
  # ── 1 / 3 · 목적 — 데이터 관제 ──
  - chapter: {label: "1 / 3 · 목적", title: "자료가 오늘도 들어왔나", text: "시세 · 공시 · 재무 · 뉴스를 매일 낮 12:30 에 받고, 자료마다 며칠 것까지 있는지 화면에서 봅니다", sec: 4.0}
  - wait: {target: ".view.active .dh-sum", timeout: 90, cut: true}
  - say: "데이터 관제 — 모은 자료가 며칠 것까지 있는지, 매일 낮 갱신이 돌았는지 한 화면에서 봅니다"
  - pause: 4.0
  - ring: {target: ".view.active .dh-sum .dh-card:nth-child(1)", sec: 2.0}
  - say: "맨 앞 「판정」 — 자료가 모두 최신이거나 하루 밀린 정도면 「정상」 입니다"
  - pause: 4.0
  - ring: {target: ".view.active .dh-sum .dh-card:nth-child(2)", sec: 2.0}
  - say: "시세 기준일이 오늘보다 앞선 것은 고장이 아닙니다 — 시세는 출처가 다음 날 낮에 공개합니다"
  - pause: 4.5
  - ring: {target: ".view.active .dh-sum .dh-card:nth-child(3)", sec: 2.0}
  - say: "낮 갱신 — 몇 시에 시작해 몇 분 걸렸는지, 다음 회차는 언제인지"
  - pause: 4.0
  - scroll: {target: '.view.active .dh-h:has-text("자료별 기준일")', block: "start"}
  - say: "자료별 기준일 — 자료마다 어디서 받았는지 · 기준일 · 판정 · 줄 수를 한 줄씩"
  - pause: 4.5
  - ring: {target: '.view.active .dh-table tbody tr:has-text("주식 일봉")', sec: 2.0}
  - say: "맨 끝 설명 칸이 판정의 까닭입니다 — 기준일이 왜 그날인지를 적어 둡니다"
  - pause: 4.5
  # ── 2 / 3 · 과정 — 수집 일정 · 단계 → 적재 · 백업 ──
  - chapter: {label: "2 / 3 · 과정", title: "스물한 단계가 한 회차입니다", text: "받기 → 계산 → 백업 → 근거 문서 차례로 돌고, 단계마다 결과와 걸린 시간이 남습니다", sec: 3.5}
  - go: crawl-auto
  - wait: {target: ".view.active .cl-tiles", timeout: 30}
  - say: "수집 일정 · 단계 — 고른 회차가 언제 돌았고 단계마다 어떻게 끝났는지 봅니다"
  - pause: 4.0
  - ring: {target: ".view.active .cl-tiles .cl-tile:nth-child(2)", sec: 2.0}
  - say: "결과 칸은 성공 · 실패 · 경고 · 건너뜀을 따로 셉니다"
  - pause: 4.0
  - scroll: {target: ".view.active .cl-table-wrap", block: "start"}
  - say: "받기 — 출처마다 새 자료를 받습니다 · 단계마다 하는 일 · 걸린 시간 · 결과가 한 줄씩"
  - pause: 4.5
  - say: "막대는 모든 단계가 같은 눈금이라, 오래 걸린 단계가 한눈에 보입니다"
  - pause: 4.0
  - scroll: {target: '.view.active tr.cl-group:has-text("계산")', block: "start"}
  - say: "계산 — 받은 원 가격으로 수정주가 · 총수익 지수를 만들고, 새 자료가 없으면 건너뜁니다"
  - pause: 5.0
  - scroll: {target: '.view.active tr.cl-group:has-text("백업")', block: "start"}
  - say: "백업 — 바뀐 표만 파일로 내보내고, 행 수와 값을 대조한 뒤 올립니다"
  - pause: 4.5
  - go: crawl-ingest
  - wait: {target: ".view.active .cl-checklist", timeout: 30}
  - say: "적재 · 백업 — 올린 자료가 이 PC 의 자료와 정말 같은지 하나씩 확인합니다"
  - pause: 4.0
  - ring: {target: '.view.active .cl-checklist li:has-text("기본 대조")', sec: 2.0}
  - say: "기본 대조 — 표 · 행 수 · 파일이 빠짐없이 같은지"
  - pause: 3.5
  - ring: {target: '.view.active .cl-checklist li:has-text("깊은 대조")', sec: 2.0}
  - say: "깊은 대조 — 값 하나하나까지 같은지"
  - pause: 3.5
  - ring: {target: '.view.active .cl-checklist li:has-text("복원 리허설")', sec: 2.0}
  - say: "복원 리허설 — 올린 파일로 실제로 되살려 보고, 매주 일요일에 저절로 다시 합니다"
  - pause: 4.5
  # ── 3 / 3 · 결과 — 판정 읽는 법 · 지난 회차 ──
  - chapter: {label: "3 / 3 · 결과", title: "실패는 숨기지 않습니다", text: "받지 못한 날과 실패한 단계는 까닭과 함께 남고, 다시 받을 수 있습니다", sec: 3.5}
  - ring: {target: ".view.active .cl-checklist + .cl-alert", sec: 2.0}
  - say: "맨 아래 판정 — 남은 조건이 하나라도 있으면 이 PC 의 원본을 지우지 않습니다"
  - pause: 4.5
  - go: data-status
  - wait: {target: ".view.active .dh-legend", timeout: 60, cut: true}
  - ring: {target: ".view.active .dh-legend", sec: 2.0}
  - say: "판정 읽는 법 — 거래일 이틀이 비면 「늦음」, 사흘 이상이면 「멈춤」 · 멈추면 갱신 기록부터 봅니다"
  - pause: 5.0
  - ring: {target: ".view.active .dh-hist", sec: 2.0}
  - say: "지난 회차 — 날마다 성공 여부 · 걸린 시간 · 그날 시세 기준일이 남습니다"
  - pause: 4.5
  - say: "공식 자료는 이용 조건에 맞춰 이 서비스 안에서만 보여 주며, 원자료는 비공개 저장소에만 둡니다"
  - pause: 4.0

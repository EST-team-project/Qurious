# V04 — 가상 돈으로 국내 주식을 주문해 본다
# 화면: 모의투자 › 국내주식 모의주문 (paper-stock · 주담당 강민석)
# 장중 판(2026-10-20): 국내 시장가 매수 체결까지. 미국 예약 주문 장면은 뺐다 — PR #286(해외 종목 거부)로 미국 모의 주문이
#   막혀(미리 보기 400 · 2026-10-20 확인) 강민석 님 핫픽스를 기다린다. 핫픽스가 머지되면 10-19 판(git 이력)의 미국 장면을 되살린다.
#   (10-17 첫 판은 장이 닫힌 날이라 국내는 미리 보기까지였다 · 파일 이름 · 영상 id 는 영상 표가 쓰므로 그대로)
file: V04-모의주문-국내미국
title: 가상 돈으로 국내 주식을 주문해 봅니다
owner: 강민석
start: paper-stock
mask: ["#alpaca-key", "#alpaca-secret"]
dialogs: accept      # 시장가 매수의 브라우저 확인 창은 「확인」
steps:
  - chapter: {label: "1 / 3 · 목적", title: "가상 돈으로 먼저 해 봅니다", text: "모의 계좌(가상 1억 원)로 주문하고, 비용까지 미리 확인합니다", sec: 3.5}
  - say: "종목 코드를 넣고 시세를 조회합니다 — 시세 아래에 출처와 체결 시각이 붙습니다"
  - fill: {target: "#ps-symbol", text: "005930"}
  - click: "#ps-quote-btn"
  - pause: 2.5
  - ring: {target: "#ps-quote", sec: 2.0}
  - say: "수량을 넣고 매수 미리 보기 — 금액 · 수수료 · 세금을 먼저 봅니다"
  - fill: {target: "#ps-qty", text: "1"}
  - click: "#ps-preview-buy"
  - pause: 2.0
  - ring: {target: "#ps-preview", sec: 3.0}
  - chapter: {label: "2 / 3 · 과정", title: "시장가로 체결합니다", text: "조회한 시세로 바로 체결되고, 보유 종목에 들어갑니다", sec: 3.0}
  - say: "시장가 매수 — 조회한 시세로 체결되어 보유 종목에 들어갑니다. 증권사 키를 연결한 계정은 체결 직전에 한 번 더 받습니다"
  - click: "#ps-buy"
  - wait: {target: "#ps-positions table", timeout: 20}
  - pause: 1.5
  - ring: {target: "#ps-positions", sec: 2.5}
  - chapter: {label: "3 / 3 · 결과", title: "주문 전에 값을 먼저 봅니다", text: "시세 · 비용을 확인한 뒤 주문하고, 모든 거래는 모의 계좌에 기록됩니다", sec: 3.0}
  - say: "가상 돈으로 하는 연습이며 실제 주문이 나가지 않습니다"
  - pause: 3.0

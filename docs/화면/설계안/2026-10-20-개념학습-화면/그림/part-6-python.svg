<svg xmlns="http://www.w3.org/2000/svg" width="240" height="140" viewBox="0 0 240 140" role="img" aria-label="파이썬 중급 — 모듈이 서로를 가져오고, 약속(점선 틀)에 맞춰 구현을 바꾼다">
  <title>6부 파이썬 중급</title>
  <!-- 위 상자가 아래 두 상자를 가져온다(import) · 오른쪽 아래는 약속 틀(점선) 안의 구현 · 꼬리표 = 타입 힌트 -->
  <rect width="240" height="140" rx="14" fill="#ffffff"/>
  <rect width="240" height="140" rx="14" fill="#059669" fill-opacity="0.10"/>
  <g>
    <rect x="84" y="20" width="72" height="28" rx="6" fill="#ffffff" stroke="#c5cdde" stroke-width="2"/>
    <rect x="85" y="21" width="8" height="26" rx="3" fill="#059669"/>
    <rect x="100" y="28" width="40" height="5" rx="2.5" fill="#059669" fill-opacity="0.6"/>
    <rect x="100" y="37" width="28" height="4" rx="2" fill="#e8ecf3"/>
  </g>
  <!-- 타입 힌트 꼬리표 -->
  <g>
    <path d="M160 26 H184 L192 34 L184 42 H160 Z" fill="#059669" fill-opacity="0.15" stroke="#059669" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="166" cy="34" r="2.5" fill="#059669"/>
  </g>
  <path d="M106 50 C 100 66, 84 70, 78 84" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M73 79 L78 86 L83 79" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M134 50 C 140 66, 156 70, 162 84" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M157 79 L162 86 L167 79" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <g>
    <rect x="40" y="90" width="72" height="28" rx="6" fill="#ffffff" stroke="#c5cdde" stroke-width="2"/>
    <rect x="41" y="91" width="8" height="26" rx="3" fill="#059669"/>
    <rect x="56" y="98" width="40" height="5" rx="2.5" fill="#c5cdde"/>
    <rect x="56" y="107" width="24" height="4" rx="2" fill="#e8ecf3"/>
  </g>
  <g>
    <rect x="120" y="84" width="84" height="40" rx="9" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="126" y="90" width="72" height="28" rx="6" fill="#ffffff" stroke="#c5cdde" stroke-width="2"/>
    <rect x="127" y="91" width="8" height="26" rx="3" fill="#059669"/>
    <rect x="142" y="98" width="40" height="5" rx="2.5" fill="#c5cdde"/>
    <rect x="142" y="107" width="28" height="4" rx="2" fill="#e8ecf3"/>
  </g>
</svg>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>회원가입 | Qurious</title>
  <script type="module" src="/js/brand.js"></script>
  <link rel="icon" href="/favicon.ico" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" as="style" onload="this.rel='stylesheet'"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <noscript>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  </noscript>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="/css/completion.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #f4f6fa;
      color: #0f172a;
      font-family: 'Pretendard Variable', 'Pretendard', -apple-system, sans-serif;
      font-size: 18px;
      font-feature-settings: "kern" 1;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      word-break: keep-all;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image:
        radial-gradient(ellipse at 20% 50%, rgba(37,99,235,0.05) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(217,119,6,0.04) 0%, transparent 40%);
    }
    .wrap {
      width: 100%;
      max-width: 440px;
      padding: 24px;
    }
    .brand {
      text-align: center;
      margin-bottom: 36px;
    }
    .brand-icon {
      width: 58px;
      height: 58px;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, #4a90e2, #f0b429);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: #fff;
      box-shadow: 0 0 28px rgba(74,144,226,0.35);
    }
    .brand-name {
      font-size: 26px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.5px;
    }
    .brand-sub {
      font-size: 15px;
      color: #64748b;
      margin-top: 6px;
      line-height: 1.5;
    }
    .card {
      background: #ffffff;
      border: 1px solid #dde2ec;
      border-radius: 16px;
      padding: 36px;
      box-shadow: 0 4px 28px rgba(0,0,0,0.08);
    }
    .card-title {
      font-size: 20px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 28px;
    }
    .form-group { margin-bottom: 20px; }
    .form-label {
      display: block;
      font-size: 15px;
      font-weight: 500;
      color: #475569;
      margin-bottom: 8px;
    }
    .form-input {
      width: 100%;
      padding: 12px 16px;
      background: #f8fafc;
      border: 1.5px solid #dde2ec;
      border-radius: 10px;
      color: #0f172a;
      font-size: 17px;
      font-family: inherit;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .form-input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
      background: #fff;
    }
    .form-input::placeholder { color: #94a3b8; }
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: #2563eb;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 8px;
      transition: background .15s, box-shadow .15s;
      font-family: inherit;
      letter-spacing: -0.2px;
    }
    .btn-submit:hover { background: #1d4ed8; box-shadow: 0 4px 18px rgba(37,99,235,0.28); }
    .btn-submit:active { background: #1e40af; }
    .form-footer {
      margin-top: 22px;
      text-align: center;
      font-size: 15px;
      color: #64748b;
    }
    .form-footer a { color: #2563eb; text-decoration: none; font-weight: 600; }
    .form-footer a:hover { text-decoration: underline; }
    .hint {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 5px;
    }
  </style>
</head>
<body data-view="register">
  <div class="wrap">
    <div class="brand">
      <div class="brand-icon"><i class="fa-solid fa-chart-mixed"></i></div>
      <div class="brand-name" data-brand="name">Qurious</div>
      <div class="brand-sub" data-brand="tagline">AI Financial Quant Platform</div>
    </div>

    <div class="card">
      <div class="card-title">회원가입</div>
      <form id="f">
        <div class="form-group">
          <label class="form-label">이름</label>
          <input name="name" type="text" class="form-input" placeholder="홍길동" required />
        </div>
        <div class="form-group">
          <label class="form-label">이메일</label>
          <input name="email" type="email" class="form-input" placeholder="you@example.com" required />
          <div class="hint">로그인 ID 입니다 — 대소문자는 구분하지 않습니다</div>
        </div>
        <div class="form-group">
          <label class="form-label">비밀번호</label>
          <input id="pw" name="password" type="password" class="form-input" placeholder="••••••••" minlength="8" maxlength="64" autocomplete="new-password" required />
          <div class="hint" id="pw-hint">8자 이상 · 64자 이하 · 72바이트(한글 24자) 이하</div>
        </div>
        <button type="submit" class="btn-submit">
          <i class="fa-solid fa-user-plus" style="margin-right:8px;"></i>가입하기
        </button>
      </form>
      <div class="form-footer">
        이미 계정이 있나요? <a href="/login.html">로그인</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { api, getMe, safeNextPath, setToast } from "/js/common.js";
    import { initCompletionIndicator } from "/js/completion.js";
    initCompletionIndicator();

    // 이미 로그인된 상태면 회원가입 화면 대신 앱으로 이동
    getMe({ redirectOnUnauthorized: false })
      .then(() => location.replace(safeNextPath()))
      .catch(() => {});

    window.addEventListener("pageshow", async (ev) => {
      if (!ev.persisted) return;   // 뒤로가기 캐시로 되살아났을 때만 — 이미 로그인이면 앱으로(login.html 과 같은 이유)
      // redirectOnUnauthorized:false — 로그아웃 상태가 정상인 화면이라, 401 에 로그인 화면으로 끌려가지 않게
      try { await api("/api/me", { redirectOnUnauthorized: false }); location.replace(safeNextPath()); } catch { /* 로그인 안 됨 — 그대로 */ }
    });
    // 비밀번호 규칙은 서버가 정한다(app/services/account.py) — 안내 · 입력 칸 제한을 같은 값으로 맞춘다.
    let policy = null;
    api("/api/auth/password-policy").then(p => {
      policy = p;
      const pw = document.getElementById("pw");
      pw.minLength = p.min_length;
      pw.maxLength = p.max_length;
      document.getElementById("pw-hint").textContent = p.rules.slice(0, 2).join(" · ");
    }).catch(() => {});
    document.getElementById("f").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const password = String(fd.get("password") || "");
      // 한글은 한 글자 3바이트 — 서버가 받지 않을 길이를 미리 알려 준다(서버도 같은 검사를 한다)
      if (policy && new TextEncoder().encode(password).length > policy.max_bytes) {
        setToast(`비밀번호가 너무 깁니다 — ${policy.max_bytes}바이트(영문 72자 · 한글 24자) 이하로 입력하세요.`, "error");
        return;
      }
      try {
        await api("/api/auth/register", {
          method: "POST",
          body: { name: fd.get("name"), email: String(fd.get("email") || "").trim(), password },
        });
        location.replace(safeNextPath());   // 가입 뒤 뒤로가기로 가입 화면이 다시 나오지 않게
      } catch (err) {
        setToast(err.message, "error");
      }
    });
  </script>
</body>
</html>

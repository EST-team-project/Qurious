<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="only light" />
  <title>회원가입 | Qurious</title>
  <script type="module" src="/js/brand.js"></script>
  <link rel="icon" href="/favicon.ico" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" as="style" onload="this.rel='stylesheet'"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <noscript>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  </noscript>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="/css/completion.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #f4f6fa;
      color: #0f172a;
      font-family: 'Pretendard Variable', 'Pretendard', -apple-system, sans-serif;
      font-size: 18px;
      font-feature-settings: "kern" 1;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      word-break: keep-all;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image:
        radial-gradient(ellipse at 20% 50%, rgba(37,99,235,0.05) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(217,119,6,0.04) 0%, transparent 40%);
    }
    .wrap {
      width: 100%;
      max-width: 440px;
      padding: 24px;
    }
    .brand {
      text-align: center;
      margin-bottom: 36px;
    }
    .brand-icon {
      width: 58px;
      height: 58px;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, #4a90e2, #f0b429);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: #fff;
      box-shadow: 0 0 28px rgba(74,144,226,0.35);
    }
    .brand-name {
      font-size: 26px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.5px;
    }
    .brand-sub {
      font-size: 15px;
      color: #64748b;
      margin-top: 6px;
      line-height: 1.5;
    }
    .card {
      background: #ffffff;
      border: 1px solid #dde2ec;
      border-radius: 16px;
      padding: 36px;
      box-shadow: 0 4px 28px rgba(0,0,0,0.08);
    }
    .card-title {
      font-size: 20px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 28px;
    }
    .form-group { margin-bottom: 20px; }
    .form-label {
      display: block;
      font-size: 15px;
      font-weight: 500;
      color: #475569;
      margin-bottom: 8px;
    }
    .form-input {
      width: 100%;
      padding: 12px 16px;
      background: #f8fafc;
      border: 1.5px solid #dde2ec;
      border-radius: 10px;
      color: #0f172a;
      font-size: 17px;
      font-family: inherit;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .form-input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
      background: #fff;
    }
    .form-input::placeholder { color: #94a3b8; }
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: #2563eb;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 8px;
      transition: background .15s, box-shadow .15s;
      font-family: inherit;
      letter-spacing: -0.2px;
    }
    .btn-submit:hover { background: #1d4ed8; box-shadow: 0 4px 18px rgba(37,99,235,0.28); }
    .btn-submit:active { background: #1e40af; }
    .form-footer {
      margin-top: 22px;
      text-align: center;
      font-size: 15px;
      color: #64748b;
    }
    .form-footer a { color: #2563eb; text-decoration: none; font-weight: 600; }
    .form-footer a:hover { text-decoration: underline; }
    .hint {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 5px;
    }
    /* 약관 · 개인정보 동의 (2026-10-29 · js/terms.js) */
    .consent { margin: 6px 0 14px; padding: 14px 16px; border: 1.5px solid #dde2ec; border-radius: 10px; background: #f8fafc; }
    .consent-row { display: flex; align-items: center; gap: 10px; font-size: 14.5px; color: #334155; padding: 6px 0; }
    .consent-row input[type="checkbox"] { width: 18px; height: 18px; flex: none; accent-color: #2563eb; cursor: pointer; }
    .consent-row label { flex: 1; cursor: pointer; }
    .consent-all { font-weight: 700; border-bottom: 1px solid #dde2ec; padding-bottom: 10px; margin-bottom: 4px; }
    .consent-req { color: #2563eb; font-weight: 600; margin-right: 4px; }
    .consent-view { flex: none; background: none; border: 0; color: #64748b; font-size: 13px; text-decoration: underline; cursor: pointer; padding: 4px; font-family: inherit; }
    .consent-view:hover { color: #2563eb; }
    dialog#terms-dialog { margin: auto; /* 페이지의 margin 초기화가 대화상자의 가운데 정렬을 덮는다 */ width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 48px); border: 0; border-radius: 14px; padding: 0; color: #1e293b; box-shadow: 0 20px 60px rgba(15,23,42,.35); }
    dialog#terms-dialog::backdrop { background: rgba(15,23,42,.5); }
    .terms-box { display: flex; flex-direction: column; max-height: calc(100vh - 48px); }
    .terms-body { overflow-y: auto; padding: 8px 24px 4px; font-size: 14.5px; line-height: 1.7; }
    .terms-body h3 { font-size: 18px; margin: 14px 0 8px; }
    .terms-body h4 { font-size: 15px; margin: 14px 0 4px; }
    .terms-body p { margin: 4px 0; }
    .terms-lead { color: #64748b; font-size: 13.5px; }
    .terms-foot { color: #94a3b8; font-size: 12.5px; margin-top: 18px; }
    .terms-actions { display: flex; gap: 10px; justify-content: flex-end; align-items: center; flex-wrap: wrap; padding: 14px 24px 18px; border-top: 1px solid #e2e8f0; }
    .terms-actions a { margin-right: auto; font-size: 13px; color: #2563eb; }
    .terms-actions button { padding: 10px 18px; border-radius: 9px; font-size: 14.5px; font-family: inherit; cursor: pointer; border: 1.5px solid #dde2ec; background: #fff; color: #334155; }
    .terms-actions button.primary { background: #2563eb; border-color: #2563eb; color: #fff; font-weight: 700; }
  </style>
</head>
<body data-view="register">
  <div class="wrap">
    <div class="brand">
      <div class="brand-icon"><i class="fa-solid fa-chart-mixed"></i></div>
      <div class="brand-name" data-brand="name">Qurious</div>
      <div class="brand-sub" data-brand="tagline">AI Financial Quant Platform</div>
    </div>

    <div class="card">
      <div class="card-title">회원가입</div>
      <form id="f">
        <div class="form-group">
          <label class="form-label">이름</label>
          <input name="name" type="text" class="form-input" placeholder="홍길동" required />
        </div>
        <div class="form-group">
          <label class="form-label">이메일</label>
          <input name="email" type="email" class="form-input" placeholder="you@example.com" required />
          <div class="hint">로그인 ID 입니다 — 대소문자는 구분하지 않습니다</div>
        </div>
        <div class="form-group">
          <label class="form-label">비밀번호</label>
          <input id="pw" name="password" type="password" class="form-input" placeholder="••••••••" minlength="8" maxlength="64" autocomplete="new-password" required />
          <div class="hint" id="pw-hint">8자 이상 · 64자 이하 · 72바이트(한글 24자) 이하</div>
        </div>
        <div class="form-group">
          <label class="form-label">생년월일</label>
          <input id="birth" name="birth_date" type="date" class="form-input" min="1900-01-01" required />
          <div class="hint">만 14세 이상만 가입할 수 있습니다 — 나이 확인에만 쓰고 저장하지 않습니다</div>
        </div>
        <fieldset class="consent" id="consent" style="margin-inline:0;">
          <legend class="hint" style="padding:0 6px;">약관 · 개인정보 동의</legend>
          <div class="consent-row consent-all">
            <input id="agree-all" type="checkbox" />
            <label for="agree-all">전체 동의</label>
          </div>
          <div id="consent-rows"><!-- js/terms.js 의 항목마다 체크박스 한 줄 — 아래 스크립트가 채운다 --></div>
        </fieldset>
        <div class="hint" style="margin:-4px 0 14px;"><a href="/privacy.html" target="_blank" rel="noopener" style="color:#2563eb;">개인정보 처리방침 보기</a></div>
        <button type="submit" class="btn-submit">
          <i class="fa-solid fa-user-plus" style="margin-right:8px;"></i>가입하기
        </button>
      </form>
      <div class="form-footer">
        이미 계정이 있나요? <a href="/login.html">로그인</a>
      </div>
    </div>
  </div>

  <dialog id="terms-dialog" aria-labelledby="terms-dialog-title">
    <div class="terms-box">
      <div style="padding:18px 24px 0;"><span class="hint" id="terms-dialog-title">약관 · 안내 전문</span></div>
      <div class="terms-body" id="terms-dialog-body"></div>
      <div class="terms-actions">
        <a id="terms-dialog-full" href="/terms.html" target="_blank" rel="noopener">전문을 새 창으로 보기(인쇄 · 저장)</a>
        <button type="button" id="terms-dialog-close">닫기</button>
        <button type="button" class="primary" id="terms-dialog-agree">읽었습니다 · 동의</button>
      </div>
    </div>
  </dialog>

  <script type="module">
    import { api, getMe, safeNextPath, setToast } from "/js/common.js";
    import { TERMS, TERMS_VERSION, renderTerm, renderFooter } from "/js/terms.js";
    import { initCompletionIndicator } from "/js/completion.js";
    import { attachPasswordToggles } from "/js/pwtoggle.js";
    initCompletionIndicator();
    attachPasswordToggles(document.querySelector("form"));   // 비밀번호 보기 버튼

    // ── 약관 · 개인정보 동의 — 문구는 js/terms.js 한 곳(전문 페이지 terms.html 과 같은 글) ──
    const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    const rows = document.getElementById("consent-rows");
    rows.innerHTML = TERMS.map(t => `<div class="consent-row">
      <input id="agree-${t.id}" class="agree" data-id="${t.id}" type="checkbox" required />
      <label for="agree-${t.id}"><span class="consent-req">[필수]</span>${esc(t.short)}</label>
      <button type="button" class="consent-view" data-terms="${t.id}">보기</button></div>`).join("");
    const boxes = () => [...document.querySelectorAll("#consent-rows .agree")];
    const allBox = document.getElementById("agree-all");
    const syncAll = () => { allBox.checked = boxes().every(b => b.checked); };
    allBox.addEventListener("change", () => { boxes().forEach(b => { b.checked = allBox.checked; }); });
    rows.addEventListener("change", syncAll);

    const dialog = document.getElementById("terms-dialog");
    let openId = "";
    rows.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-terms]");
      if (!btn) return;
      openId = btn.dataset.terms;
      const term = TERMS.find(t => t.id === openId);
      document.getElementById("terms-dialog-title").textContent = term.title;
      document.getElementById("terms-dialog-body").innerHTML = renderTerm(term, esc) + renderFooter(esc);
      document.getElementById("terms-dialog-body").scrollTop = 0;
      document.getElementById("terms-dialog-full").href = `/terms.html#terms-${openId}`;
      dialog.showModal();
    });
    document.getElementById("terms-dialog-close").addEventListener("click", () => dialog.close());
    document.getElementById("terms-dialog-agree").addEventListener("click", () => {
      const box = document.getElementById(`agree-${openId}`);
      if (box) { box.checked = true; syncAll(); }
      dialog.close();
    });

    // 이미 로그인된 상태면 회원가입 화면 대신 앱으로 이동
    getMe({ redirectOnUnauthorized: false })
      .then(() => location.replace(safeNextPath()))
      .catch(() => {});

    window.addEventListener("pageshow", async (ev) => {
      if (!ev.persisted) return;   // 뒤로가기 캐시로 되살아났을 때만 — 이미 로그인이면 앱으로(login.html 과 같은 이유)
      // redirectOnUnauthorized:false — 로그아웃 상태가 정상인 화면이라, 401 에 로그인 화면으로 끌려가지 않게
      try { await api("/api/me", { redirectOnUnauthorized: false }); location.replace(safeNextPath()); } catch { /* 로그인 안 됨 — 그대로 */ }
    });
    // 생년월일 — 만 14세 미만 안내만 미리 한다(판정은 서버가 한다 · 날짜는 서버에도 저장되지 않는다)
    const birth = document.getElementById("birth");
    birth.max = new Date().toISOString().slice(0, 10);
    const isUnder14 = (value) => {
      const [y, m, d] = String(value || "").split("-").map(Number);
      if (!y || !m || !d) return false;
      const t = new Date();
      let age = t.getFullYear() - y;
      if (t.getMonth() + 1 < m || (t.getMonth() + 1 === m && t.getDate() < d)) age -= 1;
      return age < 14;
    };
    // 비밀번호 규칙은 서버가 정한다(app/services/account.py) — 안내 · 입력 칸 제한을 같은 값으로 맞춘다.
    let policy = null;
    api("/api/auth/password-policy").then(p => {
      policy = p;
      const pw = document.getElementById("pw");
      pw.minLength = p.min_length;
      pw.maxLength = p.max_length;
      document.getElementById("pw-hint").textContent = p.rules.slice(0, 2).join(" · ");
    }).catch(() => {});
    document.getElementById("f").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const password = String(fd.get("password") || "");
      // 한글은 한 글자 3바이트 — 서버가 받지 않을 길이를 미리 알려 준다(서버도 같은 검사를 한다)
      if (policy && new TextEncoder().encode(password).length > policy.max_bytes) {
        setToast(`비밀번호가 너무 깁니다 — ${policy.max_bytes}바이트(영문 72자 · 한글 24자) 이하로 입력하세요.`, "error");
        return;
      }
      if (isUnder14(fd.get("birth_date"))) {
        setToast("만 14세 미만은 가입할 수 없습니다.", "error");
        return;
      }
      // 세 가지를 모두 확인해야 가입한다(체크박스 required 가 먼저 막지만, 스크립트로 우회돼도 한 번 더)
      if (!boxes().every(b => b.checked)) {
        setToast("이용약관 · 개인정보 수집·이용 · 투자 유의사항을 모두 확인해 주세요.", "error");
        return;
      }
      try {
        await api("/api/auth/register", {
          method: "POST",
          // terms_version · agreed — 서버가 동의한 판과 항목을 감사 기록에 남긴다(나중에 입증)
          body: { name: fd.get("name"), email: String(fd.get("email") || "").trim(), password,
                  terms_version: TERMS_VERSION, agreed: boxes().map(b => b.dataset.id),
                  birth_date: fd.get("birth_date") },
        });
        location.replace(safeNextPath());   // 가입 뒤 뒤로가기로 가입 화면이 다시 나오지 않게
      } catch (err) {
        setToast(err.message, "error");
      }
    });
  </script>
</body>
</html>

# Qurious CI — 회귀 신호등 (게이트가 아니다)
#
# 무엇을 하지 않는가 —
# 이 워크플로는 병합을 막지 않는다. 저장소 룰셋에 필수 상태 검사를 **등록하지
# 않기로** 결정했기 때문이다(ADR-0002). 팀은 「작업자가 올리고 작업자가 머지하되
# 이슈·PR 로 이중 검증」 방식으로 일하고, 게이트는 그 흐름을 가로막는다.
# 실패하면 빨간 X 가 뜰 뿐이고, 넘길지 고칠지는 사람이 판단한다.
#
# 그런데 왜 두는가 —
# 사람 리뷰가 원리상 볼 수 없는 것이 있다. 시험 23건 중 3건은 저장소 전체를 훑는다
# (app/ 전체의 paper=False 하드코딩 · 야후 참조 기준선 2건). PR 리뷰는 「이 변경이
# 맞는가」를 보는 도구이지 「저장소가 여전히 맞는가」를 보는 도구가 아니다.
# 실제로 paper=False 는 여러 PR 을 거치며 사람 눈앞을 지나갔고 전수 조사에서야 잡혔다.
#
# 판단 근거 docs/ADR/ADR-0002-CI를-게이트가-아니라-신호로-둔다.md
# 명세      docs/배포/CI-CD명세_v1.1.md
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # 수동 실행. 워크플로가 실제로 등록·동작하는지 확인할 때 쓴다.
  # ⚠️ 이 버튼은 **기본 브랜치에 이 파일이 있어야** 나타난다 — 저장소에 워크플로가
  #    하나도 없던 상태에서 새로 들이는 중이라, main 에 들어가기 전에는 보이지 않는다.
  workflow_dispatch:

# 같은 PR 에 연달아 푸시하면 앞 실행을 취소한다. 러너 시간을 아끼고,
# 마지막 커밋의 결과만 남아 판정이 헷갈리지 않는다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: pytest
        # 실거래 승인 변수는 절대 켜지 않는다. 켜면 차단 시험이 통과해 버린다.
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest

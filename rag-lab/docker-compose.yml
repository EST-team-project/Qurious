name: domain-rag-lab-local
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ragdb}
      POSTGRES_USER: ${POSTGRES_USER:-raguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragpass}
    ports:
    - 15433:5432
    volumes:
    - postgres_data:/var/lib/postgresql/data
    - ./init.sql:/docker-entrypoint-initdb.d/01-enable-pgvector.sql:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    ports:
    - 6380:6379
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  api:
    build: .
    ports:
    - 80:8000
    env_file:
    - ${APP_ENV_FILE:-.env.local}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ragdb}
      POSTGRES_USER: ${POSTGRES_USER:-raguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragpass}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LEAN_RUNNER: ${LEAN_RUNNER:-local}
      LEAN_LOCAL_WORKDIR: /app/data/lean-workflows
      LEAN_LOCAL_WORKDIR_HOST: ${LEAN_LOCAL_WORKDIR_HOST:-${PWD}/data/lean-workflows}
      LEAN_SSH_HOST: ${LEAN_SSH_HOST:-}
      LEAN_SSH_USER: ${LEAN_SSH_USER:-ubuntu}
      LEAN_SSH_KEY_PATH: ${LEAN_SSH_KEY_PATH:-}
      LEAN_REMOTE_WORKDIR: ${LEAN_REMOTE_WORKDIR:-/home/ubuntu/lean-workflows}
      LEAN_DOCKER_IMAGE: ${LEAN_DOCKER_IMAGE:-quantconnect/lean:latest}
      LEAN_TIMEOUT_SECONDS: ${LEAN_TIMEOUT_SECONDS:-300}
      MONGODB_URL: mongodb://mongo:27017
      MONGODB_DB: ${MONGODB_DB:-investment_db}
      # 분석 화면 RAG(/api/rag/*)가 찾는 Qdrant — vector 프로필을 켜지 않으면 그 기능만 「준비 안 됨」(503)이고 앱은 뜬다.
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      RAG_QDRANT_COLLECTION: ${RAG_QDRANT_COLLECTION:-investment_docs}
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-local-development-search-key-change-me}
      RAG_EMBEDDING_PROVIDER: ${RAG_EMBEDDING_PROVIDER:-hash}
      RAG_EMBEDDING_URL: ${RAG_EMBEDDING_URL:-http://ollama:11434/api/embed}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-embeddinggemma}
      RAG_LLM_BASE_URL: ${RAG_LLM_BASE_URL:-http://ollama:11434/v1}
      RAG_LLM_API_KEY: ${RAG_LLM_API_KEY:-ollama}
      RAG_LLM_MODEL: ${RAG_LLM_MODEL:-qwen3:8b}
      RAG_LLM_TIMEOUT_SECONDS: ${RAG_LLM_TIMEOUT_SECONDS:-180}
      DART_API_KEY: ${DART_API_KEY:-}
      KOSIS_API_KEY: ${KOSIS_API_KEY:-}
      BOK_API_KEY: ${BOK_API_KEY:-}
      LEX_BOT_ID: ${LEX_BOT_ID:-}
      LEX_BOT_ALIAS_ID: ${LEX_BOT_ALIAS_ID:-}
      LEX_LOCALE_ID: ${LEX_LOCALE_ID:-ko_KR}
    extra_hosts:
    - host.docker.internal:host-gateway
    volumes:
    - ./app:/app/app
    - ./frontend:/app/frontend
    - ./data:/app/data
    - ./DATA-ROOT:/app/data/DATA-ROOT:ro
    - /var/run/docker.sock:/var/run/docker.sock
    - ${LEAN_SSH_KEY_HOST_PATH:-/dev/null}:${LEAN_SSH_KEY_PATH:-/run/secrets/lean.pem}:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8000/health
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
  streamlit:
    build: .
    ports:
    - 8290:8501
    env_file:
    - ${APP_ENV_FILE:-.env.local}
    environment:
      API_BASE_URL: http://api:8000
    volumes:
    - ./streamlit_app.py:/app/streamlit_app.py:ro
    depends_on:
      api:
        condition: service_healthy
    command: streamlit run /app/streamlit_app.py --server.port 8501 --server.address
      0.0.0.0
    restart: unless-stopped
  mongo:
    image: mongo:7
    container_name: investment_mongo
    restart: unless-stopped
    ports:
    - ${MONGO_PORT:-27017}:27017
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DB:-investment_db}
    volumes:
    - investment_mongo_data:/data/db
    healthcheck:
      test:
      - CMD
      - mongosh
      - --quiet
      - --eval
      - db.adminCommand('ping').ok
      interval: 10s
      timeout: 5s
      retries: 10
  meilisearch:
    image: getmeili/meilisearch:v1.15.2
    container_name: investment_meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-local-development-search-key-change-me}
    volumes:
    - investment_meilisearch_data:/meili_data
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O - http://127.0.0.1:7700/health >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 12
  ollama:
    image: ollama/ollama:latest
    container_name: investment_ollama
    restart: unless-stopped
    volumes:
    - investment_ollama_data:/root/.ollama
    healthcheck:
      test:
      - CMD
      - ollama
      - list
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
  ollama-init:
    profiles:
    - ollama-init
    image: ollama/ollama:latest
    restart: 'no'
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - ollama pull ${RAG_EMBEDDING_MODEL:-embeddinggemma} && ollama pull ${RAG_LLM_MODEL:-qwen3:8b}
  quiz-init:
    profiles:
    - init
    build:
      context: .
      dockerfile: Dockerfile
    restart: 'no'
    depends_on:
      api:
        condition: service_healthy
    command:
    - sh
    - -c
    - curl --fail --request POST http://api:8000/api/quiz/seed
  search-index:
    profiles:
    - tools
    build: .
    restart: 'no'
    environment:
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-local-development-search-key-change-me}
    volumes:
    - ./docs:/app/docs:ro
    depends_on:
      meilisearch:
        condition: service_healthy
    command:
    - python
    - -m
    - app.ops.index_search
  # ── vector 프로필 (ADR-0002 1단계) ── 문서 벡터 색인 저장소와 색인 잡.
  #   docker compose --profile vector up -d                → qdrant 를 띄우고 docs-index 가 한 번 돈다
  #   docker compose --profile vector run --rm docs-index  → 교재를 고친 뒤 다시 색인
  # 벡터 색인은 정본이 아니다 — 원문(data/curriculum)에서 언제든 다시 만든다.
  qdrant:
    profiles:
    - vector
    image: qdrant/qdrant:v1.15.1
    restart: unless-stopped
    # 스레드 풀이 CPU 수를 따라 커진다 — 빈 저장소 실측 2코어 88 MiB · 22코어 476 MiB(2026-09-28).
    # 교재 색인(수백 점) 규모에는 2코어로 충분하다. 호스트 코어 수보다 크면 도커가 거절하니 1코어 PC 는 QDRANT_CPUS=1.
    cpus: ${QDRANT_CPUS:-2}
    ports:
    - ${QDRANT_PORT:-6333}:6333
    volumes:
    - investment_qdrant_data:/qdrant/storage
    healthcheck:
      # 이미지에 curl·wget 이 없어 bash 의 /dev/tcp 로 준비 상태(/readyz)를 묻는다.
      test:
      - CMD
      - bash
      - -c
      - exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3 && head -1 <&3 | grep -q ' 200'
      interval: 5s
      timeout: 3s
      retries: 12
  docs-index:
    profiles:
    - vector
    build: .
    restart: 'no'
    env_file:
    - ${APP_ENV_FILE:-.env.local}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ragdb}
      POSTGRES_USER: ${POSTGRES_USER:-raguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragpass}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      QDRANT_URL: http://qdrant:6333
      RAG_QDRANT_COLLECTION: ${RAG_QDRANT_COLLECTION:-investment_docs}
    volumes:
    - ./app:/app/app
    - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    # 교재 10단원 → Qdrant(분석 RAG) + PostgreSQL·pgvector(/chat). 같은 청크 id 로 덮어써 여러 번 돌려도 늘지 않는다.
    command:
    - python
    - -m
    - app.ops.index_curriculum
volumes:
  postgres_data: null
  redis_data: null
  investment_mongo_data: null
  investment_ollama_data: null
  investment_meilisearch_data: null
  investment_qdrant_data: null

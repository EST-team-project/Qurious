[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -q --strict-markers
# 비동기 시험 — 기본은 anyio(@pytest.mark.anyio · 아홉 파일). pytest-asyncio 는 strict 라
# @pytest.mark.asyncio 를 붙인 시험만 맡는다(2026-10-21 · requirements-dev.txt).
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
# 저장소 루트를 sys.path 에 얹는다. tests/conftest.py 도 같은 일을 하지만,
# conftest 가 임포트되기 전에 수집 단계에서 필요한 경우가 있다.
pythonpath = .
# 강사님 원본(2026-09-29) — 의존 패키지의 DeprecationWarning 을 걸러 결과를 읽기 쉽게 한다
# Qurious(2026-10-23 · DF-149): 그 뒤 두 줄 — **우리 코드(app. · collector.)가 부른** 폐기 API 만 오류로 본다. 라이브러리는
# stacklevel 로 경고를 부른 쪽에 붙이므로, 없어지기 전에 우리 쪽에서 실패로 드러난다(qdrant-client 의 search 처럼 「조용히 0건」 이
# 되기 전에). 라이브러리끼리의 폐기 경고는 위 줄대로 숨는다(마지막에 맞는 줄이 이긴다). 모듈 칸은 정규식이라 점까지 적는다 —
# 「app」 만 쓰면 apprise 같은 남의 모듈도 걸린다. 지킴이: tests/test_deps_lock.py(TC-DL-07).
filterwarnings =
    ignore::DeprecationWarning
    error::DeprecationWarning:app\.
    error::DeprecationWarning:collector\.

[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -q --strict-markers
# 저장소 루트를 sys.path 에 얹는다. tests/conftest.py 도 같은 일을 하지만,
# conftest 가 임포트되기 전에 수집 단계에서 필요한 경우가 있다.
pythonpath = .
# 강사님 원본(2026-09-29) — 의존 패키지의 DeprecationWarning 을 걸러 결과를 읽기 쉽게 한다
filterwarnings =
    ignore::DeprecationWarning
